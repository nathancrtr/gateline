name: Publish docs site

# Builds site/ and publishes it to GitHub Pages on every push to main that
# touches the site or the packages (the API reference is generated from
# packages/ at build time and is never committed), or that lands a run
# reaching `done` on main (which refreshes the Gatehouse demo's content).
# Pull requests run the same build without deploying, so a stale shell, a
# retired name, or a broken demo fails the PR rather than the deploy.

on:
  pull_request:
    paths:
      - 'site/**'
      - 'packages/**'
      - '.github/workflows/site-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - '.github/workflows/site-pages.yml'
      - 'runs/*/state.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the demo snapshot reads finished runs' own commits
          # and `run/*` branches, which the default shallow clone cannot see.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/package-lock.json
            site/package-lock.json
      - name: Install package workspace (TypeDoc reads its types)
        run: npm ci
        working-directory: packages
      - name: Install site tooling
        run: npm ci
        working-directory: site
      - name: Retired names stay out of the prose
        run: python3 site/scripts/check-names.py
      - name: Page shells match the manifest
        run: python3 site/scripts/build-site.py --check
      - name: Generate the API reference and re-render its shell
        run: npm run docs:api
        working-directory: site
      - name: Assemble the published tree (pages and assets only)
        run: |
          rsync -a --exclude node_modules --exclude .research --exclude scripts \
            --exclude 'package*.json' --exclude typedoc.json --exclude README.md \
            site/ _site/
      - name: Build the Gatehouse demo bundle (static mode)
        run: npm run build:static -w @gateline/web
        working-directory: packages
      - name: Snapshot the demo (finished runs on main + the fixture)
        run: |
          node server/src/snapshot.ts --repo "$GITHUB_WORKSPACE" --repo-id gateline \
            --out "$GITHUB_WORKSPACE/_site/demo" --web-dist web/dist-static
        working-directory: packages
      - name: The demo renders against its snapshot
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:static
        working-directory: packages
        env:
          DEMO_SITE_ROOT: ${{ github.workspace }}/_site
      - name: Publication switch (repository variable GATELINE_PUBLISH_DEMO)
        # Flipping this to "true" is a human decision made outside any run —
        # the demo is built and verified above either way; this step only
        # decides whether it survives into the artifact this job uploads.
        if: vars.GATELINE_PUBLISH_DEMO != 'true'
        run: |
          echo "GATELINE_PUBLISH_DEMO is not 'true': the demo was built and verified but is not being published."
          rm -rf _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
