# Contract: maintained by Orchestrator (human in v0, orchestrator engine in v1);
# read by everyone. Lives at runs/<slug>/state.yaml — the single source of truth
# for a run.
#
# Writers and provenance (docs/ORCHESTRATOR.md §4.3, §7):
#   - Gate entries are written ONLY by the named human approver.
#   - The v1 orchestrator co-writes bookkeeping (phase, task status, ledger,
#     escalations) under a dedicated bot identity — never a person's git
#     config — so machine bookkeeping and human decisions stay distinguishable.
#   - Commit messages touching this file are structured for the audit trail
#     and the metrics reader:
#       human decision grammar (reserved for humans):
#         state(<slug>): G2 approved by <name> [burden: light-correction]
#         state(<slug>): staged by <name> [client-key: <key>]
#           (client-key suffix present only when a key was supplied at staging)
#         state(<slug>): armed by <name>
#         state(<slug>): closed by <name> [disposition: already-delivered]
#         state(<slug>): reopened to <phase> by <name> (was closed as <disposition>)
#       orchestrator bookkeeping verbs (bot identity only):
#         state(<slug>): dispatched|bounced|advanced|escalated|paused|metered …

run: example-slug
branch: run/example-slug
phase: spec               # spec | plan | implement | integrate | release | done | paused | closed
                          # (reduced profiles skip phases: see `profile` below)
                          # `done` and `closed` are both terminal: `done` is a run
                          # that finished its pipeline, `closed` one a human ended
                          # short of it. Nothing derives from either.
profile: full             # patch | standard | full — which roles run and which
                          # gates exist (DESIGN.md §4.1). Absent → full, so every
                          # pre-profile run record keeps its meaning. Recorded at
                          # init from the intent brief; upgrades mid-run are a
                          # human edit to a heavier value only — the orchestrator
                          # escalates on a downgrade rather than guessing.
paused_reason: null       # set when phase=paused: budget-exhausted | round-cap | escalation | gate-declined | staged
                          # (staged: a staged-but-unarmed run; `gateline arm` starts it)

# closure:                # REQUIRED when phase=closed, absent otherwise. Written
#                          # only by the named human who closed the run — the
#                          # orchestrator never ends a run, it only pauses one.
#   as: already-delivered  # already-delivered | superseded | obsolete | abandoned
#                          #   already-delivered — the work shipped by another
#                          #     path; this record closes to match reality
#                          #   superseded — later work overtook it
#                          #   obsolete — the need itself went away
#                          #   abandoned — a deliberate walk-away mid-flight
#                          # Typed, not free text: which of these a closure meant
#                          # lives in the human's head at closing time and nowhere
#                          # in the record, so an untyped closure can never be
#                          # re-derived into a category later.
#   by: someone            # the named human; never a bot identity
#   at: 2026-01-01T00:00:00Z   # ISO-8601
#   reason: "…"            # required — the comment on the disposition
#
# Closing decides a run; it deletes nothing. The branch, the run directory and
# every artifact stay put, per the "completed runs are historical records"
# invariant. A closure is reversible by `gateline reopen`, which clears this
# block in a commit of its own.

# intake:                 # optional; present only on runs created via the staging
#                          # seam. Source-agnostic staging provenance — written once
#                          # at staging time and never edited after.
#   source: cli            # what staged the run (e.g. cli, api, web)
#   ref: "upstream item reference"  # a generic pointer to whatever prompted the
#                          # run (opaque to this contract — no tracker vocabulary)
#   url: null               # optional link for humans following the reference
#   client_key: null        # optional idempotency key supplied by the caller
#   staged_by: someone      # who (or what) staged the run

budget:
  cost_limit_usd: 50      # exhaustion pauses the run; it never silently degrades
  cost_spent_usd: 0       # derived: the sum of ledger[].cost_usd. v0: update it when
                          # appending a ledger entry; v1: the orchestrator updates it
                          # in the same commit as each dispatch's closing bookkeeping.
  ledger: []              # append-only, one entry per model invocation:
                          #   {at, role, task, round, adapter, model,
                          #    tokens_in, tokens_out, cost_usd}
                          # task/round null when not applicable. Two optional
                          # flags close an entry that did not succeed:
                          # `failed: true` — the harness ran and did not
                          # complete (crash, timeout, aged out); cost_usd is
                          # real usage when known, else the registry estimate.
                          # `refused: true` — no process was spawned (a held
                          # checkout, a preflight error); cost_usd is 0, and
                          # the entry counts as neither a failure nor a retry.
                          # One more optional key names the writer:
                          # `engine: <hostname>:<pid>` — which orchestrator
                          # process opened the entry. An open entry is the only
                          # durable record that an agent is running, and the
                          # stale sweep reads this to tell a crashed process's
                          # orphan (age it out, re-dispatch) from another live
                          # process's job (leave it alone). Absent on entries
                          # written by hand or before the key existed, which the
                          # sweep treats as its own.
                          # `session: <id>` — what the runner called this
                          # dispatch's own agent session, when that runner has
                          # such a thing. A retry of the same role+task+round
                          # resumes it, so the second attempt keeps what the
                          # first worked out instead of re-deriving it; a new
                          # round starts fresh. It is a hint and never a
                          # handle: nothing is derived from it, and a session
                          # the runner will not take costs one fresh dispatch
                          # and nothing else. Absent for runners with no
                          # session of their own.
                          # v0: append by hand
                          # from harness usage output (a smaller, more concrete ask
                          # than maintaining a total); v1: the dispatch seam appends
                          # automatically. Facts, not a running total — totals are
                          # derived, so races and audits survive.

gates:                    # carries exactly the profile's gates (patch: G1+G2;
                          # standard: G0–G2; full: all four) — a gate outside
                          # the profile is absent, never auto-approved.
                          # A gate entry is written ONLY by the named human.
                          # `at` should be an ISO-8601 timestamp (a bare date
                          # parses, but decision-latency metrics degrade).
                          # A decided entry may carry `burden` — how much work
                          # the review took: confirmation | light-correction |
                          # heavy-correction. The gate frontend records it in
                          # the act of deciding; it is the pilot's headline
                          # metric, so hand-recorded decisions should set it too.
  G0: {approved: false, by: null, at: null, notes: null}
  G1: {approved: false, by: null, at: null, notes: null}
  G2: {approved: false, by: null, at: null, notes: null}
  G3: {approved: false, by: null, at: null, notes: null}

tasks:                    # mirrors tasks/*.yaml status; the ONLY home of review_rounds
                          # status: pending | dispatched | failed | in-progress |
                          #         in-review | review-approved | verified | done
                          # `dispatched`: a producer was launched but has not yet
                          # committed its artifact — the v1 commit-then-launch guard
                          # (docs/ORCHESTRATOR.md §4.4). `in-progress`: a v0 /
                          # hand-written status the engine never writes; it reads
                          # it as in flight ONLY alongside an open ledger entry for
                          # the task, and otherwise returns the task to `pending`,
                          # because a status nothing is working is a rest with no
                          # exit. `failed`: the implementer
                          # failed twice and the run escalated; the orchestrator
                          # returns the task to pending once the naming escalation
                          # is resolved. `review-approved`: review passed,
                          # verification still pending (first improvised in the
                          # wordfreq run, contractual since).
  - {id: 01-example-slug, status: pending, review_rounds: 0}

escalations: []           # append-only: {at, from_role, reason, resolved}
