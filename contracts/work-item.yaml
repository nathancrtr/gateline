# Contract: produced by Architect (in a patch run: by the human author,
# alongside the intent brief — DESIGN.md §4.1); consumed by exactly one
# Implementer.
# Filename: tasks/NN-slug.yaml (NN orders display, not execution — `depends_on` orders execution).
# All top-level keys required; `notes` starts empty and is append-only during the run.

id: 01-example-slug
title: One-line description of the work
requirements: [R1]        # spec requirement numbers this task covers

scope: |
  What to build, in a few sentences. The Implementer gets only this file,
  plan.md, and spec.md — write accordingly.

file_contact_surface:     # files this task will create or modify — the
  - src/example/thing.py  # Orchestrator parallelizes tasks with disjoint surfaces
  - tests/test_thing.py
                          # Post-G1, this list changes only via an architect
                          # amendment (a dated ADR in plan.md, referenced by the
                          # widening commit — roles/architect.md "Amendment mode")
                          # or the gate human (WALKTHROUGH.md, surface-widening).

acceptance_tests:         # how the Implementer knows they're done;
  - AC1.1                 # reference spec criteria and/or add task-specific ones
  - "pytest tests/test_thing.py passes"

depends_on: []            # ids of tasks that must merge first

status: pending           # pending | in-progress | in-review | review-approved | verified | done
                          # (review_rounds is tracked ONLY in the run's state.yaml —
                          #  duplicating it here caused drift in the wordfreq run)

notes: |
  # Append-only log. Notes record what the diff and the plan cannot show: a
  # departure from the plan and why, something discovered that the plan
  # didn't know, how a finding was fixed, why a finding is not accepted, or
  # a claim the Reviewer should check. They never list files touched or
  # describe the change — the diff already shows both — and narration of
  # the work (false starts, what was tried first) stays out unless it
  # changes what the Reviewer should check.
  # Each round of entries opens with a marker line, "round N:". Each entry
  # after it opens with one label, lowercase, then its plain sentence:
  # deviation:, discovery:, fixed F<n>:, rebuttal F<n>:, or claim: (F<n>
  # names the finding). Round 2+ needs one fixed or rebuttal entry per
  # finding — the entry that tells the Orchestrator you've responded. Test
  # results appear once per round, as the command and its result, for the
  # suites the task touched, standing alone with no label — never restated
  # as they drift. Claim only what you checked.
  # BUDGET: target ~150 words per round; never exceed 300.
