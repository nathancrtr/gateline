# Gatehouse hosted single-user instance — example Fly.io config.
# Copy to fly.toml at the repository root, set an app name and region, then
# follow docs/DEPLOY.md. fly.toml is gitignored on purpose: it is instance
# configuration, not framework code.

app = "CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[mounts]
  source = "gatehouse_data"
  destination = "/data"

[env]
  FETCH_INTERVAL = "60"
  # Orchestrator (hosted dispatch) — the blessed default is co-located
  # (one machine, one clone, one authority; docs/TOPOLOGY.md §3.1). Billing
  # is by API key (ANTHROPIC_API_KEY secret); flip to "0" for a viewer-only
  # deployment. See docs/DEPLOY.md before first enabling.
  ORCH_ENABLED = "1"
  ORCH_SPEND_LIMIT_USD = "25"
  # Flat-rate-billed harness? Set ORCH_NO_BUDGET_ENFORCEMENT = "1" to meter
  # spend without ever pausing on caps (#109), and drop ORCH_SPEND_LIMIT_USD.

# Secrets (fly secrets set ...): REPO_URL, GIT_TOKEN, GIT_USER_NAME,
# GIT_USER_EMAIL, TUNNEL_TOKEN, GITHUB_WEBHOOK_SECRET, GITHUB_TOKEN,
# ANTHROPIC_API_KEY (when ORCH_ENABLED=1).

# No [http_service] / [[services]] section on purpose: with a Cloudflare
# tunnel (TUNNEL_TOKEN secret) the machine exposes no public port at all.
# Traffic enters through the tunnel and Cloudflare Access authenticates it
# before it reaches Gatehouse, which has no auth of its own.
#
# Keep exactly one machine: the git clone on the volume is single-writer.
#   fly scale count 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
