<title>Gatehouse Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<style>
/* ---------- the lightbox around the mockups (deliberately single-theme) ---------- */
:root { --lb-bg:#232321; --lb-ink:#E6E3DC; --lb-mute:#9E9A90; --lb-line:#3A3A37; }
html, body { background: var(--lb-bg); }
body { color: var(--lb-ink); font: 13px/1.5 Inter, system-ui, sans-serif; margin:0; min-height:100vh; }
#bar { position: sticky; top:0; z-index: 5; background: var(--lb-bg); border-bottom:1px solid var(--lb-line); padding: 10px 24px 8px; display:flex; flex-direction:column; gap:6px; }
#bar .row { display:flex; align-items:baseline; gap: 18px; flex-wrap: wrap; }
#bar .t { font-weight:600; font-size:14px; margin-right: 6px; }
#bar .sub { color: var(--lb-mute); }
.tabs { display:flex; gap: 2px; flex-wrap: wrap; }
.tabs button { background:none; border:0; color: var(--lb-mute); font: 500 13px Inter, sans-serif; padding: 4px 10px; cursor:pointer; border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--lb-ink); }
.tabs button[aria-pressed="true"] { color: var(--lb-ink); border-bottom-color: var(--lb-ink); }
.tabs button:focus-visible { outline: 2px solid #C9C5BB; outline-offset: 2px; }
#gate { color: var(--lb-mute); font: 12px/1.5 "JetBrains Mono", monospace; }
#gate b { color: var(--lb-ink); font-weight: 600; }
#stage { padding: 20px 24px 40px; overflow-x:auto; }
.frame { width:1280px; margin: 0 auto; box-shadow: 0 0 0 1px #000; }
.cmp { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items:start; }
.cmp > div { min-width: 0; }
.cmp .cap { color: var(--lb-mute); font-size:12px; margin: 0 0 8px; }
.cmp .cap b { color: var(--lb-ink); }
.scaler { overflow:hidden; width: 100%; }
.scaler .frame { transform-origin: top left; margin:0; }

/* ---------- shared structure inside a mockup ---------- */
.app { display:grid; grid-template-columns: 210px 1fr; min-height: 900px; font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.app a { color: inherit; text-decoration: none; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.num { font-variant-numeric: tabular-nums; }
.read { font-family: Newsreader, Georgia, serif; font-size: 16.5px; line-height: 1.68; max-width: var(--measure); }
.read h2 { font: 600 22px/1.2 Inter, sans-serif; margin: 28px 0 10px; }
.read h3 { font: 600 15px/1.3 Inter, sans-serif; margin: 22px 0 8px; }
.read p { margin: 0 0 14px; }
.read ul { margin: 0 0 14px; padding-left: 1.3em; }
.read li { margin: 0 0 5px; }
.read code { font: 0.86em "JetBrains Mono", monospace; }
.read .ac { font-family: "JetBrains Mono", monospace; font-size: 12px; margin-right: 6px; }
.hint { font: 10.5px/1.7 "JetBrains Mono", monospace; text-align:right; }
.hint kbd { font: inherit; padding: 0 3px; border: 1px solid currentColor; }
.srow { display:flex; align-items:center; gap: 12px; }
.grow { flex: 1; }
.right { text-align: right; }
.small { font-size: 12.5px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ============ Direction A (A1 the impression, A2 the stamp rack) ============ */
.d-a { --bg:#DCDCD4; --page:#ECECE4; --ink:#2C343C; --imp:#1C2424; --muted:#4C5454; --rule:#A4ACB4; --red:#A46C6C; --measure: 640px; }
.d-a2 { --c-phase:#8CA4C4; --c-human:#F4BCC4; --c-rest:#BCBCAC; --c-gate:#CC4434; --c-gate-text:#FDFBFB; }
.d-a .app { background: var(--bg); color: var(--ink); }
.d-a .rack { padding: 26px 0 26px 22px; display:flex; flex-direction:column; gap: 22px; }
.d-a .word { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.d-a .word small { display:block; font-weight: 400; font-size: 12px; color: var(--muted); }
.d-a .rack nav { display:flex; flex-direction:column; gap: 4px; padding-right: 22px; }

.d-a .rack nav a .imp { min-width: 20px; text-align:center; }

.d-a .muted { color: var(--muted); }
.d-a .ledger { border-top: 1px solid var(--rule); margin-top: 18px; }
.d-a .ledger .r { display:grid; align-items:start; border-bottom: 1px solid var(--rule); }
.d-a .ledger .c { padding: 11px 12px 11px 0; min-width: 0; }
.d-a .ledger .c.post { border-left: 1.5px solid var(--red); padding-left: 12px; }
.d-a .ledger .hd .c { padding: 6px 12px 6px 0; font-size: 11.5px; color: var(--muted); }
.d-a .ledger .foot { display:flex; justify-content:space-between; padding: 8px 0; font-size: 12px; color: var(--muted); }
.d-a .imp { display:inline-block; font: 500 11px/1 "JetBrains Mono", monospace; padding: 4px 6px 3px; border: 1.5px solid currentColor; letter-spacing: .02em; white-space: nowrap; vertical-align: middle; }
.d-a .imp.fill { background: var(--imp); color: var(--page); border-color: var(--imp); }

.d-a .imp.hatch { padding-left: 16px; background: repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 4px) left / 10px 100% no-repeat; }
.d-a .imp.stamped { transform: rotate(-1.6deg); filter: url(#grain); }
.d-a .imp.red { color: var(--red); border-color: var(--red); }
.d-a .imp.red.fill { background: var(--red); color: var(--page); }
.d-a .filters { display:flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
.d-a .filters .imp { color: var(--muted); }
.d-a .filters .imp.on { color: var(--ink); }
.d-a .title { font-weight: 600; font-size: 15px; }
.d-a .kicker { font: 500 11px/1.4 "JetBrains Mono", monospace; color: var(--muted); }
.d-a .btn { display:inline-block; font: 600 13px/1 Inter, sans-serif; padding: 9px 14px; border: 1.5px solid var(--imp); background: var(--imp); color: var(--page); }
.d-a .btn.quiet { background: transparent; color: var(--ink); border-color: var(--ink); }
.d-a .spine { display:flex; align-items:flex-start; gap: 6px; margin-top: 16px; }
.d-a .spine .cell { display:flex; flex-direction:column; align-items:center; gap: 3px; }
.d-a .spine .cell .note { font: 10.5px/1.2 "JetBrains Mono", monospace; color: var(--muted); text-align:center; height: 26px; }
.d-a .spine .link { flex: 1; max-width: 60px; min-width: 8px; height: 1px; background: var(--rule); margin-top: 11px; }
.d-a .spine .cur { color: var(--red); border-color: var(--red); border-style: dashed; }
.d-a .vitals { display:grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.d-a .board .r { display:grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 6px 0; border-top: 1px solid var(--rule); align-items:center; font-size: 13px; }
.d-a .tabs2 { display:flex; gap: 22px; border-bottom: 1px solid var(--rule); margin-top: 18px; }
.d-a .tabs2 a { padding: 8px 0; color: var(--muted); font-weight: 500; }
.d-a .tabs2 a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.d-a .post-col { display:grid; grid-template-columns: 1fr 300px; gap: 0; margin-top: 18px; }
.d-a .post-col .main { padding-right: 28px; }
.d-a .post-col .post { border-left: 1.5px solid var(--red); padding-left: 22px; }
.d-a .packet { display:flex; flex-wrap:wrap; gap: 6px; margin-top: 12px; }
.d-a .reading { display:grid; grid-template-columns: 220px 1fr; gap: 28px; margin-top: 18px; }
.d-a .arts { display:flex; flex-direction:column; border-top: 1px solid var(--rule); }
.d-a .arts a { display:flex; justify-content:space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); font: 12.5px "JetBrains Mono", monospace; color: var(--muted); }
.d-a .arts a.on { color: var(--ink); font-weight: 600; }
.d-a .reg .r { grid-template-columns: 96px 150px 110px 1fr 90px; }
.d-a .reg .c { padding-top: 7px; padding-bottom: 7px; font-size: 13px; }
.d-a .pf .r { grid-template-columns: 44px 180px 180px 226px 60px 60px 150px 80px; }
.d-a .gates { display:inline-flex; gap: 4px; }
.d-a .meter { position:relative; height: 8px; width: 140px; border: 1px solid var(--rule); display:inline-block; vertical-align: middle; }
.d-a .meter i { display:block; height:100%; background: var(--ink); }

.d-a .mix { display:inline-flex; height: 12px; width: 180px; gap: 2px; vertical-align: middle; }
.d-a .mix i { display:block; height:100%; border: 1px solid var(--ink); box-sizing: border-box; }
.d-a .mix .s1 { background: var(--ink); }
.d-a .mix .s2 { background-image: repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 4px); }

.d-a .legend { display:flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 8px; }

.d-a .form { display:grid; grid-template-columns: 1fr 500px; gap: 40px; margin-top: 18px; }
.d-a label.f { display:block; font-size: 12px; color: var(--muted); margin-top: 14px; }

.d-a .in.ta { min-height: 74px; font-family: Newsreader, serif; font-size: 15px; }
.d-a .preview { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 18px 0; background-image: linear-gradient(var(--rule) 1px, transparent 1px); background-size: 100% 26px; background-position: 0 6px; }
.d-a .preview .g { font: 600 18px/1.35 Inter, sans-serif; margin-top: 10px; }
.d-a .preview .files { margin-top: 18px; font: 12.5px "JetBrains Mono", monospace; }
.d-a .preview .files .r { display:flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--rule); }
.d-a .hint { color: var(--muted); margin-top: 10px; }
/* A2: the stamp bodies, class-coloured, edge-on */
.d-a2 .pick[data-class] { border-color: transparent; color: var(--ink); box-shadow: 2px 2px 0 var(--imp); }
.d-a2 .pick[data-class="phase"] { background: var(--c-phase); }

.d-a2 .pick[data-class="phase"].dot { box-shadow: none; border: 1.5px dotted var(--muted); background: transparent; color: var(--muted); }
.d-a2 .filters .imp.on { box-shadow: 2px 2px 0 var(--imp); }

.d-b .btn { display:inline-block; font: 700 12px/1 "JetBrains Mono", monospace; letter-spacing: .04em; padding: 10px 14px; background: var(--blue); color: var(--sheet); outline: 2px dotted var(--sheet); outline-offset: -4px; }

  document.getElementById('gate').innerHTML = d.gate ? `gate · ${d.gate}` : 'gate · one screen, three directions, same content and type — see each direction\'s own line for its numbers';
  const stage = document.getElementById('stage');
  if (dir !== 'cmp') { stage.innerHTML = frame(d, screen); return; }
  stage.innerHTML = `<div class="cmp">${DIRS.slice(0,3).map(x => `<div><p class="cap"><b>${x.label}</b></p><div class="scaler">${frame(x, screen)}</div></div>`).join('')}</div>`;
  requestAnimationFrame(fit);
}
function fit() {
  document.querySelectorAll('.cmp .scaler').forEach(sc => {
    const f = sc.querySelector('.frame'); const w = sc.clientWidth; const k = w / 1280;
    f.style.transform = `scale(${k})`; sc.style.height = (f.offsetHeight * k) + 'px';
  });
}
function save() { try { localStorage.setItem('gh-dir', dir); localStorage.setItem('gh-screen', screen); } catch (e) {} }
window.addEventListener('resize', () => { if (dir === 'cmp') fit(); });
render();
</script>
