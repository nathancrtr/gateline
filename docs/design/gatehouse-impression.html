const spine = () => `<div class="spine">${C.run.spine.map((c,i) => {

}).join('')}</div>`;
const runHead = (tab) => `

  <div class="vitals">
    <div class="board">
      <div class="kicker" style="padding-bottom:6px">task board · 0 / 4 done</div>

    </div>
    <div>
      <div class="kicker" style="padding-bottom:6px">vitals</div>

    <a class="${tab==='decide'?'on':''}">Decide <span class="mono small">1</span></a>

S.decide = () => shell('inbox', runHead('decide') + `
  <div class="posting">
    <div class="head">${imp('needs you', 'fill')} ${imp('escalation')} <span class="mono small muted" style="margin-left:auto">waiting 37d</span></div>
    <h2>${C.run.card.title}</h2>

    <div class="mono small muted" style="margin-top:6px">${C.run.card.meta}</div>

    <p class="small muted" style="margin:14px 0 0">Read both sides, then unblock: resolve with a disposition, or edit the spec and let the loop retry.</p>
    <div class="act"><a class="btn">Resolve</a><span class="hint"><kbd>a</kbd> resolve · <kbd>e</kbd> next artifact · <kbd>esc</kbd> inbox</span></div>

S.record = () => shell('inbox', runHead('record') + `
  <div class="reading">
    <div>
      <div class="kicker" style="padding-bottom:6px">the record, in the order it was written</div>
      <div class="arts">${C.run.artifacts.map(p => `<a class="${p==='spec.md'?'on':''}"><span>${p}</span><span>${['spec.md','plan.md','intent-brief.md'].includes(p)?'✓':''}</span></a>`).join('')}</div>
    </div>
    <div>
      <div class="kicker">${C.spec.contract}</div>
      <div class="read">
        <h2>${C.spec.title}</h2>
        <h3>Context</h3><p>${C.spec.context}</p>
        <h3>Requirements</h3>
        ${C.spec.reqs.map(r => `<h3 style="margin-top:18px"><span class="ac">${r.id}</span>${r.name}</h3><p>${r.body}</p><ul>${r.ac.map(([id,t]) => `<li><span class="ac">${id}</span>${t}</li>`).join('')}</ul>`).join('')}
      </div>
    </div>
  </div>`);
S.history = () => shell('inbox', runHead('history') + `
  <div class="ledger reg">
    <div class="r hd"><div class="c">date</div><div class="c">by</div><div class="c">verb</div><div class="c">entry</div><div class="c right">cost</div></div>
    ${C.run.history.map(([d,who,v,t,human]) => `
    <div class="r">
      <div class="c mono num">${d}</div>
      <div class="c ${human?'':'muted'}">${who}</div>
      <div class="c">${human ? imp(v, 'fill stamped') : `<span class="mono muted">${v}</span>`}</div>
      <div class="c ${human?'':'muted'}">${esc(t)}</div>
      <div class="c mono num right muted">${(t.match(/\$[\d.]+/)||[''])[0]}</div>
    </div>`).join('')}
    <div class="foot"><span>10 of 50 entries shown · newest first</span><span class="mono">$7.46 metered on this page</span></div>
  </div>`);
const gateCells = (row) => `<span class="gates">${Object.entries(row.gates).map(([g,s]) => imp(`${g} ${GATE_GLYPH[s]}`, GATE_STATE[s])).join('')}</span>`;
const phase = (row) => {
  if (row.phase==='done') return imp('done', 'fill');
  if (row.phase==='staged') return imp('staged', 'dot');
  if (row.phase==='paused') return imp(`paused · ${row.reason}`, 'dot');
  return imp(row.phase, 'cur');
};
S.portfolio = () => shell('portfolio', `
  <div class="srow" style="align-items:baseline"><h1 class="grow">Portfolio</h1><a class="btn">New run</a></div>
  <div class="sub1">Each run's progress through its gates, recomputed from its branch.</div>
  <div class="ledger pf" style="margin-top:22px">
    <div class="r hd"><div class="c"></div><div class="c">run</div><div class="c">phase</div><div class="c">gates</div><div class="c right">tasks</div><div class="c right">rounds</div><div class="c">budget</div><div class="c right">updated</div></div>
    ${C.portfolio.map(r => `
    <div class="r">
      <div class="c">${r.needs ? imp(String(r.needs), 'fill') : ''}</div>
      <div class="c"><div class="mono" style="font-weight:600">${r.slug}</div><div class="mono small muted">gateline · ${r.profile}</div></div>
      <div class="c">${phase(r)}</div>
      <div class="c">${gateCells(r)}</div>
      <div class="c mono num right small">${r.tasks}</div>
      <div class="c mono num right small ${r.rounds===3?'':'muted'}">${r.rounds===3?'<b>3</b>':r.rounds}</div>
      <div class="c small">${r.budget ? `<span class="meter" style="width:90px"><i class="${r.over?'over':''}" style="width:${Math.min(100, r.budget[0]/r.budget[1]*100)}%"></i></span><div class="mono num ${r.over?'':'muted'}">$${r.budget[0]} / $${r.budget[1]}${r.over?' · <b>over</b>':''}</div>` : '<span class="mono muted">unmetered</span>'}</div>
      <div class="c mono num right small muted">${r.age}</div>
    </div>`).join('')}
    <div class="foot"><span>10 of 19 runs shown · 4 need you</span><span class="mono">approved ${imp('✓','fill')} declined ${imp('✕','struck')} pending ${imp('·')} bounced ${imp('⚠','hatch')} absent ${imp('·','dot')}</span></div>
  </div>`);
S.newrun = () => shell('portfolio', `
  <h1>Stage a run</h1>
  <div class="sub1">Author the intent brief, choose a profile and a budget. Staging commits the record shown and nothing more.</div>
  <div class="form">
    <div>
      <label class="f">Title<input class="in" value="${C.newrun.title}"></label>
      <label class="f">Slug <span class="mono">run/${C.newrun.slug}</span><input class="in mono" value="${C.newrun.slug}"></label>
      <div class="srow" style="gap:20px">
        <label class="f grow">Profile<div class="srow" style="margin-top:6px">${['patch','standard','full'].map(p => imp(p, p===C.newrun.profile?'fill':'')).join('')}</div></label>
        <label class="f" style="width:140px">Budget ceiling (USD)<input class="in mono num" value="${C.newrun.budget}"></label>
      </div>
      ${C.newrun.sections.map(([h,t]) => `<label class="f"><span class="mono">## ${h}</span>${t?'':' <span class="muted">· required</span>'}<textarea class="in ta">${esc(t)}</textarea></label>`).join('')}
      <div class="srow" style="margin-top:22px"><a class="btn">Stage this run</a><span class="small muted">Creates run/csv-importer and commits the record shown. Nothing dispatches, nothing is spent.</span></div>
    </div>
    <div>
      <div class="kicker">the record this stages · 3 of 4 sections filled</div>
      <div class="preview" style="margin-top:8px">
        <div class="mono small muted">new branch <b>run/${C.newrun.slug}</b> off main</div>
        <div class="g">${imp('genesis · not ready', 'dot')}<br>${C.newrun.commit}</div>
        <div class="mono small muted">[client-key: ${C.newrun.key}]</div>
        <div class="small" style="margin-top:8px"><b>${C.approver}</b> <span class="muted">author &amp; committer</span></div>
        <div class="files">
          <div class="r"><span>runs/${C.newrun.slug}/state.yaml</span><span class="muted">${C.newrun.lines} lines · new</span></div>
          <div class="r"><span>runs/${C.newrun.slug}/intent-brief.md</span><span class="muted">3 of 4 · new</span></div>
          ${C.newrun.sections.map(([h,t]) => `<div class="r" style="border:0;padding:2px 0 2px 18px"><span class="${t?'':'muted'}">${t?'✓':'·'} ${h}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`);
S.metrics = () => shell('metrics', `
  <h1>Metrics</h1>
  <div class="sub1">Computed from state.yaml history — nothing is logged separately. Sustained approval above 90% means a gate is over-triggering.</div>
  <div class="ledger" style="max-width:900px;margin-top:22px">
    <div class="r hd" style="grid-template-columns:60px 80px 260px 240px 1fr"><div class="c">gate</div><div class="c right">decisions</div><div class="c">approval rate</div><div class="c">burden mix</div><div class="c right">median latency</div></div>
    ${C.metrics.gates.map(([g,n,rate,over,mix,lat]) => `
    <div class="r" style="grid-template-columns:60px 80px 260px 240px 1fr">
      <div class="c mono" style="font-weight:600">${g}</div>
      <div class="c mono num right">${n}</div>
      <div class="c"><span class="meter" style="width:140px"><i class="${over?'over':''}" style="width:${rate*100}%"></i><b></b></span> <span class="mono num small">${Math.round(rate*100)}%</span>${over?'<br>'+imp('over-triggering?','red'):''}</div>
      <div class="c"><span class="mix">${mix.map((v,i) => v?`<i class="s${i===3?0:i+1}" style="flex:${v}"></i>`:'').join('')}</span></div>
      <div class="c mono num right">${lat}</div>
    </div>`).join('')}
    <div class="legend"><span><i style="background:var(--ink)"></i>confirmation</span><span><i style="background-image:repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 3px)"></i>light correction</span><span><i style="background-image:radial-gradient(var(--ink) .8px,transparent .9px);background-size:3px 3px"></i>heavy correction</span><span><i style="border-style:dotted"></i>unrecorded</span><span style="margin-left:auto"><i style="border:0;border-left:2px solid var(--red);width:2px"></i>90% threshold</span></div>
  </div>
  <div class="sect">Review rounds per task</div>
  <div class="sub1" style="margin:0 0 10px">Round 4 escalates by rule; tasks at 3+ usually mean a spec ambiguity, not an implementation defect.</div>
  <div style="max-width:460px">${C.metrics.rounds.map(([l,n]) => `<div class="hbar"><span class="mono right muted">${l}</span><span class="track"><i class="${l.startsWith('3')?'cap':''}" style="width:${n/32*100}%"></i></span><span class="mono num">${n}</span></div>`).join('')}</div>
  <div class="sect">Budget honesty</div>
  <div class="sub1" style="margin:0 0 4px">Spend is whatever the run's orchestrator recorded. “Never updated” is a real finding.</div>
  <div class="ledger" style="max-width:760px">
    <div class="r hd" style="grid-template-columns:1fr 90px 130px 200px"><div class="c">run</div><div class="c right">limit</div><div class="c right">recorded spend</div><div class="c">metering</div></div>
    ${C.metrics.budget.map(([r,l,s,u]) => `<div class="r" style="grid-template-columns:1fr 90px 130px 200px"><div class="c mono small">${r}</div><div class="c mono num right small">$${l}</div><div class="c mono num right small">$${s}</div><div class="c small" style="padding-left:14px">${u ? imp('✓ updated during the run') : imp('never updated','hatch')}</div></div>`).join('')}
  </div>`);

/* ---------- grounds ---------- */
const GROUNDS = [
  { id:'s91', hex:'#ECECE4', label:'S91 · as sampled', note:'the lit paper, sampled · 91% · sat 17', flags:['9 units from curricle\'s panel #EAE6E3'] },
  { id:'d92', hex:'#EEEEE8', label:'D92', note:'derived, +1 lightness · 92% · sat 17', flags:['11 units from the Anthropic cream #F4F1EA'] },
  { id:'d93', hex:'#F0F0EA', label:'D93', note:'derived, +2 lightness · 93% · sat 17', flags:['5 units from the Anthropic cream #F4F1EA'] },
  { id:'d94', hex:'#F3F3EE', label:'D94', note:'derived, +3.5 lightness · 94% · sat 17', flags:['inside the 94–98% near-white band', '5 units from curricle\'s ground #F4F2F1'] },
  { id:'c91', hex:'#EBEBE7', label:'C91 · chroma halved', note:'derived, sat 9 at 91%', flags:['10 units from curricle\'s panel #EAE6E3'] },
  { id:'cmp', hex:'', label:'Compare grounds', note:'', flags:[] },
];
const SCREENS = [ ['inbox','Inbox'], ['decide','Run · Decide'], ['record','Run · Record'], ['history','Run · History'], ['portfolio','Portfolio'], ['newrun','New run'], ['metrics','Metrics'] ];
function lum(h){const [r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=0.03928?c/12.92:((c+0.055)/1.055)**2.4);return 0.2126*r+0.7152*g+0.0722*b}
function cr(a,b){const la=lum(a),lb=lum(b);return ((Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05)).toFixed(2)}
let ground = 's91', screen = 'inbox';
try { ground = localStorage.getItem('gi-ground') || ground; screen = localStorage.getItem('gi-screen') || screen; } catch (e) {}
function tabs(el, items, cur, on) {
  el.innerHTML = items.map(([id,label,hex]) => `<button role="tab" aria-pressed="${id===cur}" data-id="${id}">${hex?`<i style="background:${hex}"></i>`:''}${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => on(b.dataset.id)));
}
function frame(g, s) { return `<div class="frame d-a" style="--bg:${g.hex}">${S[s]()}</div>`; }
function gateLine(g) {
  const bg = g.hex;
  return `ground <b>${bg}</b> · ${g.note} · ink ${cr('#2C343C',bg)} · muted ${cr('#5A6262',bg)} · red ${cr('#A46C6C',bg)} (non-text) · rule ${cr('#A4ACB4',bg)} (decorative)` + (g.flags.length ? ' · ' + g.flags.map(f=>`<span class="flag">⚑ ${f}</span>`).join(' · ') : '');
}
function render() {
  tabs(document.getElementById('grounds'), GROUNDS.map(g => [g.id, g.label, g.hex]), ground, (id) => { ground = id; save(); render(); });
  tabs(document.getElementById('screens'), SCREENS, screen, (id) => { screen = id; save(); render(); });
  const g = GROUNDS.find(x => x.id === ground);
  const stage = document.getElementById('stage');
  if (ground !== 'cmp') { document.getElementById('gate').innerHTML = 'gate · ' + gateLine(g); stage.innerHTML = frame(g, screen); return; }
  document.getElementById('gate').innerHTML = 'gate · every lighter step lands nearer a shipped sibling value; the flags on each candidate say which';
  stage.innerHTML = `<div class="cmp">${GROUNDS.slice(0,5).map(x => `<div><p class="cap"><b>${x.label}</b> ${x.hex} — ${x.note}${x.flags.length?' — ⚑ '+x.flags.join('; '):''}</p><div class="scaler">${frame(x, screen)}</div></div>`).join('')}</div>`;
  requestAnimationFrame(fit);
}
function fit() {
  document.querySelectorAll('.cmp .scaler').forEach(sc => {
    const f = sc.querySelector('.frame'); const k = sc.clientWidth / 1280;
    f.style.transform = `scale(${k})`; sc.style.height = (f.offsetHeight * k) + 'px';
  });
}
function save() { try { localStorage.setItem('gi-ground', ground); localStorage.setItem('gi-screen', screen); } catch (e) {} }
window.addEventListener('resize', () => { if (ground === 'cmp') fit(); });
render();
</script>
