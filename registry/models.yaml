# Model registry — the authority for WHICH vendor/model each role gets.
# Roles declare a capability_profile; this file resolves it to a concrete model.
# Swapping vendors is an edit here, never in roles/ or contracts/.
# Adapter manifests (adapters/*/manifest.json) re-spell these bindings in each
# runner's model vocabulary (e.g. anthropic/claude-opus-5-5 -> "claude-opus-5-5"
# in Claude Code, spelled as the full ID rather than an alias so the record
# names the model that ran) — when you change a binding here, update the
# manifests and re-render.
#
# Model IDs below are ILLUSTRATIVE. Pin them to your org's approved, current
# models and re-verify pricing and limits when you do.

profiles:
  frontier-reasoning:
    # Deepest reasoning available; used where judgment concentrates and errors
    # are expensive (architecture, review, verification, orchestration).
    # Cost-insensitive.
    default: anthropic/claude-fable-5-1
    # alternates: add your org's approved models from a second vendor here (P5 needs one)
    alternates: []

  balanced:
    # Strong general capability at moderate cost; the workhorse tier. The
    # current Opus generation is priced below the previous Sonnet one, so it
    # holds this tier on capability and cost alike; anthropic/claude-sonnet-5
    # remains a cheaper option (priced below).
    default: anthropic/claude-opus-5-5
    # alternates: add your org's approved models from a second vendor here (P5 needs one)
    alternates: []

  fast-cheap:
    # High-volume, low-stakes work: triage, summarization, formatting.
    # First binding: historian — evidence-gathering and doc reconciliation,
    # with a human reviewing every sweep branch before merge.
    default: anthropic/claude-haiku-4-5
    # alternates: add your org's approved models from a second vendor here (P5 needs one)
    alternates: []

pricing:
  # $ per million tokens, keyed by the model IDs above. ILLUSTRATIVE like the
  # IDs themselves — re-verify against your org's rates when pinning models.
  # The v1 orchestrator prices each dispatch's usage from this map into the
  # run's budget.ledger[] (docs/ORCHESTRATOR.md §6). A model with no entry
  # here cannot be metered; the dispatch seam refuses it rather than guessing.
  anthropic/claude-fable-5-1: {usd_per_mtok_in: 10, usd_per_mtok_out: 50}
  anthropic/claude-opus-5-5:  {usd_per_mtok_in: 4,  usd_per_mtok_out: 20}
  anthropic/claude-sonnet-5:  {usd_per_mtok_in: 2,  usd_per_mtok_out: 10}
  anthropic/claude-haiku-4-5: {usd_per_mtok_in: 1,  usd_per_mtok_out: 5}
  # The Claude Code adapter spells these bindings as the same IDs without the
  # vendor prefix; its usage report carries cost directly, so these rows back
  # the token-based fallback for that adapter.
  claude-fable-5-1: {usd_per_mtok_in: 10, usd_per_mtok_out: 50}
  claude-opus-5-5:  {usd_per_mtok_in: 4,  usd_per_mtok_out: 20}
  claude-sonnet-5:  {usd_per_mtok_in: 2,  usd_per_mtok_out: 10}
  claude-haiku-4-5: {usd_per_mtok_in: 1,  usd_per_mtok_out: 5}

  # Rates for the opencode adapter's open-weight bindings
  # (adapters/opencode/manifest.json). resolveModel() is adapter-aware (#359):
  # a dispatch keys its pricing lookup on the adapter's own model_map/
  # model_overrides spelling, so these entries key correctly whenever
  # opencode's usage report ever stops carrying its own per-dispatch cost and
  # falls back to token-based metering. Today opencode reports real cost
  # directly, so these entries back that fallback rather than the live path.
  openrouter/z-ai/glm-5.2:            {usd_per_mtok_in: 0.78,  usd_per_mtok_out: 2.45}
  openrouter/deepseek/deepseek-v4-pro:   {usd_per_mtok_in: 0.435, usd_per_mtok_out: 0.87}
  openrouter/deepseek/deepseek-v4-flash: {usd_per_mtok_in: 0.09,  usd_per_mtok_out: 0.18}
  openrouter/moonshotai/kimi-k2.6:    {usd_per_mtok_in: 0.66,  usd_per_mtok_out: 3.41}
  openrouter/minimax/minimax-m3:      {usd_per_mtok_in: 0.60,  usd_per_mtok_out: 2.40}

dispatch_estimates_usd:
  # Conservative static per-dispatch estimates for the pre-flight budget check
  # (settled 2026-07-10: static for v1; trailing ledger averages are a possible
  # later upgrade). Before any dispatch: ledger sum + this estimate projected
  # over the limit → pause `budget-exhausted` and escalate. Pause, never degrade.
  orchestrator: 0.50   # single-shot judgment calls (escalation summary, triage)
  analyst: 2
  architect: 5
  implementer: 8
  reviewer: 4
  verifier: 10     # frontier tier since 2026-09-25: runs code and writes tests at the priciest output rate
  ops: 2
  historian: 1     # one sweep: read an interval's artifacts, edit docs, write the delta

bindings:
  orchestrator: {profile: frontier-reasoning}
  analyst:      {profile: balanced}
  architect:    {profile: frontier-reasoning}
  implementer:  {profile: balanced}

  # P5 decorrelation: reviewer and verifier must not resolve to the same vendor
  # as implementer. `avoid_vendor_of` makes the constraint explicit so an
  # orchestrator (or a human doing v0 dispatch) can enforce it. Both sit on the
  # frontier tier so that, in a single-vendor harness, the lineage-split
  # fallback also keeps them off the implementer's model.
  reviewer:     {profile: frontier-reasoning, avoid_vendor_of: implementer}
  verifier:     {profile: frontier-reasoning, avoid_vendor_of: implementer}

  ops:          {profile: balanced}

  # Historian is scheduled, not gate-driven (orchestrator.yaml `schedules:`);
  # its sweep branch is human-reviewed before merge, so the cheap tier is safe.
  historian:    {profile: fast-cheap}
