      notes: null,
      burden: confirmation
    }
  G2: { approved: false, by: null, at: null, notes: null }
  G3: { approved: false, by: null, at: null, notes: null }

tasks: # mirrors tasks/*.yaml status; the ONLY home of review_rounds
  - { id: 01-renderer-single-file-mode, status: review-approved, review_rounds: 1 }
  - { id: 02-agents-md-manifest-and-output, status: dispatched, review_rounds: 0 }

escalations:
  # append-only: {at, from_role, reason, resolved}
  - {
      at: 2026-07-13T22:57:00Z,
      from_role: architect,
      reason: "v0 orchestrator switched session worktrees mid-dispatch (to an
        unrelated fix branch), revoking the Architect's write access; task-02
        write refused. Resolved by restoring the run worktree and re-issuing the
        write, content byte-identical. Finding: v0 operator must not change
        worktree isolation while a dispatch is in flight.",
      resolved: true
    }
