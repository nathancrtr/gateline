# Contract: maintained by Orchestrator (human in v0); read by everyone.
# Lives at runs/<slug>/state.yaml — the single source of truth for a run.

run: agents-md-adapter
branch: run/agents-md-adapter
phase: implement # spec | plan | implement | integrate | release | done | paused
paused_reason: null # set when phase=paused: budget-exhausted | round-cap | escalation | gate-declined

budget:
  cost_limit_usd: 50 # exhaustion pauses the run; it never silently degrades
  cost_spent_usd: 2.69 # derived: the sum of ledger[].cost_usd
  ledger:
    # append-only, one entry per model invocation:
    #   {at, role, task, round, adapter, model,
    #    tokens_in, tokens_out, cost_usd}
    # v0: appended by hand after each dispatch. This
    # harness reports combined subagent tokens only
    # (no in/out split): raw total in the entry comment;
    # cost_usd estimated at the model's registry pricing
    # assuming an ~85/15 in/out split.
    - {
        at: 2026-07-13T22:04:07Z,
        role: analyst,
        task: null,
        round: null,
        adapter: claude-code,
        model: anthropic/claude-sonnet-5,
        tokens_in: null,
        tokens_out: null,
        cost_usd: 0.16
      } # 34,242 tok combined
    - {
        at: 2026-07-13T23:08:57Z,
        role: architect,
        task: null,
        round: null,
        adapter: claude-code,
        model: anthropic/claude-fable-5,
        tokens_in: null,
        tokens_out: null,
        cost_usd: 1.29
      } # 53,436 tok combined, incl. escalation-recovery resume (write refused mid-dispatch)
    - {
        at: 2026-07-13T23:28:19Z,
        role: implementer,
        task: 01-renderer-single-file-mode,
        round: 0,
        adapter: claude-code,
        model: anthropic/claude-sonnet-5,
        tokens_in: null,
        tokens_out: null,
        cost_usd: 0.19
      } # 39,302 tok combined
    - {
        at: 2026-07-13T23:40:26Z,
        role: reviewer,
        task: 01-renderer-single-file-mode,
        round: 1,
        adapter: claude-code,
        model: anthropic/claude-fable-5,
        tokens_in: null,
        tokens_out: null,
        cost_usd: 1.05
      } # 43,799 tok combined; approve, 2 minor findings

gates:
  # a gate entry is written ONLY by the named human.
  G0:
    {
      approved: true,
      by: Nathan Carter,
      at: 2026-07-13T22:46:56.282Z,
      notes: null,
      burden: confirmation
    }
  G1:
    {
      approved: true,
