# Contract: maintained by Orchestrator (human in v0, orchestrator engine in v1);
# read by everyone. Lives at runs/<slug>/state.yaml — the single source of truth
# for a run.

run: creation-seam
branch: run/creation-seam
phase: spec
  # staged by hand ahead of the seam this run builds;
  # resume (= arm) derives spec from the gate ledger
profile: standard # patch | standard | full (DESIGN.md §4.1)
paused_reason: null

budget:
  cost_limit_usd: 60 # exhaustion pauses the run; it never silently degrades
  cost_spent_usd: 0 # derived: the sum of ledger[].cost_usd
  ledger: []

gates:
  # standard profile: G0–G2; the merge is the release.
  # G3 listed only for pre-#156 parser compatibility
  # (all-four-gates schema); remove once #156 is merged
  # and the deployed stack understands profiles.
  G0: { approved: false, by: null, at: null, notes: null }
  G1: { approved: false, by: null, at: null, notes: null }
  G2: { approved: false, by: null, at: null, notes: null }
  G3: { approved: false, by: null, at: null, notes: null }

tasks: []

escalations: []
