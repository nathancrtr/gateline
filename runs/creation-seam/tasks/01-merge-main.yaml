id: 01-merge-main
title: Mechanically merge current origin/main into the run branch (post-#156 tree)
requirements: [R4, R5]

scope: |
  This branch's working tree predates merged PR #156: record/schema.ts,
  record/actions.ts, and orchestrator/src/derive.ts lack the profile machinery
  (PROFILES, PROFILE_GATES, PROFILE_PHASES, D20/D21, deriveResumePhase's
  profile awareness) that every other task builds against. Run
  `git fetch origin && git merge origin/main` on this run branch. The branch's
  only divergence from main should be runs/creation-seam/**, so the merge
  should carry zero content conflicts — if any conflict appears outside
  runs/, or the merged files' shapes contradict plan.md's Interface contracts
  (e.g. PROFILES absent, deriveResumePhase signature differs), STOP and
  escalate per plan ADR-6; do not hand-resolve framework code.
  Make no hand edits in this task: the merge commit is the entire change.

file_contact_surface:
  - "(merge commit only — entire tree, mechanical; no hand-authored hunks)"

acceptance_tests:
  - "grep -n 'PROFILES' frontend/packages/core/src/record/schema.ts finds the profile constants"
  - "grep -n 'D21' frontend/packages/orchestrator/src/derive.ts finds the profile-invariant rule"
  - "cd frontend && npm install && npm test passes on the merged tree"
  - "cd frontend && npm run typecheck passes"

depends_on: []

status: pending

notes: ""
