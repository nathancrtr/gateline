id: 03-g2-card-check
title: The G2 card shows a criterion's check on a line of its own
requirements: [R3]

scope: |
  In `CriterionPacket` (`packages/web/src/components/evidence.tsx`), quote a
  criterion with a check as its `promise` followed by its `check`, the check
  in a block element so it starts a new line under the promise. Follow
  plan.md "Interface contracts — DOM hooks": the existing quotation span
  gains `data-criterion-quote`; the check element carries
  `data-criterion-check`; whitespace separates the two so the wrapper's text
  content, whitespace collapsed, equals the entry's `body`.

  Both pieces stay plain text, as the card quotes today. Add no label, colour
  or fold: the `Check:` label is already the first word of `check`.

  A criterion without a check renders from `body` through today's path; its
  only markup difference is the `data-criterion-quote` attribute.

  Tests go in the new file `packages/web/test/g2-criterion-check.test.ts`,
  as static markup (`renderToStaticMarkup`), following
  `packages/web/test/packet.test.ts` for the providers and wrapping the
  packet in `LexiconProvider` with a lexicon built by `buildLexicon` from a
  spec that has one criterion with a check and one without. Assert:
  - the checked criterion's markup has the promise, then a
    `data-criterion-check` element whose text is exactly `check`
  - the quote's text, tags stripped and whitespace collapsed, equals `body`
  - the unchecked criterion has no `data-criterion-check` element and its
    quote text equals `body`

  Line placement and overflow are browser facts and belong to task 06.

file_contact_surface:
  - packages/web/src/components/evidence.tsx
  - packages/web/test/g2-criterion-check.test.ts

acceptance_tests:
  - AC3.1
  - AC3.2
  - AC3.3
  - "In packages/: `npx vitest run web/test`, `npm run typecheck` and `npm run lint` pass"
  - "AC8.5: the checked-criterion assertions fail against the pre-change evidence.tsx; recorded as a claim in notes"
  - "AC8.6: the unchecked-criterion assertions fail when its path is deliberately broken, then pass once restored; recorded as a claim in notes"

depends_on: [01-lexicon-promise-check]

status: pending

notes: |
  round 1:
  discovery: the G2 packet withholds its criterion view when no verification report is present, so the test fixture has to carry a report with E1/E2 blocks. Without one, no criterion renders at all.
  claim: AC8.5. Against the pre-change evidence.tsx, `npx vitest run web/test/g2-criterion-check.test.ts` gave 4 failed, 3 passed. All three checked-criterion assertions failed because no quote element existed. Other checked-path mutants were each killed: no split (hook kept) failed 2, no separating space failed 1, check not `block` failed 1.
  claim: AC8.6. Breaking the unchecked path was caught both ways, then passed once restored: routing it through the check branch failed 2, and quoting `definition` instead of `body` failed 1.
  `npx vitest run web/test`: 34 files, 544 passed. `npm run typecheck` and `npm run lint` exited 0. The first `npm test` run failed core/test/readiness.test.ts at file level with 0 failed tests. That file passed alone (72/72), and a second full run passed with exit 0: 124 files, 1789 passed, 2 skipped.
