  fixed F2: the new criterion AC1.3 has markdown in its promise and its check, and its inner markup is asserted. Printing the promise as plain text failed 1 test, and printing the check as plain text failed 1.
  fixed F3: AC1.1's promise and check each run past 110 characters, and both checked quotes are asserted free of cutting classes and inline styles. A `truncate` on the check failed 2, a `line-clamp-2` round the promise failed 2, and cutting the check or the promise at 110 characters failed 2 each.
  rebuttal F4: the fix is in `packages/orchestrator/src/deps.ts`, outside this task's surface, and this task names no build check.
  claim: AC8.5. Against the pre-change lexicon.tsx and styles.css, 11 of 20 tests failed. Every new-behaviour test failed. The passes are guards, plus a word-for-word test the old full-text render already met.
  `npx vitest run web/test`: 35 files, 564 passed. `npm run typecheck` and `npm run lint` exited 0. `npm test`: 124 files passed, 1 failed (core/test/readiness.test.ts, beforeAll timed out at 30 s during a 355 s run). Run alone, it passed 72 of 72.
