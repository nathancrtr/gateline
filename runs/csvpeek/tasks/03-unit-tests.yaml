# Contract: produced by Architect; consumed by exactly one Implementer.

id: 03-unit-tests
title: Unit tests for the core functions (parsing, delimiter, types, missing, common, ragged)
requirements: [R2, R3, R4, R5, R6, R7, R8, R10, R11]

scope: |
  Create apps/csvpeek/test_core.py: pytest unit tests that `import csvpeek`
  and exercise the pure functions directly (no subprocess, no CLI — that is
  task 04-cli-tests' file). Test against the interface contract and "Report
  format" in plan.md; csvpeek.py's core functions (task 01-core-logic) are
  already merged. If the environment pre-check fails (python3 or pytest
  missing), escalate per plan.md ADR-2.

  Naming contract (AC11.2, binding — see plan.md "Test-layout contract"):
  individually named test functions whose names include the substrings
  `row_count` (R2), `columns` (R3), `delimiter` (R4), `type` (R5),
  `missing` (R6), `common` (R7). (The `error` substring for R9 belongs to
  task 04's test_cli.py, not this file.)

  Minimum behaviors to cover (one small test each; more granular is fine):
  - row_count: parse_csv on header + 5 data rows -> len(rows) == 5 (AC2.1);
    header-only text -> rows == [] (AC2.2); '' -> ([], []) (AC10.1).
  - columns: header 'name,age,city' -> ['name','age','city'] in order (AC3.1).
  - delimiter: detect_delimiter on a semicolon sample -> ';' and parse_csv
    yields 3 columns (AC4.1); comma baseline still works (AC4.2); empty text
    -> ',' fallback (spec Assumptions).
  - type: infer_type — all-integer -> 'integer' (AC5.1); mixed 1.5/2/3 ->
    'float' (AC5.2); non-numeric or mixed 1/a/3 -> 'string' (AC5.3); blanks
    excluded: ['1','','3'] -> 'integer' (AC6.2); no non-blank values ->
    'string' (AC10.2 support).
  - missing: count_missing(['1','','3']) == 1; all-blank and no-blank cases
    (AC6.1).
  - common: top_values ranks ['x']*10+['y']*5+['z'] with ('x',10) first
    (AC7.1); 7 distinct values -> at most 5 pairs (AC7.2); equal counts order
    by ascending value and the result is identical across two calls (spec
    tie-break assumption).
  - ragged: column_values pads a short row with '' and ignores extra fields
    beyond the header (AC8.1 semantics).
  - format: format_report([],[]) == 'Rows: 0\nColumns: 0\n' exactly (AC10.1);
    format_report(['a','b'], []) lists both columns, reports Rows: 0, types
    'string', and 'Common: (none)' without raising (AC10.2); one small
    populated fixture asserted byte-exactly against plan.md "Report format".

  Constraints: stdlib + pytest only; no fixture files on disk needed (pure
  functions take strings/lists). Do not create __init__.py. If
  `import csvpeek` fails when pytest runs from apps/csvpeek/, add an empty
  apps/csvpeek/conftest.py and record that deviation in this task's notes
  (pre-authorized by plan.md Risks).

file_contact_surface:
  - apps/csvpeek/test_core.py

acceptance_tests:
  - "AC11.1 (partial) — `pytest test_core.py` run from apps/csvpeek/ exits 0"
  - "AC11.2 (partial) — `pytest --collect-only` lists distinct named tests matching the substrings row_count, columns, delimiter, type, missing, common"
  - "All listed spec ACs (AC2.1, AC2.2, AC3.1, AC4.1, AC4.2, AC5.1-5.3, AC6.1, AC6.2, AC7.1, AC7.2, AC8.1 semantics, AC10.1, AC10.2) have a corresponding function-level assertion"

depends_on: [01-core-logic]

status: in-review

notes: |
  Round 1 (implementer): Created apps/csvpeek/test_core.py with 24 tests
  covering all listed ACs (AC2.1, AC2.2, AC3.1, AC4.1, AC4.2, AC5.1-5.3,
  AC6.1, AC6.2, AC7.1, AC7.2, AC8.1 semantics, AC10.1, AC10.2) plus the
  empty-text delimiter fallback and ragged extra-fields case from the task
  scope. `import csvpeek` succeeded on the first pytest run from
  apps/csvpeek/ (Python 3.14.6 / pytest 9.1.1) — the pre-authorized
  conftest.py fallback was NOT needed and was not added.
  `pytest test_core.py -v` from apps/csvpeek/: 24 passed in 0.02s.
  `pytest --collect-only`: 24 tests collected, names include the substrings
  row_count, columns, delimiter, type, missing, common per AC11.2 (verified
  by grep over collected names).
  No deviations from the interface contract; csvpeek.py's ADR-11 delimiter
  fallback (rejected delimiter -> ',') is exercised indirectly by the
  comma/semicolon/empty delimiter tests but no dedicated pathological-input
  test (e.g. '"') was added since it's outside this task's minimum-behaviors
  list and belongs to task 04 if the Reviewer wants CLI-level coverage.
