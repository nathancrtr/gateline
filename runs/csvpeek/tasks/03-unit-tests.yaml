# Contract: produced by Architect; consumed by exactly one Implementer.

id: 03-unit-tests
title: Unit tests for the core functions (parsing, delimiter, types, missing, common, ragged)
requirements: [R2, R3, R4, R5, R6, R7, R8, R10, R11]

scope: |
  Create apps/csvpeek/test_core.py: pytest unit tests that `import csvpeek`
  and exercise the pure functions directly (no subprocess, no CLI — that is
  task 04-cli-tests' file). Test against the interface contract and "Report
  format" in plan.md; csvpeek.py's core functions (task 01-core-logic) are
  already merged. If the environment pre-check fails (python3 or pytest
  missing), escalate per plan.md ADR-2.

  Naming contract (AC11.2, binding — see plan.md "Test-layout contract"):
  individually named test functions whose names include the substrings
  `row_count` (R2), `columns` (R3), `delimiter` (R4), `type` (R5),
  `missing` (R6), `common` (R7). (The `error` substring for R9 belongs to
  task 04's test_cli.py, not this file.)

  Minimum behaviors to cover (one small test each; more granular is fine):
  - row_count: parse_csv on header + 5 data rows -> len(rows) == 5 (AC2.1);
    header-only text -> rows == [] (AC2.2); '' -> ([], []) (AC10.1).
  - columns: header 'name,age,city' -> ['name','age','city'] in order (AC3.1).
  - delimiter: detect_delimiter on a semicolon sample -> ';' and parse_csv
    yields 3 columns (AC4.1); comma baseline still works (AC4.2); empty text
    -> ',' fallback (spec Assumptions).
  - type: infer_type — all-integer -> 'integer' (AC5.1); mixed 1.5/2/3 ->
    'float' (AC5.2); non-numeric or mixed 1/a/3 -> 'string' (AC5.3); blanks
    excluded: ['1','','3'] -> 'integer' (AC6.2); no non-blank values ->
    'string' (AC10.2 support).
  - missing: count_missing(['1','','3']) == 1; all-blank and no-blank cases
    (AC6.1).
  - common: top_values ranks ['x']*10+['y']*5+['z'] with ('x',10) first
    (AC7.1); 7 distinct values -> at most 5 pairs (AC7.2); equal counts order
    by ascending value and the result is identical across two calls (spec
    tie-break assumption).
  - ragged: column_values pads a short row with '' and ignores extra fields
    beyond the header (AC8.1 semantics).
  - format: format_report([],[]) == 'Rows: 0\nColumns: 0\n' exactly (AC10.1);
    format_report(['a','b'], []) lists both columns, reports Rows: 0, types
    'string', and 'Common: (none)' without raising (AC10.2); one small
    populated fixture asserted byte-exactly against plan.md "Report format".

  Constraints: stdlib + pytest only; no fixture files on disk needed (pure
  functions take strings/lists). Do not create __init__.py. If
  `import csvpeek` fails when pytest runs from apps/csvpeek/, add an empty
  apps/csvpeek/conftest.py and record that deviation in this task's notes
  (pre-authorized by plan.md Risks).

file_contact_surface:
  - apps/csvpeek/test_core.py

acceptance_tests:
  - "AC11.1 (partial) — `pytest test_core.py` run from apps/csvpeek/ exits 0"
  - "AC11.2 (partial) — `pytest --collect-only` lists distinct named tests matching the substrings row_count, columns, delimiter, type, missing, common"
  - "All listed spec ACs (AC2.1, AC2.2, AC3.1, AC4.1, AC4.2, AC5.1-5.3, AC6.1, AC6.2, AC7.1, AC7.2, AC8.1 semantics, AC10.1, AC10.2) have a corresponding function-level assertion"

depends_on: [01-core-logic]

status: in-review

notes: |
  Round 1 (implementer): Created apps/csvpeek/test_core.py with 24 tests
  covering all listed ACs (AC2.1, AC2.2, AC3.1, AC4.1, AC4.2, AC5.1-5.3,
  AC6.1, AC6.2, AC7.1, AC7.2, AC8.1 semantics, AC10.1, AC10.2) plus the
  empty-text delimiter fallback and ragged extra-fields case from the task
  scope. `import csvpeek` succeeded on the first pytest run from
  apps/csvpeek/ (Python 3.14.6 / pytest 9.1.1) — the pre-authorized
  conftest.py fallback was NOT needed and was not added.
  `pytest test_core.py -v` from apps/csvpeek/: 24 passed in 0.02s.
  `pytest --collect-only`: 24 tests collected, names include the substrings
  row_count, columns, delimiter, type, missing, common per AC11.2 (verified
  by grep over collected names).
  No deviations from the interface contract; csvpeek.py's ADR-11 delimiter
  fallback (rejected delimiter -> ',') is exercised indirectly by the
  comma/semicolon/empty delimiter tests but no dedicated pathological-input
  test (e.g. '"') was added since it's outside this task's minimum-behaviors
  list and belongs to task 04 if the Reviewer wants CLI-level coverage.

  Round 2 (implementer): Addressed all five review-03.md findings in
  apps/csvpeek/test_core.py (all fixed, none rebutted). File contact surface
  unchanged (test_core.py only); csvpeek.py NOT modified — confirmed
  byte-identical before/after (see mutation-verification method below).

  - F1 (blocking, fixed): added test_delimiter_pathological_quote_input_
    never_raises, exercising the amended ADR-11 detect_delimiter contract
    directly on '"' and '"""': asserts detect_delimiter's guarantee
    (csv.reader([], delimiter=<returned>) constructs without raising) and
    that parse_csv doesn't raise on those inputs either. Interpreter-
    portable by construction (no hardcoded expected delimiter character, per
    ADR-11's own rejection of a static criterion).
  - F2 (blocking, fixed): test_common_bounded_to_at_most_five_of_seven_
    distinct now asserts the full expected 5-pair list
    [("a",1),("b",1),("c",1),("d",1),("e",1)] instead of len(result) <= 5,
    so a TOP_N/truncation-bound mutant is caught.
  - F3 (minor, fixed): added test_ragged_short_row_kept_and_included_in_
    parse_csv_row_count — parse_csv("a,b,c\nx,y\n") must yield rows ==
    [["x","y"]] (len 1), pinning that a ragged row is kept (not dropped) at
    the parse_csv level, independent of column_values' padding.
  - F4 (minor, fixed): the finding's failure scenario names THREE functions
    as vulnerable to a strip()-based blank rule — count_missing, infer_type,
    and top_values (my first pass covered only the first and third; the
    coordinator flagged the infer_type gap and I've corrected it here).
    Added test_missing_whitespace_only_value_is_not_blank (count_missing([
    " "]) == 0), test_type_whitespace_only_value_is_not_blank_and_forces_
    string (infer_type(["1", " "]) == "string" — a lone [" "] can't
    discriminate the exact-blank rule from a strip()-based one since both
    reduce to an empty non-blank set and return "string" via the same
    early-return path, so a non-blank numeric value ("1") must be paired
    with the whitespace value to make the two rules diverge), and
    test_common_whitespace_only_value_is_not_treated_as_blank (top_values([
    " "," ","x"]) == [(" ",2),("x",1)]). All three functions the finding
    named are now covered.
  - F5 (minor, fixed): added test_common_ties_order_lexicographically_even_
    for_numeric_looking_values — top_values(["10","2","10","2"]) ==
    [("10",2),("2",2)], pinning the lexicographic (not numeric) tie-break
    per the plan's top_values contract / ADR-6.

  Verification method: for F1/F2/F3/F5 and all three F4 functions
  (count_missing, infer_type, top_values), I temporarily applied the exact
  mutation the Reviewer described (or the closest equivalent named in the
  finding) directly to csvpeek.py, reran the corresponding new test to
  confirm it fails against the mutant, then restored csvpeek.py from a
  pre-mutation copy and diffed byte-for-byte (`diff csvpeek.py <backup>`
  reported no differences) before removing the backup. Each mutant was
  reverted before starting the next, one at a time. For infer_type
  specifically: mutated `non_blank = [v for v in values if v != ""]` to
  `v.strip() != ""` in infer_type, reran
  test_type_whitespace_only_value_is_not_blank_and_forces_string, confirmed
  it FAILED (`infer_type(["1", " "]) == "integer"`, not the expected
  "string"), then restored and re-diffed byte-identical. `git diff --stat`
  (run from repo root) after all rounds shows only apps/csvpeek/test_core.py
  and this task file changed — csvpeek.py absent from the diff, confirming
  it is unmodified relative to the commit this round started from.

  Test run (Python 3.14.6 / pytest 9.1.1, from apps/csvpeek/):
  `pytest test_core.py -v` -> 30 passed in 0.01s (24 round-1 tests + 6 new:
  test_delimiter_pathological_quote_input_never_raises,
  test_type_whitespace_only_value_is_not_blank_and_forces_string,
  test_common_ties_order_lexicographically_even_for_numeric_looking_values,
  test_common_whitespace_only_value_is_not_treated_as_blank,
  test_missing_whitespace_only_value_is_not_blank,
  test_ragged_short_row_kept_and_included_in_parse_csv_row_count).
  `pytest test_core.py --collect-only` -> 30 tests collected; all six
  AC11.2 substrings (row_count, columns, delimiter, type, missing, common)
  still present among collected names.

  No rebuttals — all five findings were addressable within the test-only
  file contact surface without touching csvpeek.py, so all were fixed
  rather than rebutted.
