# Contract: produced by Architect; consumed by exactly one Implementer.

id: 04-cli-tests
title: End-to-end CLI tests via subprocess (exit codes, stderr, exact report, constraints)
requirements: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12]

scope: |
  Create apps/csvpeek/test_cli.py: pytest tests that run the finished CLI
  (tasks 01 and 02 are merged) as a real process and assert on exit codes,
  stdout, and stderr. Per plan.md "Test-layout contract": locate the script as
  pathlib.Path(__file__).parent / "csvpeek.py" and invoke it with
  subprocess.run([sys.executable, str(script), ...], capture_output=True).
  Use pytest's tmp_path fixture to create input files, written with
  encoding="utf-8". Do not duplicate task 03's function-level tests. 3.9-safe
  spellings only (plan.md ADR-3). If the environment pre-check fails (python3
  or pytest missing), escalate per plan.md ADR-2.

  Required coverage (one test per bullet; the R9 tests' names must include the
  substring `error` per the naming contract for AC11.2):
  - AC1.1 — existing readable CSV -> returncode 0.
  - AC1.2 — no file argument -> returncode != 0, stderr non-empty (usage).
  - AC2.1 — header + 5 data rows -> stdout contains the line 'Rows: 5'.
  - AC2.2 — header-only file -> returncode 0 and stdout contains 'Rows: 0'.
  - AC3.1 — header name,age,city -> the lines 'Column: name', 'Column: age',
    'Column: city' appear in stdout in that order.
  - AC4.1 — semicolon-delimited file (name;age;city + matching data rows) ->
    stdout contains 'Columns: 3' and all three Column blocks; no output line
    contains a literal 'name;age;city' column name.
  - AC4.2 — comma-delimited baseline -> 'Columns: 3' and correct blocks.
  - Exact report (covers R5/R6/R7 end-to-end; byte-exact per plan.md ADR-8) —
    for the fixture below, stdout equals exactly the expected text below.
      Fixture file content:
        name,score,ratio,tag
        alice,1,0.5,x
        bob,2,2,x
        carol,,3.5,y
      Expected stdout (derived from plan.md "Report format"; every line ends
      with \n, one blank line before each Column block, no trailing blank
      line):
        Rows: 3
        Columns: 4

        Column: name
          Type: string
          Missing: 0
          Common: alice (1), bob (1), carol (1)

        Column: score
          Type: integer
          Missing: 1
          Common: 1 (1), 2 (1)

        Column: ratio
          Type: float
          Missing: 0
          Common: 0.5 (1), 2 (1), 3.5 (1)

        Column: tag
          Type: string
          Missing: 0
          Common: x (2), y (1)
      This asserts AC5.1 (score: integer despite the blank — also AC6.2),
      AC5.2 (ratio: float), AC5.3 (name/tag: string), AC6.1 (Missing: 1),
      AC7.1 (x ranked before y with counts).
  - AC7.2 — a column with 7 distinct values -> its 'Common:' line lists
    exactly 5 entries.
  - AC8.1 — 3-column header, one 2-field data row -> returncode 0, stderr
    does not contain 'Traceback', row included in 'Rows:'.
  - AC9.1 — nonexistent path -> returncode != 0, stderr non-empty and does
    not contain 'Traceback' (test name includes `error`).
  - AC9.2 — a directory path (use tmp_path itself) -> same assertions as
    AC9.1 (test name includes `error`).
  - AC10.1 — 0-byte file -> returncode 0, stdout == 'Rows: 0\nColumns: 0\n'
    exactly.
  - AC10.2 — header-only file -> returncode 0, columns listed by name,
    'Rows: 0', stderr does not contain 'Traceback'.
  - AC12.1 — exactly one non-test *.py source file in the deliverable
    directory (glob apps/csvpeek/*.py; exclude names starting with test_ and
    conftest.py).
  - AC12.2 — parse csvpeek.py with ast, collect Import/ImportFrom module
    roots (assert node.level == 0 for every ImportFrom), assert the root set
    is non-empty and every root is stdlib using the dual mechanism pinned in
    plan.md ADR-3: sys.stdlib_module_names when present (3.10+), else the
    fallback — builtin names, or find_spec origin 'built-in'/'frozen', or a
    path under sysconfig.get_paths()['stdlib'] whose resolved parts contain
    no 'site-packages'/'dist-packages' component (the rejection is mandatory).

  Constraints: stdlib + pytest only; no changes to csvpeek.py or test_core.py.

file_contact_surface:
  - apps/csvpeek/test_cli.py

acceptance_tests:
  - "AC11.1 — `pytest` run from apps/csvpeek/ (both test files) exits 0"
  - "AC11.2 — `pytest --collect-only` from apps/csvpeek/ lists this file's `error`-substring tests alongside task 03's named tests"
  - "Every AC listed in scope (AC1.1-1.2, AC2.1-2.2, AC3.1, AC4.1-4.2, AC5.1-5.3, AC6.1-6.2, AC7.1-7.2, AC8.1, AC9.1-9.2, AC10.1-10.2, AC12.1-12.2) has a distinct test that passes"

depends_on: [02-cli-shell]

status: pending

notes: ""
