  G1: {approved: true, by: nthncrtr, at: 2026-07-13T03:36:56Z, notes: all 8 ADRs accepted incl. ADR-6 LBYL departure, burden: confirmation}
  G2: {approved: false, by: null, at: null, notes: null}
  G3: {approved: false, by: null, at: null, notes: null}

tasks:                    # mirrors tasks/*.yaml status; the ONLY home of review_rounds
  - {id: 01-dupefind-cli, status: pending, review_rounds: 0}
  - {id: 02-unit-tests, status: pending, review_rounds: 0}
  - {id: 03-cli-tests, status: pending, review_rounds: 0}

escalations: []           # append-only: {at, from_role, reason, resolved}
