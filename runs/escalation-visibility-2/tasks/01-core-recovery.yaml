id: 01-core-recovery
title: Best-effort escalation recovery in the parser and the core view-models
requirements: [R1, R2, R3]

scope: |
  In frontend/packages/core, implement the parser recovery and wire it through
  the two view-model derivations, exactly per plan.md "Interface contracts".

  1. schema.ts: extend StateParseResult with the optional
     `bestEffortEscalations?: Escalation[]` field. In parseRunState's
     schema-failure branch (not the YAML-failure branch), attempt recovery: the
     parsed YAML must be a non-null object, its raw `escalations` key must be
     present, and `z.array(escalationSchema)` must accept the whole array;
     otherwise omit the key entirely. Never repair or drop individual entries.
     The error message composition is untouched.
  2. portfolio.ts: in summarizeRun's `!state` branch, set escalationsOpen to
     the count of recovered entries with resolved === false (0 when the field
     is absent). Everything else in that branch stays as-is; needsHuman keeps
     counting items.
  3. readiness.ts: in deriveReadiness's `!state` branch, after the existing
     malformed item, push one InboxItem per open recovered escalation with the
     exact field values given in the plan (kind 'escalation', reviewable false,
     escalationIndex null, title/detail/since matching the valid path's
     expressions). InboxItem's shape and InboxKind are NOT changed.

  Tests go in a NEW file, frontend/packages/core/test/escalation-recovery.test.ts
  (do not touch readiness.test.ts — another task edits it):
  - AC1.1/AC1.3/AC1.4 at the parseRunState level with inline YAML strings: an
    out-of-enum phase with a well-formed escalations array recovers the list
    while state stays null and error keeps the schema-violation message; a
    malformed entry (resolved as a string, or missing reason) recovers
    nothing; extra violations in tasks/gates still recover only escalations.
    Also cover: absent escalations key recovers nothing, and a valid document
    never carries the field.
  - AC1.2: parse the exact bad-state YAML literal from
    frontend/fixtures/src/index.ts (copy the string) and assert the result
    deep-equals { state: null, error: <existing message> } with no
    bestEffortEscalations key ('bestEffortEscalations' in result === false).
  - AC2.3 and the R3 items, end to end through git: use makeFixture from
    fixture.helper.ts, add a test-local schema-invalid run with well-formed
    escalations via the addPausedRun idiom in readiness.test.ts (git branch +
    hand-written state.yaml, N=2 open + 1 resolved), then assert
    buildPortfolio's RunSummary has escalationsOpen === 2, and deriveReadiness
    returns the malformed item first followed by two escalation items with
    reviewable false, escalationIndex null, and the from_role/reason in
    title/detail. Do NOT add this run to the shared fixtures generator — task
    02 adds a separate shared one.

  Environment: Node >= 24; run `npm install` once in frontend/, and confirm
  `npx vitest run` is green before and after.

file_contact_surface:
  - frontend/packages/core/src/record/schema.ts
  - frontend/packages/core/src/view-model/portfolio.ts
  - frontend/packages/core/src/view-model/readiness.ts
  - frontend/packages/core/test/escalation-recovery.test.ts

acceptance_tests:
  - AC1.1
  - AC1.2
  - AC1.3
  - AC1.4
  - AC2.3
  - "cd frontend && npx vitest run packages/core passes"
  - "cd frontend && npm run typecheck passes"

depends_on: []

status: in-review

notes: |
  Implementer r1: implemented as scoped. schema.ts recovery checks raw is a
  non-null object, reads the raw `escalations` key, and validates it whole
  with z.array(escalationSchema); portfolio.ts and readiness.ts consume
  `bestEffortEscalations` exactly per the plan's interface contracts (no
  changes to InboxItem/InboxKind, no source.ts changes needed — the existing
  `{ raw, ...parseRunState(raw) }` spread in local-source.ts already carries
  the new optional field for free). Test file
  frontend/packages/core/test/escalation-recovery.test.ts covers AC1.1-1.4
  with inline YAML (using profile: patch to isolate each test to exactly the
  intended violation), AC1.2 with the bad-state YAML literal copied verbatim,
  and AC2.3/R3 end-to-end via a test-local git-branch run (the addPausedRun
  idiom) with N=2 open + 1 resolved escalations — not added to the shared
  @agentic/fixtures generator, matching the task's scope note. `npx vitest
  run` (full suite, all packages): 403 passed, 1 skipped, 0 failed. `npm run
  typecheck`: clean.

  Implementer r2 (round 2, addressing review-01.md): all three findings are
  test-binding gaps only — no production code changed; schema.ts,
  portfolio.ts, and readiness.ts diffs against the r1 commit are empty.

  F1 (blocking, fixed): both AC1.3 cases in escalation-recovery.test.ts now
  give the malformed entry a well-formed sibling ({at, from_role: implementer,
  reason: 'a well-formed sibling entry', resolved: false} placed before the
  malformed one), still asserting `'bestEffortEscalations' in result ===
  false`. Verified by hand-applying the reviewer's per-entry-salvage mutant to
  schema.ts (whole-list `z.array(escalationSchema).safeParse` replaced with a
  map+filter salvage that keeps valid entries and drops bad ones): both AC1.3
  tests now fail (`expected true to be false`) where they previously passed.
  Mutant reverted; `git diff` on schema.ts is empty.

  F2 (major, fixed): the AC2.3 deriveReadiness test now asserts exact epoch
  seconds for both open recovered items' `since` (`ctx.repo.now - 1 * DAY` and
  `ctx.repo.now - 2 * DAY`, matching the fixture's `at(1)`/`at(2)` helper; DAY
  hoisted to module scope so the assertion and the fixture builder share one
  constant). Verified by hand-applying the reviewer's `since: null` mutant to
  readiness.ts:100: the since assertion fails (`expected null to be
  1785016700`). Mutant reverted; `git diff` on readiness.ts is empty.

  F3 (minor, fixed, folded into the F2 edit): the AC2.3 fixture's first
  escalation entry now omits `from_role` entirely (schema permits it), and the
  assertions switched from `toContain` to exact `toBe('Escalation from unknown
  role')` / `toBe('Escalation from verifier')` — pinning both the fallback
  string and the real value. `problems: []` is now asserted explicitly in the
  per-item loop rather than left to toMatchObject's default skip. Verified by
  hand-applying both mutants together (drop the `?? 'unknown role'` fallback;
  set `problems: [error ?? 'state.yaml unreadable']`): the test fails on the
  `problems` mismatch (spurious contract-violation string where `[]` was
  expected). Mutant reverted; `git diff` on readiness.ts is empty.

  Verification after all three fixes: `cd frontend && npx vitest run`
  (full suite) — 403 passed, 1 skipped, 0 failed (44 files passed, 1 skipped,
  45 total), identical pass count to r1. `npm run typecheck` — clean (both
  tsconfig.json and packages/web/tsconfig.json). Confirmed via `git diff
  --stat` that only frontend/packages/core/test/escalation-recovery.test.ts
  changed in the working tree; schema.ts, portfolio.ts, and readiness.ts are
  byte-identical to the r1 commit (an incidental package-lock.json rewrite
  from a local `npm install` was reverted with `git checkout --` since it's
  outside the file_contact_surface and unrelated to this round's edits).
