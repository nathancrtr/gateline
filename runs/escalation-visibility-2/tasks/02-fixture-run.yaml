id: 02-fixture-run
title: Shared esc-recovered fixture run plus the count-sensitive assertion updates
requirements: [R1]

scope: |
  Add one run to the shared fixture generator (frontend/fixtures/src/index.ts)
  and move the three assertions that count or enumerate fixture runs, per plan
  ADR-4 and "Interface contracts > Shared fixture". No production code changes.

  1. New branchRuns entry, slug `esc-recovered`, age 1 (youngest — ordering
     assertions depend on the 7-day-old `escalated` run staying first). Files:
     intent-brief.md via brief(...), spec.md via spec(...), and a hand-written
     state.yaml template literal (the stateYaml helper cannot emit an invalid
     phase). The state.yaml must be valid YAML with:
     - run/branch keys matching the slug; `phase: verifying` (out of enum —
       the single unrelated schema violation); paused_reason: null
     - a well-formed budget block and gates block (G0/G1 approved by operator,
       G2/G3 undecided) and `tasks: []`
     - escalations: exactly 2 entries with resolved: false (from_role:
       implementer, from_role: verifier, distinct reasons) and 1 entry with
       resolved: true (plus resolved_by/resolved_at/resolution); every `at`
       computed from the generator's `now` as
       new Date((now - 1 * DAY) * 1000).toISOString() — the `escalated` run's
       idiom (see its escalation at now - 7 * DAY).
  2. frontend/packages/core/test/readiness.test.ts: add 'esc-recovered' to the
     sorted slug list in the "finds every fixture run" test. Touch nothing
     else in that file.
  3. frontend/packages/server/test/app.test.ts: bump
     `expect(body.runs).toHaveLength(12)` to 13. Touch nothing else.
  4. frontend/packages/orchestrator/test/fixture.test.ts: add
     `expect(bySlug['esc-recovered']).toMatchObject({ kind: 'rest', rule: 'D0' })`
     next to the bad-state assertion — pinning that the engine treats the run
     as malformed rest and never dispatches on recovered escalations.

  This task is data + assertions only, so it does not depend on task 01: before
  01 lands the run simply reads as a malformed run with zero escalations, and
  every updated assertion already holds.

  Environment: Node >= 24; `npm install` once in frontend/; the full
  `npx vitest run` (core, server, orchestrator, cli suites) must be green —
  the fixture is shared, so any suite failing to the new run is this task's
  defect. In particular, `escalated` must still lead the inbox in
  packages/cli/test/cli.test.ts and packages/server/test/app.test.ts.

file_contact_surface:
  - frontend/fixtures/src/index.ts
  - frontend/packages/core/test/readiness.test.ts
  - frontend/packages/server/test/app.test.ts
  - frontend/packages/orchestrator/test/fixture.test.ts

acceptance_tests:
  - "AC1.1's fixture shape exists: the esc-recovered run's state.yaml parses as YAML, fails the contract schema only on phase, and carries 2 open + 1 resolved well-formed escalations"
  - "cd frontend && npx vitest run passes (all workspaces), including the new D0 rest assertion for esc-recovered"
  - "inbox-ordering assertions still hold: escalated ranks first in the CLI and server inbox tests"

depends_on: []

status: pending

notes: |
  Implementer (round 1): added `esc-recovered` (age 1, phase: verifying —
  the sole out-of-enum violation, gates G0/G1 approved-by-operator + G2/G3
  undecided, tasks: [], and 3 hand-written escalations: 2 resolved:false
  from_role implementer/verifier with distinct reasons, 1 resolved:true with
  resolved_by/resolved_at/resolution) to frontend/fixtures/src/index.ts, all
  `at` timestamps via `new Date((now - 1 * DAY) * 1000).toISOString()` per
  the `escalated` run's idiom. Updated the three count-sensitive assertions
  exactly as scoped: readiness.test.ts's sorted slug list (esc-recovered
  sorts between done-merged and escalated), app.test.ts's
  `toHaveLength(12)` -> 13, and fixture.test.ts's new
  `esc-recovered -> { kind: 'rest', rule: 'D0' }` assertion next to
  bad-state's.
  `npm install` in frontend/ regenerated package-lock.json as a side effect
  (node_modules was absent); reverted that file with `git checkout --` since
  it is outside this task's file_contact_surface — the lockfile itself
  needed no content change for this task.
  Full `cd frontend && npx vitest run`: 43 test files passed, 1 skipped
  (44), 394 tests passed, 1 skipped (395) — no regressions, including
  `escalated` still ranking first in cli.test.ts and app.test.ts's inbox
  ordering assertions.
