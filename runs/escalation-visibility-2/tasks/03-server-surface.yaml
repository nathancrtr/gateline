id: 03-server-surface
title: Run-detail recoveredEscalations payload field and the server-level acceptance tests
requirements: [R2, R3, R4]

scope: |
  In frontend/packages/server, expose the recovered entries on the run-detail
  route and prove R2/R4 at the HTTP layer, per plan ADR-5.

  1. src/app.ts, GET /api/runs/:src/:slug only: destructure
     `bestEffortEscalations` from the existing `source.readState(ref)` call
     inside the cached payload builder, and spread-conditionally add
     `recoveredEscalations`: the entries with resolved === false, in list
     order, projected to { at, from_role, reason }. The key must be ABSENT
     (not null) when the parser recovered nothing, so responses for every
     existing fixture — including bad-state — are byte-identical (AC1.2's
     rider). POST /api/decisions and all other routes are untouched.
  2. Tests in a NEW file, frontend/packages/server/test/escalation-recovery.test.ts
     (do not touch app.test.ts — task 02 edits it). Use the app.test.ts idiom:
     generateFixtureRepo + LocalGitSource + createApp, against the shared
     esc-recovered fixture (2 open, 1 resolved escalation):
     - AC2.1: GET /api/runs → the esc-recovered entry has escalationsOpen === 2
       and a non-null malformed message.
     - AC2.2: GET /api/runs/fixture/esc-recovered → summary.escalationsOpen === 2.
     - AC3.2: same response → recoveredEscalations has exactly 2 entries, each
       with from_role, reason, and at fields matching the fixture's open
       entries; the resolved entry is absent.
     - AC1.2 rider: GET /api/runs/fixture/bad-state → no recoveredEscalations
       key in the response body.
     - AC4.2: POST /api/decisions against esc-recovered returns the existing
       malformed-state refusal (status 409, error mentioning malformed) for
       each of action resolve-escalation (escalationIndex 0, notes), approve
       (gate G2, burden confirmation), and decline (gate G2, notes).
     - R4 item shape: the run-detail items[] contains the malformed item plus
       2 kind 'escalation' items with reviewable false and escalationIndex null.

  Environment: Node >= 24; `npm install` once in frontend/;
  `npx vitest run packages/server` green, and the full `npx vitest run` green.

file_contact_surface:
  - frontend/packages/server/src/app.ts
  - frontend/packages/server/test/escalation-recovery.test.ts

acceptance_tests:
  - AC2.1
  - AC2.2
  - AC3.2
  - AC4.2
  - "GET /api/runs/fixture/bad-state carries no recoveredEscalations key"
  - "cd frontend && npx vitest run passes"

depends_on: [01-core-recovery, 02-fixture-run]

status: pending

notes: |
  Implementer round 1: implemented as specified, no deviations from the plan.
  app.ts's GET /api/runs/:src/:slug now destructures bestEffortEscalations
  from source.readState(ref) and spread-conditionally adds
  recoveredEscalations (open entries only, {at, from_role, reason}, list
  order) — absent (not spread) when bestEffortEscalations is undefined.
  POST /api/decisions and every other route left untouched.

  New test file frontend/packages/server/test/escalation-recovery.test.ts
  covers AC2.1, AC2.2, AC3.2, the AC1.2 rider (bad-state has no
  recoveredEscalations key), AC4.2 (resolve-escalation/approve/decline all
  409 against esc-recovered), and the R4 item-shape check (2 non-reviewable
  escalation items with escalationIndex null alongside the malformed item).

  Verification: `cd frontend && npx vitest run packages/server` → 3 files,
  43 tests, all green (webhook.test.ts 9, app.test.ts 26, the new
  escalation-recovery.test.ts 8). Full `npx vitest run` → 46 files, 412
  tests, 410 passed / 1 skipped / 1 failed:
  packages/orchestrator/test/router.test.ts's single test timed out at 60s
  under full-suite parallel load. Re-ran that file in isolation immediately
  after and it passed in 7s (6/6 tests green) — a resource-contention flake
  unrelated to this task's file_contact_surface (app.ts, the new server
  test file), not a regression from this change.

  Implementer round 2: addressed review-03.md's two findings, both fixed
  (no rebuttals). Only file touched: the new test file itself; app.ts
  needed no change (confirmed unmodified via `git diff` after the mutant
  checks below).

  F1 (blocking, at unbound) + F2 (major, projection shape unbound): both
  fixed with the reviewer's single suggested change. Replaced the AC3.2
  block's per-property toHaveProperty/toMatchObject checks with one
  `toEqual` against the two exact expected objects ({ at, from_role,
  reason } each), with `at` derived from the fixture rather than
  hardcoded: `new Date((fixture.now - 86400) * 1000).toISOString()`. I
  verified this derivation against the fixture source
  (frontend/fixtures/src/index.ts) before using it: `DAY = 86_400`
  (line 11), and the esc-recovered run's two open entries both use
  `escRecoveredAt = new Date((now - 1 * DAY) * 1000).toISOString()`
  (line 409, spread into both `{at: ${escRecoveredAt}, ...}` YAML
  entries at lines 648-649) — the reviewer's derivation matches the
  fixture exactly, so used it as-is. toEqual also keeps the existing
  order and open-only kills the prior test already had.

  Mutant-kill evidence (re-verified by me post-fix, app.ts restored after
  each): `at: null` in the app.ts projection → AC3.2 test fails (received
  at: null vs expected the fixture ISO string), 1 failed/7 passed. Whole-
  entry-leak mutant `.map((e) => ({ ...e }))` → AC3.2 test fails (received
  object carries resolved: false, resolved_by: null, resolved_at: null,
  resolution: null alongside the three expected fields), 1 failed/7
  passed. Reverted app.ts after each mutant; `git diff
  frontend/packages/server/src/app.ts` shows no diff, confirming it's
  back to the round-1 committed state (this round touches only the test
  file).

  Verification (round 2): `cd frontend && npx vitest run packages/server`
  → 3 files, 43 tests, all green. Full `cd frontend && npx vitest run` →
  45 files passed + 1 skipped (46 total), 412 passed + 1 skipped (413
  tests), 0 failed — no router.test.ts flake this run (full suite clean
  in one pass, ~75s). `npm install` in frontend/ perturbed
  frontend/package-lock.json (peer/libc metadata churn from a different
  local npm/lockfile-version); reverted with `git checkout --
  frontend/package-lock.json` since it's outside this task's
  file_contact_surface, then re-ran packages/server to confirm still
  green post-revert (43/43).

