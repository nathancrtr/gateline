id: 02-ledger-foundations
# id keeps its v1 slug so depends_on references stay stable across the G1 redo;
# this task now builds candidate B ("Signal Deck") foundations.
title: Rewrite styles.css to candidate B's token contract, motion primitives, and prose recipe
requirements: [R5, R6]

scope: |
  Sole writer of frontend/packages/web/src/styles.css. Implement plan.md contract C1
  exactly: the @theme token table (existing --color-* names keep their names, values
  become candidate B's cool signal palette; add --color-inset, --color-accent-deep,
  --color-on-solid), the :root custom properties (--glow, --ramp-1..3, --unrecorded),
  and the motion primitives — @keyframes pulse / pulsepanel / sweep plus the shared
  classes .pulse-glow / .pulse-panel / .skel, verbatim from C1. Fonts unchanged: no
  --font-display token (plan ADR-2); B's display voice is --font-mono + per-recipe
  tracking/case. Keep :root { color-scheme: light dark } and the existing
  :focus-visible rule (accent, 2px, offset 2px, 2px radius).
  Upgrade the prefers-reduced-motion block per ADR-6: animation: none !important
  (keep the near-zero transition-duration). Base styles must stay meaningful when
  static — .pulse-panel's declaration carries the static glow ring, .skel reads as a
  static inset block with animation off.
  Base styles: body stays bg-ground/text-ink/font-sans.
  Restyle .prose-artifact to Signal Deck's reading voice per the artbody region of
  runs/fleetview-design/design/candidate-b/run-artifacts.html and the candidate's
  Look-and-feel spec: sans headings (h1 ~18px/600, h2 ~14px/600 with a 1px line
  hairline), body 14/1.6 sans, measure cap 76ch, code chips mono ~12.5px on raised
  with 3px radius, pre mono 12/20 on inset with 4px radius — small radii replace
  rounded/rounded-lg (B is capsule/3-6px, not radius-0). Washes, --glow, and ramp
  values stay in this file as custom properties (plan Risk 6) — never as Tailwind
  arbitrary values in JSX.
  Touch no other file (plan C3). Other tasks compile against today's class names, so
  do not delete any token name currently referenced (grep the src tree before
  removing anything).

file_contact_surface:
  - frontend/packages/web/src/styles.css

acceptance_tests:
  - AC5.2
  - AC6.2
  - "every token, :root property, keyframe, and motion class in plan.md C1 exists with the exact values listed"
  - "grep '@keyframes' src/ matches exactly pulse, pulsepanel, sweep — all in styles.css"
  - "the prefers-reduced-motion block sets animation: none !important; with it active, .pulse-panel still shows its static glow ring and .skel renders as a static block"
  - "no rounded-lg remains in .prose-artifact recipes; radii are 3-4px per C2"
  - "cd frontend && npm install && npm run typecheck && npm test pass"
  - "npm run build -w @agentic/web succeeds (Tailwind resolves every utility referenced app-wide)"

depends_on: []

status: pending

notes: |
  Implementer r1: rewrote styles.css per C1 verbatim (theme tokens, :root
  properties, three keyframes, three motion classes) and restyled
  .prose-artifact to the artbody reading voice (14/1.6 sans body, 76ch cap,
  h1 18/600, h2 14/600 + line hairline, inline code 12.5px/raised/3px radius,
  pre 12/20 mono/inset/4px radius). Grepped src/ first: no file referenced
  pulse-glow/pulse-panel/skel/--ramp-*/--glow/--color-inset/-accent-deep/
  -on-solid before this change (wholly new additions, not renames), so no
  token/class was removed out from under another task.
  Discoveries: (1) contrary to plan Risk 1, this sandbox has network access —
  `npm install` succeeded and full verification ran (not blocked/escalated).
  (2) h3 isn't named in C1/C2 explicitly (only h1/h2); kept a sans-semibold h3
  sized between h2 and body (13px) for markdown depth, consistent with the
  reading voice, since spec.md/artifact markdown can contain ###.
  Verification from frontend/: `npm install` ok; `npm run typecheck` passes
  (2 tsc projects, no errors); `npm test` — 17 files / 127 tests passed, 1
  skipped (live-smoke, expected offline skip); `npm run build -w @agentic/web`
  succeeds. `grep -rn '@keyframes' src/` matches pulse/pulsepanel/sweep, all
  in styles.css only; no `rounded-lg` remains under .prose-artifact.
