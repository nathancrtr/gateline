id: 02-ledger-foundations
title: Rewrite styles.css to candidate A's token contract, base styles, and prose recipe
requirements: [R5, R6]

scope: |
  Sole writer of frontend/packages/web/src/styles.css. Implement plan.md contract C1
  exactly: the @theme token table (existing --color-* names keep their names, values
  become candidate A's; add --color-rule, --color-accent-deep, --color-on-solid,
  --font-display), plus the :root custom properties (--shadow-plate, --burden-ramp-1..3,
  --burden-unrecorded). Keep :root { color-scheme: light dark } and the existing
  :focus-visible rule (accent, 2px, offset 2px) — set its border-radius to 0.
  Base styles: body stays bg-ground/text-ink/font-sans. Motion policy per C2: keep
  the prefers-reduced-motion block; add no @keyframes anywhere.
  Restyle .prose-artifact to the Ledger reading voice per
  runs/fleetview-design/design/candidate-a/run-artifacts.html (rendered-artifact
  region) and the candidate's Look-and-feel spec: font-display headings, h2 rule
  becomes a hairline under a heavier head, measure cap stays (~68-74ch), code/pre
  keep --font-mono with square corners (drop rounded/rounded-lg), quiet rules for
  tables/blockquotes. Alpha washes, ramp, and shadow stay as plain CSS custom
  properties in this file (plan Risk 5) — never as Tailwind arbitrary values.
  Touch no other file (plan C3). Other tasks compile against today's class names, so
  do not delete any token name currently referenced (grep the src tree before
  removing anything).

file_contact_surface:
  - frontend/packages/web/src/styles.css

acceptance_tests:
  - AC5.2
  - AC6.2
  - "every token and :root property in plan.md C1 exists with the exact light/dark values listed"
  - "grep -c '@keyframes' src/styles.css == 0; no rounded corner remains in .prose-artifact recipes"
  - "cd frontend && npm install && npm run typecheck && npm test pass"
  - "npm run build -w @agentic/web succeeds (Tailwind resolves every utility referenced app-wide)"

