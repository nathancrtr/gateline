id: 05-decide-panel
title: Restyle the decide flow (burden picker, buttons, flashes) in decide.tsx
requirements: [R5, R6]

scope: |
  Restyle frontend/packages/web/src/components/decide.tsx in place per plan C2 and
  the open-approve-flow (.decide) region of
  runs/fleetview-design/design/candidate-b/run-artifacts.html: the decide region
  opens under a 1px line top border with a mono uppercase-tracked legend; burden
  options become 5px-radius selectable tiles on bg-inset with 1px line borders
  (mono key numeral in faint, label + sans hint in muted; selected = accent border
  + accent-soft wash + accent text at 600, focus treatment kept); Button becomes the
  Signal Deck capsule set (rounded-full): primary = solid accent + text-on-solid +
  a static 0 0 12px var(--glow) shadow; danger = solid bad + text-on-solid, no
  glow; quiet = bg-inset + 1px line border + muted text, hover accent border.
  NotesField: inset well — bg-inset, 1px line border, 5px radius. Flash keeps
  role="status" with ok/warn(conflict)/bad washes on 5px radius.
  Behavior is entirely frozen (C3): modes, mutation logic, CAS-409 conflict copy,
  dataset.deciding effect, key handlers (a/x/1/2/3/esc), every
  data-decide/data-decide-panel hook, and every user-visible string verbatim —
  including the bounced copy containing "no approval is offered", burden labels,
  "Notes (optional)" placeholder prefix, and "committed" flash text (smoke.spec.ts
  asserts on all of these). The panel pulse is task 09's surface (run.tsx owns the
  signal panel wrapper) — this file gets static styles only: use only C1 tokens, no
  keyframes, no animation properties, no motion classes.

file_contact_surface:
  - frontend/packages/web/src/components/decide.tsx

acceptance_tests:
  - AC5.1
  - AC5.2
  - AC5.3
  - "cd frontend && npm run typecheck && npm test && npx playwright test pass"
  - "git diff shows class-string changes only: no string literal, handler, or hook changed"
  - "grep of decide.tsx: no @keyframes, no animation- property, no motion class"

depends_on: [02-ledger-foundations]

status: pending

notes: |
  Round 2 (response to runs/fleetview-design/review-03.md):

  F1 (blocking) — fixed. The burden-tile label carried `bg-inset` on the shared
  base string and `bg-accent-soft` only in the selected branch, so both classes
  landed on the element and `bg-inset`'s later cascade position won. Moved
  `bg-inset` into the unselected branch so the two backgrounds are mutually
  exclusive again (mirrors the pre-diff bg-surface pattern the reviewer
  pointed to): selected -> `border-accent bg-accent-soft font-semibold
  text-accent`, unselected -> `border-line bg-inset hover:border-accent`.

  F2 (minor) — fixed. Moved `font-semibold` out of the per-tone strings and
  into the shared `<button>` className (applies to primary/danger/quiet
  alike), matching mockup `.btn{font:600 13px ...}` which sets weight 600 on
  the shared class before any tone-specific override.

  F3 (minor) — fixed. Added a shared `border` (width) utility to every
  Button plus a border-color per tone: `border-accent` on primary,
  `border-bad` on danger, `border-line` on quiet (quiet already had a
  border; it now gets its color from the tone branch instead of a separate
  `border border-line` pair) — matches mockup `.btn{border:1px solid
  var(--line)}` with `.btn.primary`/`.btn.danger` overriding
  `border-color` to accent/bad. All three capsules in a row now share the
  same 1px border width, closing the 2px height mismatch.

  Verification: `cd frontend && npm run typecheck` clean; `npm test` 127
  passed/1 skipped; `npx playwright test` 5/5 passed (had to `npm run build`
  first so the server package-serves the built SPA for the e2e fixture
  server — dist/ is gitignored, not committed). `git diff` on decide.tsx
  touches only className strings (the <button> JSX gained multi-line
  formatting but no new props/handlers). `grep -E
  'keyframes|animation-|motion-'` on decide.tsx: zero hits.
