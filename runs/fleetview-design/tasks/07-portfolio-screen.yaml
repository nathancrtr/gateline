id: 07-portfolio-screen
title: Restyle the portfolio instrument grid and add the zero-runs render branch
requirements: [R1, R5, R6]

scope: |
  Restyle frontend/packages/web/src/pages/portfolio.tsx per
  runs/fleetview-design/design/candidate-b/portfolio.html: readout page head (mono
  uppercase tracked h1, 1px line bottom border, muted meta); the table sits on an
  instrument panel — 1px line border, 5px radius, bg-surface, horizontal scroll
  wrapper kept — with thead cells on bg-inset (mono 600 10px uppercase +0.12em
  tracked, muted), instrument-grid rhythm (~8px cell padding at 12-13px), 1px line
  row dividers, row hover bg-raised. Run names as accent 600 links (hover
  underline) with mono faint source beside; numeric columns mono 12px tabular-nums
  right-aligned; the malformed-run row keeps its bad-toned explanation line under
  the run name; phase/gates/budget cells consume the restyled chips as-is. The
  needs count = fully-round solid-accent mono pill in text-on-solid with a static
  0 0 8px var(--glow) shadow (no pulse — only the nav count pulses, C2); "1 esc" /
  "BAD" stay mono bad.
  The one behavioral addition of the whole run (spec R1, AC6.3, Assumption 4): when
  runs.length === 0, render the zero-runs empty state exactly as sketched in the
  mockup — centered, decorative mono accent "[ ]" glyph, "No runs found." lede,
  muted sub naming runs/<slug> in mono — a static conditional branch, no
  filtering/sorting/interaction, the <table> absent only in that branch. A <table>
  element must still render whenever runs exist (smoke asserts getByRole('table')
  contains 'done-merged').
  Loading: the isLoading branch renders 3 skeleton rows per the mockup (.skel
  blocks sized like table cells, hairline-divided) above the preserved PageStatus
  text. Everything else frozen (C3): columns, cell content, link targets,
  PageStatus usage (do not edit inbox.tsx), chips imports as-is. Use only C1 tokens
  and .skel; no keyframes or animation properties defined here.

file_contact_surface:
  - frontend/packages/web/src/pages/portfolio.tsx

acceptance_tests:
  - AC5.1
  - AC5.2
  - AC6.3
  - "cd frontend && npm run typecheck && npm test && npx playwright test pass"
  - "zero-runs branch renders the mockup's empty state when the runs array is empty (verify against a bare fixture or by temporarily forcing the branch during dev — not in committed code)"
  - "table matches candidate-b/portfolio.html: bordered panel, inset mono column heads, instrument density, glowing needs pill"
  - "grep of portfolio.tsx: no @keyframes, no animation- property; motion enters only via .skel"

depends_on: [02-ledger-foundations]

status: pending

notes: |
  implementer (round 1): restyled portfolio.tsx per candidate-b/portfolio.html —
  mono uppercase tracked h1 with 1px line bottom border and right-aligned muted
  meta; table wrapped in a bg-surface/border-line/rounded-[5px] instrument panel
  (overflow-x-auto preserved); thead cells on bg-inset, mono 600 10px uppercase
  +0.12em tracked, muted, whitespace-nowrap; tbody rows on 1px line dividers with
  hover:bg-raised (full-opacity, matching the mockup rather than the old /60
  alpha); ~8-12px instrument-grid cell padding throughout. Run names are
  font-semibold text-accent hover:underline with mono faint source beside them
  (unchanged link target/content); numeric columns stayed font-mono text-xs
  tabular-nums text-right; malformed-run row keeps its bad-toned explanation
  paragraph under the run name. Needs pill is now a fully-round solid-accent mono
  pill in text-on-solid with a static shadow-[0_0_8px_var(--glow)] (no pulse
  class used — C2 reserved for the nav count elsewhere); "N esc"/"BAD" stayed
  mono font-semibold text-bad; the zero count keeps its plain em-dash in
  text-faint. PhaseChip/GateLedger/BudgetMeter are consumed unchanged (C3) — no
  edits outside portfolio.tsx.
  Added the one behavioral branch: when runs.length === 0, render a centered
  bordered instrument-panel empty state (decorative aria-hidden mono accent
  "[ ]" glyph, "No runs found." lede, muted sans sub naming `runs/<slug>` in
  mono) — no <table> in that branch; the populated branch still renders a
  <table> (smoke test `getByRole('table')` → 'done-merged' passes).
  isLoading now renders 3 hairline-divided flex rows of .skel blocks (mirroring
  the mockup's .skel-row layout — name/source/phase/rest-of-row widths) inside a
  bordered panel, above the untouched `<PageStatus text="Reading repositories…"
  />`. No new @keyframes/animation- added — motion comes solely from the
  pre-existing .skel class in styles.css (grep confirms none in this file).
  Test results: `npm run typecheck` clean. `npm test` (vitest): 12 passed / 5
  failed files, but all 8 failing tests are in packages/orchestrator
  (engine/hardening/router/schedule/shadow-dupefind) and fail on
  `Test timed out` — a pre-existing sandbox resource-contention issue unrelated
  to this change (packages/web has no test files of its own, and portfolio.tsx
  is not imported by the orchestrator package). `npx playwright test` needed
  `npm run build -w @agentic/web` first (server only serves the SPA "when
  built" — dist/ is gitignored and wasn't present); under default parallel
  workers some smoke tests timed out from the same sandbox contention, but a
  serial rerun (`--workers=1 --retries=1`) passed all 5/5, including "portfolio
  and metrics render" asserting the table contains 'done-merged'.
