id: 08-metrics-screen
title: Restyle the metrics screen (gate table, burden ramp, rounds, budget honesty)
requirements: [R1, R5]

scope: |
  Restyle frontend/packages/web/src/pages/metrics.tsx per
  runs/fleetview-design/design/candidate-b/metrics.html: readout page head; each
  section opens with an h2 in mono 600 ~13px uppercase tracked (DOM text verbatim —
  "Gate decisions" and "Budget honesty" are smoke-asserted; uppercase via CSS
  only) over the existing explanatory caption restyled as a muted sans lede capped
  ~74ch (text verbatim, C3). Tables sit on instrument panels (1px line border, 5px
  radius, thead on bg-inset with mono uppercase tracked column heads, instrument
  density) — B boxes its tables, it does not unbox them. Gate ids mono 600;
  numerals mono 12px tabular right-aligned.
  ApprovalMeter: ~140px track on bg-inset with 1px line border and 4px radius,
  accent fill with a static 0 0 6px var(--glow) shadow, the 90% tick kept; over
  threshold = warn fill without glow + the "over-triggering?" flag restyled as a
  fully-round warn capsule (1px warn border, warn-soft wash, glyph + text kept —
  never color alone).
  Burden ramp: replace the BURDEN_RAMP/UNRECORDED inline light-dark() strings with
  the C1 custom properties (background: 'var(--ramp-1)' … 'var(--ramp-3)',
  'var(--unrecorded)') — delete the local constants; the bar becomes 16px tall with
  2px gaps and 4px radius; legend swatches 11px at 3px radius; keep all
  aria-label/title logic. Rounds distribution: mono tabular labels/counts, inset
  tracks with 1px line borders, accent fill with glow, cap bucket = bad fill
  without glow.
  The no-decisions empty state becomes the centered mockup treatment (mono accent
  "0 / 0" glyph, sans 600 lede, muted sub) — no dashed box. Loading: skeleton
  blocks per the mockup above the preserved PageStatus text.
  All data logic, bucketing, and strings frozen (C3); PageStatus consumed
  unmodified. Use only C1 tokens and .skel; no keyframes or animation properties
  defined here.

file_contact_surface:
  - frontend/packages/web/src/pages/metrics.tsx

acceptance_tests:
  - AC5.1
  - AC5.2
  - "cd frontend && npm run typecheck && npm test && npx playwright test pass"
  - "no light-dark() string literal remains in metrics.tsx (ramp reads var(--ramp-*) / var(--unrecorded))"
  - "sections match candidate-b/metrics.html: mono section heads, bordered panels with inset theads, glowing approval fill with 90% tick, warn capsule flag, gapped ramp"
  - "grep of metrics.tsx: no @keyframes, no animation- property; motion enters only via .skel"

depends_on: [02-ledger-foundations]

status: pending

notes: |
  Implementer (round 1): restyled metrics.tsx per candidate-b/metrics.html —
  mono uppercase h2s (DOM text unchanged, uppercase via Tailwind `uppercase`
  utility only), page head restyled to match `.head`/`.head h1` (mono 20px
  uppercase tracked, meta right-aligned max-w-340px), captions capped
  max-w-[74ch]. Gate/budget tables now sit in bordered panels
  (border-line/rounded-[5px]) with `bg-inset` theads, mono uppercase tracked
  column heads, mono 12px tabular right-aligned numerals, gate ids
  font-semibold mono. ApprovalMeter: 140x8 track on bg-inset with
  border-line/rounded-[4px], accent fill with static
  shadow-[0_0_6px_var(--glow)], warn fill drops the glow, 90% tick widened to
  2px (w-0.5) — tick title/positioning logic unchanged. Over-triggering flag
  is now a fully-round warn capsule (border-warn + bg-warn-soft), glyph+text
  kept. Deleted the local BURDEN_RAMP/UNRECORDED light-dark() constants
  entirely; burden ramp and legend swatches now read var(--ramp-1..3) /
  var(--unrecorded) directly via inline style (C1 tokens from
  02-ledger-foundations, already in styles.css). Burden bar is 16px tall
  (h-4), 2px gaps, rounded-[4px]; legend swatches 11px at rounded-[3px], and
  the legend now lives inside the same bordered panel as its table (matches
  B's `.panel > table + .blegend`). Rounds distribution: mono tabular
  labels/counts, inset tracks with border-line, accent fill with the same
  glow shadow, 3+ cap bucket uses bg-bad without glow. No-decisions empty
  state replaced the dashed box with the centered mockup treatment (mono
  accent "0 / 0" glyph at text-lg tracked, sans font-semibold lede, muted
  sub) — no border. Loading state now renders three `.skel` blocks (via the
  existing global `.skel` utility class) above an unmodified `<PageStatus
  text="Computing metrics from state history…" />` call — PageStatus's
  component/signature untouched; error path unchanged. All data
  logic/bucketing math/every user-facing string left byte-identical (only
  className/markup/inline-style changed) — diffed against the pre-edit file
  to confirm.

  Verification: `npm run typecheck` clean. `npm test` — first full run under
  this box's very high concurrent load (many sibling implementer tasks
  running in parallel; load avg observed 150-300+) hit 7 timeouts, all in
  packages/orchestrator/*.test.ts (nothing under packages/web, nothing I
  touched); re-ran packages/orchestrator/test/router.test.ts alone (17s, well
  under its 60s timeout) and then the full `npm test` again once load
  dropped — 17 files / 127 tests passed, 1 skipped, 0 failures. `npx
  playwright test` initially failed 4/5 (plus the metrics-specific assertion)
  with the portfolio page returning a literal "404 Not Found" body — this
  environment's packages/server serves the SPA from packages/web/dist, which
  didn't exist until `npm run build -w @agentic/web` was run (no prior build
  step, unrelated to this task's edit); after building, `npx playwright test`
  is 5/5 green, including `portfolio and metrics render` (asserts
  `getByText('Gate decisions')`/`getByText('Budget honesty')` still visible
  verbatim). grep confirms no `light-dark(` literal and no `@keyframes`/
  `animation-` remain in metrics.tsx.
