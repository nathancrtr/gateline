id: 02-candidate-single-thread
title: Design candidate "single-thread" — one capture control, progressive-disclosure flow for web + CLI
requirements: [R1, R2, R3, R4, R5, R6, R7, R9, R11, R12, R13, R14]

scope: |
  Produce one complete design candidate per contracts/design-candidate.md at
  runs/fleetview-intake/design/single-thread/ — rationale file plus
  self-contained single-file HTML mockups (styles embedded, open from disk, no
  build step). Execute under the Designer role spec (roles/designer.md); read
  spec.md, plan.md (especially G0 bindings in Approach, IC-1..IC-6, ADR-6/7/8),
  and both research reports (ux-research.md, tech-research.md) in this run
  directory.

  THESIS for this candidate (must stay distinguishable from 01's): a
  "single-thread" progressive flow that chases the v0 cockpit's one-utterance
  feel. One prominent capture control opens from the button-type "new" trigger:
  paste an issue URL / owner/repo#N (primary, per G0) or type free text
  (secondary) into the same field; the source-picker sits adjacent, visible and
  pre-selected even with one source. Everything downstream unfolds inline in a
  single column, top-to-bottom like a guided commit: fetched item -> drafted
  brief under human edit -> staging preview (source ref, editable auto-slug,
  branch name, pre-filled budget with one-interaction override) -> one explicit
  "Stage run" control -> distinct arm step. Progressive disclosure keeps first
  paint minimal; elaboration expands, never stacks. The single confirm control
  is legal per spec R7's resolution ONLY because the preview is visible above
  it before activation — design that adjacency deliberately.

  Must-cover screens/states, web: entry trigger reachable in <=2 interactions
  from existing FleetView surfaces; import happy path; free-text capture
  feeding the same draft->review->stage path (never compile-and-run); a
  discoverable structured field-level fallback (AC2.1) that is not buried
  behind free text; no-drafting-model degradation (verbatim body as draft);
  already-exists and concurrent-conflict states, distinguishable from generic
  errors (plan ADR-8); failed-submit moving focus to the first invalid field
  with a message naming field + fix; a staged run in the existing
  inbox/portfolio. First paint: <=6 required-looking fields; budget pre-filled,
  never blank. Real labels on every field. Avoid the generic-generated-
  dashboard signature; panel styling varies by semantic weight, no gradient
  numeric readouts.

  Must-cover, CLI (HTML-rendered terminal transcripts in the same candidate):
  `agentic new` and `agentic arm` per plan IC-6 — fully-flagged non-interactive
  run with --yes; no-flags interactive run with prompts + $EDITOR brief review;
  preview-before-confirm in both; exists/conflict/no-identity refusals. Any
  state.yaml/intent-brief skeleton shown must match plan IC-4 verbatim,
  identical between web and CLI renderings (AC5.2).

  Research traceability section must cite ux P/A/REC and tech P/A/REC numbers
  applied and avoided; argue any deviation in one line. Write only inside
  runs/fleetview-intake/design/single-thread/.

file_contact_surface:
  - runs/fleetview-intake/design/single-thread/design-candidate.md
  - runs/fleetview-intake/design/single-thread/*.html

acceptance_tests:
  - AC1.1 (web half — entry control reachable in <=2 interactions; CLI shown via IC-6 transcripts)
  - AC1.2 (button-type trigger per G0 binding)
  - AC2.1
  - AC3.1
  - AC3.2
  - AC5.2 (skeletons rendered match plan IC-4 exactly, web and CLI)
  - AC6.2
  - AC7.1
  - AC7.2 (single confirm control permitted only with preview visible above it)
  - AC9.1
  - AC11.1 and AC11.2 (as designed transcripts)
  - AC12.1
  - AC12.2
  - AC13.1
  - "No-drafting-model degradation state is sketched (plan ADR-6)"
  - "design-candidate.md has all six contract sections; every mockup opens from disk with no external assets"
  - "Thesis is distinguishable at a glance from candidate 01's"

