id: 03-intake-seam-reference
title: Seam reference — buildable specification of the creation seam, drivers, registry, and staged lifecycle
requirements: [R1, R2, R4, R5, R6, R7, R8, R9, R10, R11, R14]

scope: |
  Produce runs/fleetview-intake/design/seam-reference.md: the normative,
  buildable elaboration of plan.md IC-1..IC-6 and ADR-2..ADR-8 that the
  follow-on implementation run plans from. This task writes NO code and edits
  NOTHING outside runs/fleetview-intake/ — contracts/, registry/, and frontend/
  changes it describes are proposals quoted in this document, to be applied by
  the follow-on run. Read spec.md, plan.md, tech-research.md, and the actual
  code paths named below before writing; where the plan's proposed signatures
  conflict with what you find in source, follow source and record the
  discrepancy in notes (do not silently diverge from the plan).

  Required sections:

  1. Contract deltas, as exact quotable text: (a) contracts/state.yaml — the
     `staged` phase enum amendment, the `intake:` provenance block (source id,
     external ref, url, client_key, staged_by) with comments, and the staging /
     arming commit-message grammar additions; (b) contracts/intent-brief.md —
     a header provenance comment for imported items. Justify each against R10
     and R14.
  2. registry/task-sources.yaml — full proposed schema plus the complete
     GitHub Issues entry (driver id, label, ref_format, auth env var), with the
     driver isolation rule stated (tracker nouns only inside the driver module;
     AC4.1) and the add-a-source procedure (driver + registry entry, no
     core/contract edit; AC4.2).
  3. Creation seam — elaborate IC-3 against the real code: TaskItem,
     TaskSourceDriver, IntakeDraft, planRunScaffold, RunSource.stageRun,
     StageOutcome, with the create-only CAS mechanism spelled out against
     git.ts updateRefCAS/commitTree and local-source.ts writeState as the
     existing idiom (AC5.1: exactly one branch-minting path; enumerate the
     callers — web route, CLI, future triggers).
  4. Idempotency and collision decision table (plan ADR-8): identity =
     (source.id, source.ref) or client_key; replay -> exists naming the slug;
     different-identity slug collision -> refused naming the existing run
     (including merged historical runs — cite how listRuns already enumerates
     default-branch runs); concurrent race -> one CAS winner, loser conflict,
     re-presented (AC6.1, AC7.3: no unattended path stages anything — every
     stage traces to an authenticated human action).
  5. Staged lifecycle blast radius: enumerate every consumer of PHASES that
     the follow-on must touch — core schema.ts (PHASES, deriveResumePhase,
     GATE_PHASES interplay), readiness/inbox/portfolio presentation,
     orchestrator derive.ts (a new rest rule for staged, the D2 shape), and
     docs. State the arming action: DecisionAction 'arm', legal only from
     staged, mutation phase->spec, message grammar, through
     planDecision/writeState (plan ADR-3).
  6. HTTP route table elaborated from IC-5: request/response bodies, status
     codes, and error shapes for /api/intake/sources, /api/intake/item,
     /api/intake/draft (incl. 501 no-drafting-model degradation), /api/intake/
     runs, and the arm action on the existing /api/decisions. Auth: every
     route sits behind the deployment access proxy per docs/DEPLOY.md; state
     explicitly that no Access-bypass is added beyond the existing webhook
     path (AC8.1).
  7. CLI contract elaborated from IC-6: full flag table for `agentic new` and
     `agentic arm`, prompt flow (promptBurden TTY precedent from
     frontend/packages/cli/src/main.ts), $EDITOR brief review, preview text,
     exit codes, and the named no-identity refusal via the existing identity()
     path (AC8.2, AC11.1, AC11.2, AC1.1 positional utterance/ref argument,
     AC2.2 flag parity with every structured web field).
  8. Provenance and identity mechanics: the staging commit is authored under
     the confirming human's git identity, never the bot identity (AC9.2 —
     contrast with LocalGitSource's options.identity bot pinning); drafting
     cost accounting per plan ADR-6 (draft cost into the staged run's opening
     ledger entry; abandoned drafts logged host-side against the host-wide
     spend limit).
  9. Worked example: the complete committed artifacts for one staged run
     imported from a GitHub issue — intent-brief.md and state.yaml matching
     plan IC-4 exactly — plus the same for a free-form (client_key) staging.
  10. Follow-on verification notes: for each implementation-grade AC (4.1,
      4.2, 5.1, 6.1, 7.3, 8.1, 8.2, 9.2, 10.1, 14.1) one named check the
      follow-on run can execute (grep target, restart scenario, replay
      scenario).

  Write only inside runs/fleetview-intake/design/.

file_contact_surface:
  - runs/fleetview-intake/design/seam-reference.md

acceptance_tests:
  - "All ten required sections present; consuming agents bounce a missing section"
  - AC4.1 and AC4.2 (designed mechanism + verification note)
  - AC5.1 (single-seam design with caller enumeration)
  - AC6.1 (idempotency decision table)
  - AC7.3 (no unattended staging path exists in the design)
  - AC8.1 and AC8.2 (auth mapping + named CLI refusal)
  - AC9.2 (human-identity commit mechanics)
  - AC10.1 (staged state readable from the run branch; no pending store, plan ADR-7)
  - AC14.1 (intake: provenance block specified in committed artifacts)
  - "Worked examples match plan IC-4 verbatim"
  - "Every code reference (file/function) verified against this checkout, not assumed"

depends_on: []

status: pending

notes: |
  Round 2 (review-03-intake-seam-reference-r1.md, F1-F5) — all five findings
  fixed in the document; none rebutted:

  F1 (blocking, AC4.1 grep self-trips on §2's own proposal): fixed. Split
  §10's AC4.1 into two checks: (1) the original grep, scoped to
  contracts/state.yaml, contracts/intent-brief.md, and top-level
  core/src/*.ts only — registry/task-sources.yaml removed from the grep
  target since its permitted display values (`label: GitHub Issues`,
  `ref_format: "owner/repo#N or issue URL"`) and the isolation-rule comment's
  own prose legitimately contain the flagged words; (2) a new structural
  check on registry/task-sources.yaml itself — confirm each entry uses only
  the four generic schema keys (driver/label/ref_format/auth), which is what
  the isolation rule actually constrains at the registry layer (tracker-noun
  *keys*, not tracker-naming *prose values*). See seam-reference.md:882-909.

  F2 (major, worked example 9a diverges from IC-4's literal skeleton with no
  discrepancy note): fixed. Added a discrepancy note directly under 9a's
  state.yaml (seam-reference.md:754-770) explaining the IC-4-verbatim vs
  ADR-6 drafting-cost tension for a drafted import, contrasted with 9b (which
  uses --no-draft and matches IC-4's literal zero exactly). Indexed the note
  in the bottom discrepancy summary (:929-933 region, new §9a bullet).

  F3 (minor, AC4.2 check assumes registry-only add-a-source, contradicting
  §2's 3-step procedure): fixed. Rewrote §10's AC4.2 check to exercise all
  three of §2's steps (driver module + registry entry + index.ts barrel
  line), assert the driver actually resolves through /api/intake/item, and
  clarify that spec AC4.2's "driver plus registry entry" is read inclusive
  of the one-line mechanical barrel export, not as forbidding it — also
  added a clarifying sentence reconciling that reading with §2:167-168's
  "no core edit" framing (the barrel line touches a core file but adds no
  new type/logic). See seam-reference.md:910-932.

  F4 (minor, wrong local-source.ts line cited for commitTree call): fixed.
  Re-verified against the current checkout — the plumbing-path commitTree
  call is at local-source.ts:257 (`const commit = await
  this.git.commitTree(tree, tip, message, this.options.identity)`); 246-256
  is the worktree-path's `git push origin` block, as the review found.
  Corrected §8's citation to cite :28 (the option) and :257 (its use)
  separately, matching §3.2's existing correct citation. See
  seam-reference.md:655-657.

  F5 (minor, KindChip "undefined" claim): fixed. Re-verified against
  chips.tsx: the label lookup at chips.tsx:34 does evaluate to `undefined`
  for an unhandled InboxKind, but React renders an `undefined` JSX child as
  nothing, so the badge renders empty, not the literal string "undefined".
  Corrected §5 item 7's wording to describe the actual failure mode (empty
  badge) while keeping the same remediation (add a `staged` case). See
  seam-reference.md:488-497.
