id: 02-snapshot-generator
title: Static snapshot generator with done-on-default-branch content selection
requirements: [R1, R2, R4, R6, R9]

scope: |
  Write `packages/server/src/snapshot.ts` exactly as the plan's "Snapshot
  generator" and "Demo tree layout" contracts describe (plan ADR-1, ADR-3,
  ADR-6). It is a script, not a CLI subcommand: nothing under `packages/cli`
  changes, and it must never import `./main.ts`, `@hono/node-server`, or call
  `serve(`/`.listen(`.

  1. `DoneOnDefaultBranchSource implements RunSource`, wrapping a
     `LocalGitSource`. `survey()` reads `inner.git.defaultBranch()`, the runs
     root from `inner.frameworkRoots()`, lists slugs with
     `inner.git.lsTreeDirs(defaultBranch, runsRoot)`, reads each
     `runs/<slug>/state.yaml` with `inner.git.show`, parses it with core's
     `parseRunState`, and includes the slug only when the parsed phase is
     exactly 'done'; everything else lands in `excluded` with a reason
     ("phase <p>", "state.yaml unreadable: <error>", or "no state.yaml").
     `listRuns()` returns, for each included slug, a `RunRef` with
     source = this.id, slug, ref = the default branch, kind = 'default',
     branch = 'run/' + slug, sorted by slug. Every other `RunSource` member,
     including the optional ones (`runHistory`, `aheadOfOrigin`,
     `behindOrigin`, `originUrl`), delegates to the inner source. Expose no
     `dir` property (so `/api/engine-health` skips it).
  2. `buildDemoSources({ repo, repoId })`: the real source is
     `new DoneOnDefaultBranchSource(new LocalGitSource(repoId, repo, { localOnly: true }))`;
     the fixture source is
     `new LocalGitSource(FIXTURE_SOURCE_ID, generateFixtureRepo().dir, { localOnly: true })`
     (`FIXTURE_SOURCE_ID` from `./contract.ts`). Return both, the fixture dir,
     and the wrapper.
  3. `writeSnapshot(app, { outDir, webDist?, excluded? })`: for each route in
     `SNAPSHOT_GLOBAL_ROUTES`, then for every run in the `/api/runs` body for
     each `SNAPSHOT_RUN_ROUTES` suffix, then for every path in each run's
     detail `artifacts` as `/api/runs/<src>/<slug>/artifact/<path>` (segments
     `encodeURIComponent`-ed in the request, decoded in the filename), call
     `app.request(route)`; a non-2xx status throws an Error whose message is
     the route followed by " → " and the status; write the body text to
     `<outDir><route>.json`, creating directories. When `webDist` is given,
     copy it recursively into `outDir` (`fs.cp` with `recursive: true`), then
     write a copy of `<webDist>/index.html` at `<outDir>/<shell>/index.html`
     for each of `ROUTE_SHELLS` (except the empty shell, which the copy
     already covers) and for `runs/<source>/<slug>` per run. Return the
     `SnapshotReport`.
  4. CLI guard in the workspace's idiom
     (`process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)`):
     parse `--repo`, `--out`, `--repo-id` (default `gateline`), `--web-dist`;
     `createApp({ sources })`; print each excluded slug with its reason to
     stderr, a one-line summary (routes, runs by source, shells) to stdout;
     exit 1 with the error message on failure. Remove the generated fixture
     dir on exit. Add `"snapshot": "node src/snapshot.ts"` to
     `packages/server/package.json` scripts.

  Tests in `packages/server/test/snapshot.test.ts` (vitest, fixture-based like
  `app.test.ts`): generate two fixture repos; wrap one in
  `DoneOnDefaultBranchSource` (expect `listRuns()` = only `done-merged`, and
  `survey().excluded` empty since only one run lives on the fixture's main);
  use the other as the `fixture` source; `writeSnapshot` into a temp dir with
  a fake `webDist` (an `index.html` plus `assets/x.js`) and assert: a file
  exists for every global route and every per-run route of every run in
  `runs.json`; one `artifact/<path>.json` per entry in each run's detail
  `artifacts`, parsing to the same body as `app.request` for that route;
  `runs.json` lists exactly `done-merged` from the wrapped source plus every
  `FixtureRepo.runs` slug from the fixture source and nothing else; shells
  exist at `index.html`, `portfolio/index.html`, `portfolio/new/index.html`,
  `metrics/index.html` and `runs/fixture/g2-pending/index.html`;
  `assets/x.js` was copied; the module's own source text contains neither
  `serve(` nor `.listen(`; and no file under `packages/cli/src` mentions
  `snapshot` (assert by reading the cli source tree in the test).

  Constraints: no new dependencies (`@gateline/fixtures` is already a server
  devDependency); erasable TypeScript only, `.ts` import extensions; both
  sources `localOnly: true` so the script never fetches or pushes.

file_contact_surface:
  - packages/server/src/snapshot.ts
  - packages/server/test/snapshot.test.ts
  - packages/server/package.json

acceptance_tests:
  - AC1.1
  - AC1.2
  - AC1.3
  - AC2.1
  - AC2.2
  - AC4.1
  - AC6.1
  - AC9.1
  - "vitest snapshot.test.ts: every route in the plan's tree layout exists as <route>.json and parses as JSON"
  - "vitest snapshot.test.ts: runs.json = {done-merged from the wrapped source} plus {every generateFixtureRepo() run}, no others"
  - "vitest snapshot.test.ts: shells exist for '', portfolio, portfolio/new, metrics and runs/<src>/<slug> per run"
  - "grep -E 'serve\\(|\\.listen\\(' packages/server/src/snapshot.ts returns no matches"
  - "npm run typecheck && npm test && npm run lint pass in packages/"

depends_on: [01-artifact-path-route]

status: pending

notes: |
  round 1 (implementer): built as scoped. One deviation worth recording:
  snapshot.test.ts's beforeAll does a full writeSnapshot pass over two full
  generateFixtureRepo() repos (16 runs x 7 route suffixes, plus per-run
  artifacts) — real work the acceptance tests require, ~18-29s standalone,
  but it exceeded the project's global 30s vitest hookTimeout once the rest
  of the suite's files were sharing the 4-fork pool. Fixed locally (no
  vitest.config.ts change, out of this task's file_contact_surface anyway):
  gave that one beforeAll an explicit 180s timeout, and reworked the
  "excluded passes through" case to run writeSnapshot against a minimal stub
  Hono app instead of re-running the full heavy pass a second time. Full
  `npm test` (in packages/) subsequently passed clean twice in a row: 99
  files / 1264 tests passed, 2 skipped (pre-existing, unrelated).

  Manually verified the CLI end-to-end against this actual repo (`node
  src/snapshot.ts --repo <repo> --out <tmp>`): it found exactly the 7 real
  `done` runs the spec names as ground truth (creation-seam, dupefind,
  local-only-mode, mdtoc, web-staging, wordfreq, writestate-kill-window),
  correctly excluded the rest with reasons (phase spec/release, no
  state.yaml), wrote 354 routes, and cleaned up its generated fixture dir on
  exit.

  round 2 (implementer): addressed review-02 (request-changes). All six
  findings fixed, none rebutted.

  F1 (blocking, phase filter unguarded): fixed in snapshot.test.ts's
  beforeAll — after generateFixtureRepo() builds the stand-in repo, commit
  four more run directories straight onto its own main via execFileSync git
  (same idiom as app.test.ts/merged-runs.test.ts): a second schema-valid
  `done` run (`aaa-second-done`, done-merged's own state.yaml text with the
  slug swapped, sorting before done-merged to exercise the sort too), a
  schema-valid run at another phase (`zzz-wrong-phase`, phase: release), a
  `state.yaml` that isn't valid YAML (`bad-yaml-state`), and a run directory
  with no `state.yaml` at all (`no-state-run`). New assertions:
  `listRuns()` = `['aaa-second-done', 'done-merged']` in that order, and
  `survey().excluded` names all three exclusions with their exact reasons
  (`phase release`, `state.yaml unreadable: ...` via stringMatching, `no
  state.yaml`) and nothing else. Updated the `runs.json` exact-set assertion
  to include both done slugs. Hand-verified the kill: reproduced the
  reviewer's mutant (deleting the phase check, admitting every parseable
  state.yaml) on a scratch copy of snapshot.ts — 3 tests failed (the two
  DoneOnDefaultBranchSource tests plus the runs.json exact-set test), all
  for the reason the mutant should trip; reverted.

  F2 (route/shell sets untested against the plan): added a
  "route/shell constants match the plan's contract" describe block with one
  `toEqual` per exported constant against the plan's own literal list (not
  against itself). Hand-verified: dropping `/api/metrics`, `/diff`, and
  `metrics` (all three at once, then individually) each fails exactly the
  matching new test and nothing else; reverted.

  F3 (dangling flag values / unknown flags silently accepted): moved argv
  parsing inside the `run()` async function so a thrown parse error reaches
  the same `.catch` → stderr → exit(1) path as the existing usage check;
  each flag now reads its value through a helper that throws the usage
  message when the next arg is `undefined` (a trailing `--repo-id` or
  `--web-dist`), and an unrecognised flag now throws the same usage message
  instead of being ignored. Verified by hand: `--repo . --out <dir>
  --repo-id` (no value), `--web-dist` (no value), and `--bogus` all now
  print the usage line to stderr and exit 1, instead of failing later with a
  misleading route error or silently doing nothing; a full valid run against
  this repo still produces the same 354-route, 7-done-run output as round 1.
  No new dependency, no CLI-level unit test added (the guard only runs under
  direct invocation; exercising it needs a subprocess spawn, which felt like
  more machinery than a minor finding warranted next to the manual
  verification above).

  F4 (per-run route assertion checks existence only): added `JSON.parse` +
  truthiness check inside the per-run-route loop, matching the global-route
  and artifact loops. Hand-verified: a mutant writing a non-JSON body for
  every suffix but the detail route itself fails exactly this test with a
  JSON.parse SyntaxError; reverted.

  F5 (encoded-request/decoded-filename split unexercised, PLAUSIBLE):
  fixed rather than rebutted — in the same beforeAll commit as F1, added a
  real artifact under `done-merged` named `notes with space #1.md` (a space
  and a `#`, both bytes `encodeURIComponent` rewrites, unlike every artifact
  name `generateFixtureRepo()` ships otherwise). No new test code was
  needed: the existing "matching the live route body" test already loops
  every artifact in `done-merged`'s detail response, asserting the file
  lands at the literal decoded path and its body matches the encoded live
  route — it just had nothing that discriminated the split before. Hand-
  verified: the reviewer's exact mutant (`fileRoute` built from `encoded`
  instead of `path`) fails that test's `existsSync` assertion for the new
  artifact; reverted.

  F6 (out2/fail mkdtemp dirs never removed): added a module-level
  `extraTempDirs` array; both ad-hoc `mkdtempSync` calls now push into it,
  and `afterAll` sweeps it alongside the shared `outDir`/`webDist`/repo dirs.

  Verification (packages/): `npm run typecheck` clean, `npm run lint`
  (biome check) clean on 231 files, `npx vitest run
  server/test/snapshot.test.ts` alone: 19/19 passed (~72s, within the
  file's own 180s beforeAll timeout). Full `npm test` run separately;
  see the report for its result.
