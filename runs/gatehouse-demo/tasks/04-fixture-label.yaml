id: 04-fixture-label
title: Visible "fixture data" label on every surface that renders a fixture-sourced run
requirements: [R3]

scope: |
  Label runs whose `source` is the fixture source id so illustration is never
  mistaken for evidence (plan ADR-5, "Fixture label").

  1. New `packages/web/src/components/fixture-label.tsx`:
     `isFixtureSource(source: string): boolean` returns
     `source === FIXTURE_SOURCE_ID` (value import from
     `@gateline/server/contract`, the one workspace module web may import —
     `web/test/boundary.test.ts` already allows it). `FixtureLabel({ className? })`
     renders `<Imp tone="hatch" data-fixture-label title="Generated fixture run — illustrates a pipeline state; not a record of real work">fixture data</Imp>`
     using `Imp` from `./chips.tsx`. The text is visible in the markup, never
     hover-only. Final wording is a follow-up's call; keep this literal.
  2. `packages/web/src/pages/run.tsx`: in the header's first flex row, after
     the `<h1>`, render `<FixtureLabel />` when `isFixtureSource(summary.source)`.
  3. `packages/web/src/pages/inbox.tsx`: in `InboxRow`, beside the
     `{item.source}/{item.slug}` span, render `<FixtureLabel />` when
     `isFixtureSource(item.source)`.
  4. `packages/web/src/pages/portfolio.tsx`: in the run cell, on the
     `{run.source} · {run.profile}` line, render `<FixtureLabel className="ml-2" />`
     when `isFixtureSource(run.source)`.
  5. `packages/web/src/pages/metrics.tsx`: in the budget-honesty table's run
     cell (the `{r.source}/{r.slug}` cell), render `<FixtureLabel className="ml-2" />`
     when `isFixtureSource(r.source)`. The metrics page is shelled and its
     data snapshotted, so it renders fixture-sourced runs too — the fourth
     surface R3's "every page" covers, added on the round-1 escalation
     (review-04.md) rather than narrowing R3.

  Tests in `packages/web/test/fixture-label.test.ts`: `isFixtureSource('fixture')`
  is true and `isFixtureSource('gateline')` and `isFixtureSource('fixtures')`
  are false, so a substring or prefix match cannot survive; `renderToStaticMarkup`
  of `FixtureLabel` contains `data-fixture-label` and the visible text
  `fixture data` as a child node, not only inside `title` (vitest layer 2
  idiom in `packages/vitest.config.ts` — a `.ts` test importing a `.tsx`
  component, no DOM). Do not add jsdom.

  The browser-level assertion that a fixture run page shows the label and a
  real run page does not (AC3.1) is task 05's e2e; this task supplies the
  markup hook `[data-fixture-label]` it looks for.

  Constraints: touch no file outside the surface; `npx tsc -p web/tsconfig.json`,
  `npx vitest run web/test`, `npm run lint` and the existing e2e must stay
  green (no fixture run renders the label in `gateline ui --demo`, whose
  source id is the temp dir's basename, so no existing assertion changes).

file_contact_surface:
  - packages/web/src/components/fixture-label.tsx
  - packages/web/src/pages/run.tsx
  - packages/web/src/pages/inbox.tsx
  - packages/web/src/pages/portfolio.tsx
  - packages/web/src/pages/metrics.tsx
  - packages/web/test/fixture-label.test.ts

acceptance_tests:
  - AC3.1
  - AC3.2
  - "vitest fixture-label.test.ts: isFixtureSource('fixture') true, isFixtureSource('gateline') and isFixtureSource('fixtures') false; static markup of FixtureLabel contains data-fixture-label and 'fixture data' as visible text, not only in title"
  - "npx tsc -p web/tsconfig.json && npx vitest run web/test && npm run lint pass; web/test/boundary.test.ts stays green"

depends_on: [01-artifact-path-route]

status: pending

notes: |
  Implementer r1: built exactly the scope. New
  packages/web/src/components/fixture-label.tsx exports `isFixtureSource`
  (value-imports `FIXTURE_SOURCE_ID` from `@gateline/server/contract`, the
  one workspace module web may import per web/test/boundary.test.ts) and
  `FixtureLabel`, an `Imp tone="hatch" data-fixture-label` wrapping the
  literal text "fixture data" with the spec's title string. Wired it in at
  the three call sites: run.tsx renders `<FixtureLabel />` right after the
  `<h1>` in the header's first flex row, gated on
  `isFixtureSource(summary.source)`; inbox.tsx's `InboxRow` renders it beside
  the `{item.source}/{item.slug}` span inside the same flex-wrap row, gated
  on `isFixtureSource(item.source)`; portfolio.tsx's run cell renders
  `<FixtureLabel className="ml-2" />` on the `{run.source} · {run.profile}`
  line, gated on `isFixtureSource(run.source)`. New
  packages/web/test/fixture-label.test.ts is the layer-2 `.ts` test
  (renderToStaticMarkup, no jsdom) asserting `isFixtureSource('fixture')` is
  true, `isFixtureSource('gateline')` is false, and the rendered markup
  contains both `data-fixture-label` and the visible text `fixture data`.

  Hand-verified both fixtures against mutants on a scratch copy of
  fixture-label.tsx, each reverted after: (a) `isFixtureSource` hard-coded to
  `return true` — killed the "is false for a real source id" case; (b)
  renamed `data-fixture-label` to `data-fixture-badge` and changed the text
  to "fixture info" — killed the "renders the data hook and visible text"
  case (both assertions in that test failed independently). Restored the
  file after each mutant and confirmed it matched the pre-mutant version
  before re-running the full suite.

  Verification (packages/): `npx tsc -p web/tsconfig.json` clean (no output);
  `npx vitest run web/test` — 22 test files, 261 tests passed, including
  boundary.test.ts unchanged; `npm run lint` — "Checked 231 files in 67ms. No
  fixes applied." Did not touch server or core; `FIXTURE_SOURCE_ID` and `Imp`
  were consumed exactly as they already existed. Files changed: new
  packages/web/src/components/fixture-label.tsx,
  packages/web/test/fixture-label.test.ts; modified
  packages/web/src/pages/run.tsx, packages/web/src/pages/inbox.tsx,
  packages/web/src/pages/portfolio.tsx (import + one render line each). Left
  uncommitted per dispatch.

  Implementer r2: addressed the escalation and both findings from
  review-04.md.

  Escalation (metrics.tsx, scope item 5): the human resolved the round-1
  escalation as return-to-implement and widened the task's surface with
  `packages/web/src/pages/metrics.tsx`. Added
  `import { FixtureLabel, isFixtureSource } from '../components/fixture-label.tsx'`
  and, in `BudgetSection`'s run cell (the `{r.source}/{r.slug}` `<td>`),
  `{isFixtureSource(r.source) && <FixtureLabel className="ml-2" />}` —
  identical gating pattern to portfolio.tsx's run cell, same `ml-2` spacing.
  No other line in metrics.tsx touched.

  F1 (major — markup test couldn't distinguish visible text from
  title-only text): added a second `FixtureLabel` test asserting
  `html.replace(/<[^>]+>/g, '')` equals exactly `'fixture data'` (i.e. the
  only text content in the whole element, after stripping every tag, is the
  visible label — nothing survives if the word is only inside `title`) plus
  `expect(html).toMatch(/>fixture data</)` as a second, narrower pin. Applied
  the reviewer's exact mutant to `fixture-label.tsx` on the real file
  (`title="fixture data"`, no children) and reran
  `npx vitest run web/test/fixture-label.test.ts`: the new test failed
  (`expected '' to be 'fixture data'`), 4/5 passed — mutant killed. Restored
  `fixture-label.tsx` from a pre-mutant copy and confirmed `git diff` on that
  file was empty (byte-identical to pre-mutant) before moving on.

  F2 (minor — substring/prefix matches survived): added
  `isFixtureSource('fixtures')` → `false` to the `isFixtureSource` describe
  block, per the task's updated acceptance-test line. Applied the reviewer's
  `includes` mutant (`return source.includes(FIXTURE_SOURCE_ID)`) to the real
  file and reran the same targeted vitest command: the new test failed
  (`expected true to be false`), 4/5 passed — mutant killed. Restored the
  file again and reconfirmed an empty `git diff` on it.

  No rebuttals — all three items (escalation, F1, F2) taken as findings and
  fixed as specified; no jsdom or new dependency added.

  Verification (packages/, after restoring fixture-label.tsx both times):
  `npx tsc -p web/tsconfig.json` clean (no output); `npx vitest run web/test`
  — 22 test files, 263 tests passed (261 + 2 new: the AC3.2 child-node pin
  and the `'fixtures'` negative case), boundary.test.ts unchanged; `npm run
  lint` — "Checked 231 files in 66ms. No fixes applied." Files changed this
  round: `packages/web/src/pages/metrics.tsx` (import + one gated render
  line), `packages/web/test/fixture-label.test.ts` (two new test cases).
  `packages/web/src/components/fixture-label.tsx` and the other three page
  files are untouched this round (verified via `git diff --stat`, which
  lists only the two files above). Left uncommitted per dispatch.
