id: 05-static-render-check
title: Pages-like static server and the Playwright render check over the assembled demo tree
requirements: [R3, R4, R5, R6, R7]

scope: |
  Prove the demo renders and refuses correctly from files alone, in a form
  the Pages workflow (task 06) and a local verifier both run (plan ADR-7,
  "Pages-like static server", "Static render check").

  1. New `packages/web/scripts/serve-static.mjs` (node:http and node:fs only,
     no dependencies): `--root <dir> --port <n>`. GET/HEAD only — any other
     method answers 405 with a plain-text body. Resolve the URL pathname under
     root, refusing anything that escapes it (404). A regular file → 200 with
     MIME by extension (reuse the table shape in `server/src/main.ts`: html,
     js, css, svg, png, ico, woff2, json; default `application/octet-stream`).
     A directory requested without a trailing slash → 301 `Location` to the
     slashed path with the query string preserved. A directory → its
     `index.html`, else 404. Missing → 404 whose body is `<root>/404.html`
     when that file exists (content-type text/html), else plain text. Print
     "serve-static: http://127.0.0.1:<port> ← <root>" on listen.
  2. New `packages/playwright.static.config.ts`: `testDir: './e2e-static'`,
     `timeout: 60_000`, `expect: { timeout: 15_000 }`, `retries: 0`,
     `use: { baseURL: 'http://127.0.0.1:4397', viewport: { width: 1280, height: 900 } }`,
     and a `webServer` whose `command` is
     "node web/scripts/serve-static.mjs --root <DEMO_SITE_ROOT or ../_site> --port 4397"
     (read `process.env.DEMO_SITE_ROOT`, default `'../_site'`), with
     `url: 'http://127.0.0.1:4397/demo/api/health.json'`,
     `reuseExistingServer: false`, `timeout: 30_000`.
     Add `"e2e:static": "playwright test -c playwright.static.config.ts"` to
     `packages/package.json` scripts and `"e2e-static/**"` to
     `files.includes` in `packages/biome.json`. Do not touch
     `playwright.config.ts`; its `testDir: './e2e'` never sees the new dir.
  3. New `packages/e2e-static/demo.spec.ts`. Before all, fetch
     `/demo/api/runs.json` and pick one run whose `source !== 'fixture'`
     (the real run) and the fixture run `g2-pending`; fail loudly if either is
     missing. Every navigation is a fresh `page.goto` (a fresh HTTP request,
     never a client-side route change). Tests:
     - `/demo/`, `/demo/portfolio`, `/demo/metrics` each respond 200 (check
       the `goto` response, following the 301 where the path lacks a slash)
       and render their heading (`Inbox`, `Portfolio`, and the metrics page's
       heading) (AC6.1).
     - `/demo/runs/<real src>/<real slug>` renders an `h1` with the slug and
       has zero `[data-fixture-label]`; `/demo/runs/fixture/g2-pending`
       renders its `h1` and at least one `[data-fixture-label]` containing
       `fixture data` in the initial markup (AC3.1, AC3.2, AC6.1).
     - `/demo/runs/fixture/g2-pending?tab=record&artifact=spec.md` renders the
       artifact body (the reader shows `runs/g2-pending/spec.md`) — the path
       form resolved to a file.
     - No `EventSource` is ever constructed: `page.addInitScript` replaces
       `window.EventSource` with a constructor that records calls on
       `window.__es`; after loading `/demo/` and waiting for the inbox rows,
       `window.__es` is empty (AC4.2).
     - Refusal on approve (AC5.1): on `/demo/runs/fixture/g2-pending?decide=G2`
       click `[data-decide="approve"]`, choose a burden radio, click
       `[data-decide="approve-confirm"]`; assert a `POST` whose URL ends with
       `/api/decisions` was issued and answered non-2xx (`page.waitForResponse`);
       assert a `[role="status"]` flash renders, the confirm button is
       enabled again with text `Approve G2` (no `Committing…` left), and the
       G2 gate is still undecided — locate the header's phase spine and
       assert its G2 cell does not read as approved (check
       `components/chips.tsx`'s spine markup for the exact hook).
     - Refusal on staging (AC5.2): record the inbox count from
       `/demo/api/inbox.json`; on `/demo/portfolio/new` fill title, keep the
       suggested slug, fill every `#section-<slug> textarea` (see
       `e2e/staging.spec.ts` for the idiom), click the `Stage run` button;
       assert a `POST` ending in `/api/runs` answered non-2xx and the form's
       network-error flash renders; then `goto('/demo/')` and assert the row
       count equals the recorded inbox count.
     - `/demo/nope/never` responds 404 and renders `Page not found` (AC6.2).
  4. Local recipe, to be recorded in this task's notes after you run it:
     mkdir -p /tmp/gl-site && cp site/404.html /tmp/gl-site/ &&
     (cd packages && npm run build:static -w @gateline/web &&
     node server/src/snapshot.ts --repo "$PWD/.." --out /tmp/gl-site/demo --web-dist web/dist-static &&
     DEMO_SITE_ROOT=/tmp/gl-site npm run e2e:static).
     Note: `serve-static` serves `404.html` from its root, which is why the
     recipe copies the site's 404 page beside `demo/`.

  Constraints: no new dependencies; `npm run lint` covers the new dir; the
  main `npx playwright test` must be unaffected.

file_contact_surface:
  - packages/web/scripts/serve-static.mjs
  - packages/playwright.static.config.ts
  - packages/e2e-static/demo.spec.ts
  - packages/package.json
  - packages/biome.json

acceptance_tests:
  - AC3.1
  - AC3.2
  - AC4.2
  - AC5.1
  - AC5.2
  - AC6.1
  - AC6.2
  - AC7.3
  - "DEMO_SITE_ROOT=<assembled tree> npm run e2e:static passes against a tree built by tasks 02 and 03"
  - "npm run e2e:static fails when a run's detail JSON is deleted from the tree (prove the check can fail; record in notes)"
  - "npm run lint passes; npx playwright test (the live suite) is unaffected"

depends_on: [02-snapshot-generator, 03-web-static-mode, 04-fixture-label]

status: in-review

notes: |
  Implementer round 1.

  Built exactly the five files in file_contact_surface:
  - packages/web/scripts/serve-static.mjs (new) — node:http + node:fs/promises
    + node:path only. GET/HEAD only (405 plain text otherwise); paths resolved
    under --root and refused (404) if they escape it; directory without a
    trailing slash -> 301 with query string preserved; directory -> its
    index.html or 404; missing -> <root>/404.html when present (text/html)
    else plain text; prints "serve-static: http://127.0.0.1:<port> ← <root>"
    on listen. Mirrors the MIME table shape in server/src/main.ts (html, js,
    css, svg, png, ico, woff2, json; default application/octet-stream) as a
    sibling literal rather than an import, so this script never reaches into
    `server` (it must stay a plain static host, never a second server per R4).
  - packages/playwright.static.config.ts (new) — testDir './e2e-static',
    timeout 60_000, expect.timeout 15_000, retries 0, baseURL
    'http://127.0.0.1:4397', viewport 1280x900, webServer command
    "node web/scripts/serve-static.mjs --root <DEMO_SITE_ROOT|../_site>
    --port 4397", url 'http://127.0.0.1:4397/demo/api/health.json',
    reuseExistingServer false, timeout 30_000. playwright.config.ts
    untouched.
  - packages/e2e-static/demo.spec.ts (new) — 7 tests covering AC3.1, AC3.2,
    AC4.2, AC5.1, AC5.2, AC6.1, AC6.2, AC7.3 (this suite failing a PR's
    `build` job is what AC7.3 asks of task 06's workflow wiring; this task
    proves the check itself discriminates). beforeAll reads
    /demo/api/runs.json and resolves one non-fixture run plus the fixture
    run g2-pending, failing loudly if either is missing. Every test does a
    fresh page.goto. Notable idioms carried over from packages/e2e: the
    sr-only burden radio is clicked via its label text ("Light correction",
    smoke.spec.ts's own idiom), and the staging form's required sections are
    read live from GET /api/staging (sources[0].briefSections) rather than
    hardcoded, so the test can't drift from whichever source new-run.tsx
    defaults to.
  - packages/package.json — added "e2e:static": "playwright test -c
    playwright.static.config.ts".
  - packages/biome.json — added "e2e-static/**" to files.includes (same
    treatment as the existing "e2e/**" entry). Did not add packages/web/scripts
    to the includes list: the existing web/scripts/check-bundle.mjs (task 03)
    is likewise not linted today, and the task only asked for the e2e-static
    entry — kept the addition to exactly what was scoped.

  Local recipe run (packages/ as cwd unless noted), verbatim per the task's
  scope item 4, plus `npm install` first since packages/node_modules was
  missing @vitejs/plugin-react et al. in this worktree:

    npm install
    mkdir -p /tmp/gl-site && cp site/404.html /tmp/gl-site/
    npm run build:static -w @gateline/web
    node server/src/snapshot.ts --repo "$PWD/.." --out /tmp/gl-site/demo --web-dist web/dist-static
    DEMO_SITE_ROOT=/tmp/gl-site npm run e2e:static

  Results:
  - npm install: ok (5 packages added — the worktree's node_modules was
    incomplete for @gateline/web's deps).
  - build:static: ok — "check-bundle: 1 bundle file(s) clean — no node
    builtins".
  - snapshot generator: ok — "snapshot: 354 routes, 22 runs (fixture: 15,
    gateline: 7), 26 shells", excluding 8 non-done/missing-state runs by
    name (matches the plan's ADR-3 excluded-log behaviour; nothing here is
    this task's concern beyond confirming the generator still runs clean
    under the recipe).
  - DEMO_SITE_ROOT=/tmp/gl-site npm run e2e:static: 7 passed (1.5s), first
    try, no flakes.

  Negative check (required by acceptance_tests): deleted one real run's
  detail JSON from the assembled tree
  (/tmp/gl-site/demo/api/runs/gateline/writestate-kill-window.json — the
  first non-fixture entry /demo/api/runs.json actually lists; runs.json
  itself is unaffected by the deletion, only that run's own detail route
  is now a 404) and reran `DEMO_SITE_ROOT=/tmp/gl-site npm run e2e:static`:
  1 failed / 6 passed — the "a real run and the fixture run both resolve on
  a deep link" test (AC3.1/AC3.2/AC6.1) timed out waiting for `h1`, since
  page.goto to that run's route now 404s. Restored the file from a backup
  copy and reran: 7 passed again, confirming the failure was solely the
  deleted fixture and the suite is otherwise stable. (First attempt at this
  negative check deleted packages/e2e-static's expected pick's neighbor by
  mistake — /api/runs/gateline/creation-seam.json — which the suite didn't
  read because the test's `find()` over runs.json picks the first
  non-fixture entry in *that file's own order*, which is age/priority-based,
  not alphabetical; the run actually visited was writestate-kill-window.
  Restored that no-op deletion too before moving on — no lasting effect,
  noted here only because it is the reason two file names appear above.)

  Also ran, both clean:
  - npm run lint → "Checked 232 files in 65ms. No fixes applied."
  - npm run typecheck → tsc -p tsconfig.json && tsc -p web/tsconfig.json,
    no output, exit 0. (e2e-static is not in either tsconfig's `include`
    list, same as e2e/ today — Playwright itself still runs the spec via
    esbuild transform regardless, which is what the e2e:static run above
    exercises.)
  - npx playwright test --list (root config, no -c flag) → still exactly
    "Total: 49 tests in 5 files", all under e2e/ — confirms the live suite
    is unaffected and playwright.config.ts's testDir './e2e' never sees
    packages/e2e-static.
  - npx playwright test -c playwright.static.config.ts --list → "Total: 7
    tests in 1 file" (e2e-static/demo.spec.ts only).

  No deviations from the task's scope. One judgment call, recorded rather
  than silently made: AC6.2's 404 check relies on this task's own recipe
  copying site/404.html to the *served root*'s top level (DEMO_SITE_ROOT),
  not under demo/ — exactly as the task's own note says ("serve-static
  serves 404.html from its root, which is why the recipe copies the site's
  404 page beside demo/"). This task does not touch the Pages workflow
  (task 06's job) that will need to make the equivalent true there (site's
  own build already places 404.html at _site/404.html, so no extra copy step
  is expected in that context, but that is task 06's acceptance to prove,
  not this one's).
