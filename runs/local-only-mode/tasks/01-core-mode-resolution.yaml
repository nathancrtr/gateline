id: 01-core-mode-resolution
title: Resolve local-only onto the push chain in loadSources and LocalGitSource, with the named conflict error and the fetch guard
requirements: [R1, R2, R4]

scope: |
  Implement the plan's normative mode-resolution table in
  frontend/packages/core/src/view-model/config.ts and carry the resolved flag on
  frontend/packages/core/src/sources/local-source.ts.

  config.ts:
  - Add `local_only: z.boolean().optional()` to the source entry schema and drop
    the `.default(false)` from `push` (apply `?? false` inside resolution instead,
    so explicit `push: false` stays distinguishable from unset — AC1.3 behavior
    identical).
  - Define and export `class LocalOnlyPushConflictError extends Error` with
    `name = 'LocalOnlyPushConflictError'` and a message naming both conflicting
    settings and the source they were found on. It is star-exported via the
    existing view-model index — do not edit any index file.
  - `loadSources` gains `localOnly?: boolean` in opts. Apply the plan's table to
    every path (repoOverrides, config entries, fallbackToCwd): conflict → throw;
    localOnly per rules 2a–2d (the CLI-only rule: opts.push === false implies
    localOnly at this tier, per ADR-1); push per rule 3. Config entries now need
    the origin probe (`pushWhenOriginExists`) for auto-detect — one extra
    `git config` read per source. Warn (existing warnings array) when a source
    resolves local-only but sets `fetch_interval` ("fetch_interval ignored —
    local-only").
  - Pass the resolved `localOnly` into every LocalGitSource constructed here.

  local-source.ts:
  - Options gain `localOnly?: boolean`; add `get localOnly(): boolean`. The
    constructor treats `localOnly: true` as forcing push off (belt-and-braces —
    loadSources already resolves push=false).
  - `syncFromRemote()` returns immediately, before any git invocation, when
    `this.localOnly` (AC2.4's mechanism for both the engine heartbeat and the
    server interval sync). Direct construction without the option is unchanged.

  Tests:
  - frontend/packages/core/test/config.test.ts: table cases — remoteless
    zero-config resolves localOnly=true (AC1.1 trigger unchanged); explicit
    opts.localOnly on an origin repo gives push=false (AC1.2 core half);
    opts.push=false implies localOnly at the CLI tier; config `push: false` with
    origin stays localOnly=false (ADR-2 poller case); config `local_only: true`
    + `push: true` and opts localOnly+push both throw LocalOnlyPushConflictError
    (AC4.1 core half); config remoteless entry auto-detects localOnly; existing
    push-precedence cases untouched (AC1.3).
  - frontend/packages/core/test/fetch-sync.test.ts: a LocalGitSource built with
    `localOnly: true` over the clone fixture — `vi.spyOn(source.git, 'run')`
    records zero invocations from `syncFromRemote()` (not a caught failure).

  Do not touch pr-ensure.ts, sync.ts, or divergence.test.ts (other tasks own them).

file_contact_surface:
  - frontend/packages/core/src/view-model/config.ts
  - frontend/packages/core/src/sources/local-source.ts
  - frontend/packages/core/test/config.test.ts
  - frontend/packages/core/test/fetch-sync.test.ts

acceptance_tests:
  - AC1.1
  - AC1.3
  - AC4.1 (loadSources half — throw on conflict, both tiers)
  - AC2.4 (guard mechanism — zero fetch via the git-run spy)
  - "npm test in frontend/ passes in full (AC7.2 baseline kept green)"

depends_on: []

status: pending

notes: |
  Implementer (round 1): implemented as scoped, no deviations.
  - config.ts: added `local_only` to the schema, dropped `.default(false)` from
    `push`, added `LocalOnlyPushConflictError` (name set in the constructor),
    and a shared `resolveMode()` helper implementing the plan's table exactly
    (rule 1 conflict throw; rule 2 localOnly precedence with the CLI-only
    push:false-implies-localOnly branch; rule 3 push default split by tier).
    `memoizedOriginExists()` caches the one extra `pushWhenOriginExists` read
    per source so rules 2d/3 share it. Config entries warn
    `source <id>: fetch_interval ignored — local-only` when they resolve
    local-only with `fetch_interval` set. `fallbackToCwd` gained a `localOnly`
    parameter threaded from `loadSources`'s new opt. Every LocalGitSource
    construction site passes the resolved `localOnly` through.
  - local-source.ts: options gained `localOnly?: boolean`, a `get localOnly()`
    getter, the constructor forces `push: false` into `this.options` when
    `localOnly` is set (belt-and-braces per the plan), and `syncFromRemote()`
    returns before any git invocation when `this.localOnly`.
  - config.test.ts: added a `local-only mode resolution` describe covering
    AC1.1 (remoteless auto-detect), AC1.2 (explicit opts.localOnly forces push
    off, verified via `pushFailed` absence against a real-but-unreachable
    origin — no public `push` getter exists so this mirrors
    divergence.test.ts's existing observation pattern), the CLI-only
    push:false-implies-localOnly rule, the config-tier ADR-2 poller case
    (push:false + origin stays localOnly:false), config-tier auto-detect,
    both conflict-throw tiers (AC4.1), the AC1.3 push-precedence regression
    (explicit push:true still overrides auto-detect even with no origin at
    all), and the fetch_interval-ignored warning. Uses its own
    beforeEach/afterEach fixture (not the file's shared `ctx`) so mutating a
    fixture's remotes never bleeds into the pre-existing #83 tests in the
    same file.
  - fetch-sync.test.ts: added a `syncFromRemote under local-only (AC2.4)`
    describe: a `LocalGitSource` built with `{ localOnly: true }` over the
    existing clone fixture, `vi.spyOn(source.git, 'run')` asserted never
    called by `syncFromRemote()`.
  - Verified: `npm run typecheck` clean; `npm test` in frontend/ — 379 passed,
    1 skipped (live-smoke, expected), 0 failed, across all 41 test files
    including the existing hosted-push-path suites (divergence.test.ts,
    pr-ensure.test.ts, sync.test.ts) and the shadow-replay suites.
