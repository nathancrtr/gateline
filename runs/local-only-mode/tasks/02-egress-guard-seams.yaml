id: 02-egress-guard-seams
title: Local-only guards in ensureDraftPr (opts.localOnly) and a planSyncForSource helper that never constructs the provider
requirements: [R2, R3]

scope: |
  Two self-contained core guards. Neither depends on task 01 — both key off a
  plain boolean handed in by callers.

  frontend/packages/core/src/sources/pr-ensure.ts (ADR-3):
  - Extend the opts parameter to `{ exec?: ExecLike; localOnly?: boolean }`.
  - First statement of ensureDraftPr: when `opts?.localOnly`, return
    `{ status: 'skipped', note: 'local-only mode — draft-PR ensure suppressed' }`
    before constructing Git or invoking anything. Existing behavior without the
    option is byte-identical.

  frontend/packages/core/src/sources/sync.ts (ADR-4):
  - Add `export async function planSyncForSource(source: RunSource,
    providerFactory: () => PrProvider): Promise<SyncPlanEntry[] | 'local-only'>`.
    When `(source as { localOnly?: boolean }).localOnly === true`, return
    'local-only' WITHOUT invoking providerFactory (AC2.3's "never constructed").
    Otherwise return `planSync(source, providerFactory())`. planSync/applySync
    signatures unchanged.

  Tests:
  - frontend/packages/core/test/pr-ensure.test.ts: the AC2.2 leak-shape unit —
    fixture repo WITH remote.origin.url and a pushed branch (the existing
    pushBranch helper), `localOnly: true`, an exec spy: result is skipped with
    the note above and the spy recorded zero calls. Also: localOnly wins even
    before the origin check (works on a remoteless dir too).
  - frontend/packages/core/test/sync.test.ts: planSyncForSource with a source
    stubbed `localOnly: true` returns 'local-only' and a vi.fn factory was never
    called; with localOnly absent it delegates to planSync and returns its plan
    (reuse the file's existing fixtures/stubs).

  Do not touch config.ts, local-source.ts, or divergence.test.ts.

file_contact_surface:
  - frontend/packages/core/src/sources/pr-ensure.ts
  - frontend/packages/core/src/sources/sync.ts
  - frontend/packages/core/test/pr-ensure.test.ts
  - frontend/packages/core/test/sync.test.ts

acceptance_tests:
  - AC2.2 (mechanism — skipped status, note, zero gh via the injected ExecLike spy)
  - AC2.3 (mechanism — provider factory never invoked)
  - "npm test in frontend/ passes in full"

depends_on: []

status: pending

notes: |
  Implementer r1: built as scoped, no deviations.
  - ensureDraftPr (pr-ensure.ts) now takes `localOnly?: boolean` in opts and
    returns `{ status: 'skipped', note: 'local-only mode — draft-PR ensure
    suppressed' }` as its first statement, before constructing Git or calling
    exec. Verified this also covers a remoteless dir (localOnly checked before
    the origin lookup).
  - planSyncForSource added to sync.ts, reading `(source as { localOnly?:
    boolean }).localOnly` and returning 'local-only' without invoking
    providerFactory when true; otherwise delegates to planSync(source,
    providerFactory()). planSync/applySync signatures untouched.
  - Tests added: pr-ensure.test.ts gained the leak-shape case (origin +
    pushed branch + localOnly:true, exec spy sees zero calls) and the
    remoteless localOnly case. sync.test.ts gained a
    describe('planSyncForSource') with a stubbed localOnly:true source
    (built via Object.assign(Object.create(getPrototypeOf(ctx.source)),
    ctx.source, { localOnly: true }) so prototype methods survive) proving
    the factory vi.fn is never called, plus a delegate case with localOnly
    absent.
  - config.ts, local-source.ts, divergence.test.ts untouched, as scoped.
  - Test results: `npx vitest run packages/core/test/pr-ensure.test.ts
    packages/core/test/sync.test.ts` — 12/12 passed. Full `npm test` in
    frontend/ — 373 passed, 1 skipped (40 files passed, 1 skipped), 0
    failures.
