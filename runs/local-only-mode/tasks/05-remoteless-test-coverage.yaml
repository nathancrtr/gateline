id: 05-remoteless-test-coverage
title: divergence.test.ts gains the named-mode cases — the PR-ensure leak short-circuit and the remoteless sync short-circuit
requirements: [R1, R2, R3, R7]

scope: |
  Append new describes to frontend/packages/core/test/divergence.test.ts ONLY —
  do not reflow or edit the existing cases (the spec pins them by line range:
  72-114 and 134-211 must stay green and recognizable). Reuse the file's
  addOrigin/originTip/refFor helpers.

  New coverage (AC7.1):
  - Named mode via auto-detect: loadSources over the remoteless fixture yields a
    source whose `localOnly` flag is true; with an origin added it is false
    (AC1.1 — the mode is nameable, not merely inferable from push).
  - Explicit designator on a live origin: loadSources with `localOnly: true` on
    an origin-backed fixture — a decision write succeeds and origin's tip is
    unchanged (AC1.2, AC2.1 — the named-mode extension of the existing
    push:false ceiling case).
  - PR-ensure short-circuit, the brief's leak shape: origin exists AND the run
    branch has a remote-tracking ref (simulate the prior push with
    `git update-ref refs/remotes/origin/<branch> <sha>`, as pr-ensure.test.ts
    does); `ensureDraftPr(dir, branch, slug, { localOnly: true, exec: spy })`
    returns skipped with a note and the spy saw zero gh invocations (AC2.2).
  - Sync short-circuit, remoteless: the loadSources-resolved local-only source
    through `planSyncForSource(source, factorySpy)` returns 'local-only' with
    the factory never invoked — the seam behind AC3.1's no-throw guarantee
    (AC2.3 evidence at core level).

  Then run the full suite: `npm test` in frontend/ — AC7.2 is this task's exit
  criterion as much as the new cases are.

file_contact_surface:
  - frontend/packages/core/test/divergence.test.ts

acceptance_tests:
  - AC7.1
  - AC7.2
  - AC1.1
  - AC2.1
  - "existing describes in divergence.test.ts unmodified (append-only diff)"

depends_on: [01-core-mode-resolution, 02-egress-guard-seams]

status: pending

