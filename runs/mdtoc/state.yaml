# Contract: maintained by Orchestrator (human in v0); read by everyone.
# Lives at runs/<slug>/state.yaml — the single source of truth for a run.

run: mdtoc
branch: run/mdtoc
phase: paused             # spec | plan | implement | integrate | release | done | paused
paused_reason: gate-declined  # set when phase=paused: budget-exhausted | round-cap | escalation | gate-declined

budget:
  cost_limit_usd: 50      # exhaustion pauses the run; it never silently degrades
  cost_spent_usd: 1.72    # derived: the sum of ledger[].cost_usd
  ledger:                 # append-only, one entry per model invocation:
                          #   {at, role, task, round, adapter, model,
                          #    tokens_in, tokens_out, cost_usd}
                          # v0: appended by hand after each dispatch (M0).
                          # This harness reports combined subagent tokens only
                          # (no in/out split): raw total in the entry comment;
                          # cost_usd estimated at the model's registry pricing
                          # assuming an ~85/15 in/out split.
    - {at: 2026-07-13T01:08:01Z, role: analyst, task: null, round: null,
       adapter: claude-code, model: anthropic/claude-sonnet-5,
       tokens_in: null, tokens_out: null, cost_usd: 0.15}  # 31,899 tok combined
    - {at: 2026-07-13T01:31:00Z, role: architect, task: null, round: null,
       adapter: claude-code, model: anthropic/claude-fable-5,
       tokens_in: null, tokens_out: null, cost_usd: 1.57}  # 65,517 tok combined

gates:                    # a gate entry is written ONLY by the named human
  G0: {approved: true, by: nthncrtr, at: 2026-07-13T01:18:34Z, notes: all 7 assumptions accepted, burden: confirmation}
  G1: {approved: false, by: nthncrtr, at: 2026-07-13T01:33:19Z, notes: ADR-4 should match live GitHub — preserve underscores}
  G2: {approved: false, by: null, at: null, notes: null}
  G3: {approved: false, by: null, at: null, notes: null}

tasks:                    # mirrors tasks/*.yaml status; the ONLY home of review_rounds
  - {id: 01-mdtoc-cli, status: pending, review_rounds: 0}
  - {id: 02-unit-tests, status: pending, review_rounds: 0}
  - {id: 03-cli-tests, status: pending, review_rounds: 0}

escalations: []           # append-only: {at, from_role, reason, resolved}
