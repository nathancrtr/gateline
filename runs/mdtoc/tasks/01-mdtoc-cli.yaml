# Contract: produced by Architect; consumed by exactly one Implementer.

id: 01-mdtoc-cli
title: Create mdtoc.py — core functions (extract_headings, slugify, render_toc) plus the CLI shell
requirements: [R1, R2, R3, R4, R5, R6, R7, R8, R10]

scope: |
  Create apps/mdtoc/mdtoc.py, the complete single-file tool. Implement exactly
  the module-level interface pinned in plan.md ("Interface contracts"):
  HEADING_RE (the compiled regex from ADR-2), extract_headings(), slugify(),
  render_toc(), main(), and the __main__ guard, with the documented signatures
  and semantics. Include a short module docstring stating the heading rule (R2)
  and the anchor rule (R4).

  Constraints (R10 + plan ADR-8): Python 3 stdlib only — expected imports are
  argparse, re, sys (typing imports allowed). Compatible with Python 3.9.6, the
  environment's only interpreter: no PEP 604 unions in any evaluated annotation
  (use Optional[...] from typing, exactly as the pinned main() signature does);
  PEP 585 subscriptions (list[str], tuple[int, str], re.Pattern[str]) are fine.
  The tool must never open anything for writing (R1/AC1.3) and must write to
  stdout only via sys.stdout.write(render_toc(...)) — never print() (plan CLI
  contract; AC6.1 byte-exactness).

  Behavior to honor (all defined in plan.md; the ADRs carry the details):
  - extract_headings: single pass over text.splitlines() with the ADR-3 fence
    state machine (open: lstripped line starts with a run of >=3 backticks or
    >=3 tildes, info string ignored; close: stripped line is a run of >= the
    opening length of the same char and nothing else; unclosed fence runs to
    EOF). Outside fences, HEADING_RE decides (AC2.1-AC2.3); heading text is the
    post-marker remainder .strip()ped; bare '#'..'######' yields text ''.
    No headings -> [] (R8). Heading text is literal source — do not transform
    inline markup (spec assumptions 3-4).
  - slugify: over text.lower(), keep exactly chars where ch.isalpha() or
    ch.isdigit() or ch in " -", then map each " " to "-" (ADR-4; AC4.1-AC4.4).
  - render_toc: per heading, indent '  ' * (level - 1) from the absolute level
    (AC6.2), line '<indent>- [<text>](#<anchor>)\n' (AC6.1); duplicate base
    slugs get -1, -2, ... suffixes via an occurrence-count dict, first
    occurrence unsuffixed (ADR-5; AC5.1). Empty input -> '' with zero
    characters (AC8.1/AC8.2).
  - main: argparse with prog="mdtoc.py", one required positional FILE, no
    flags; read via open(path, encoding="utf-8"); catch (OSError,
    UnicodeDecodeError) -> one line 'mdtoc.py: error: <reason>' on stderr,
    return 1 (ADR-6; AC7.1-AC7.3); success -> sys.stdout.write of the TOC,
    return 0. Argparse handles the missing-argument case itself (exit 2,
    AC1.2). No LBYL pre-checks.

file_contact_surface:
  - apps/mdtoc/mdtoc.py

acceptance_tests:
  # Function-level checks mirroring the spec ACs. Run from apps/mdtoc/.
  # Note: backtick fixtures are built with chr(96) so these commands are safe
  # to paste into a shell verbatim (bare backticks in double quotes would be
  # command substitution).
  - "python3 -c \"import mdtoc as m; assert m.extract_headings('# Title\\n## Section A\\n### Sub A1\\n') == [(1,'Title'),(2,'Section A'),(3,'Sub A1')]\"  # AC2.1"
  - "python3 -c \"import mdtoc as m; assert m.extract_headings('#1234\\n') == [] and m.extract_headings('####### Seven\\n') == []\"  # AC2.2, AC2.3"
  - "python3 -c \"import mdtoc as m; f = chr(96)*3; doc = f + '\\n# not a heading\\nregular text\\n' + f + '\\n## Real Heading\\n'; assert m.extract_headings(doc) == [(2,'Real Heading')]\"  # AC3.1"
  - "python3 -c \"import mdtoc as m; doc = '~~~\\n# not a heading\\nregular text\\n~~~\\n## Real Heading\\n'; assert m.extract_headings(doc) == [(2,'Real Heading')]\"  # AC3.2"
  - "python3 -c \"import mdtoc as m; assert m.slugify('Hello World') == 'hello-world'\"  # AC4.1"
  - "python3 -c \"import mdtoc as m; assert m.slugify(\\\"Don't Repeat Yourself\\\") == 'dont-repeat-yourself'\"  # AC4.2"
  - "python3 -c \"import mdtoc as m; assert m.slugify('1. What v1 changes — and what it must not') == '1-what-v1-changes--and-what-it-must-not'\"  # AC4.3"
  - "python3 -c \"import mdtoc as m; b = chr(96); assert m.slugify('Code ' + b + 'example' + b) == 'code-example'\"  # AC4.4"
  - "python3 -c \"import mdtoc as m; out = m.render_toc([(2,'Overview'),(2,'Overview'),(3,'Overview')]); assert '(#overview)' in out and '(#overview-1)' in out and '(#overview-2)' in out\"  # AC5.1"
  - "python3 -c \"import mdtoc as m; assert m.render_toc([(1,'Title'),(2,'Section A'),(3,'Sub A1'),(2,'Section B')]) == '- [Title](#title)\\n  - [Section A](#section-a)\\n    - [Sub A1](#sub-a1)\\n  - [Section B](#section-b)\\n'\"  # AC6.1"
  - "python3 -c \"import mdtoc as m; assert m.render_toc([(3,'Deep Start')]) == '    - [Deep Start](#deep-start)\\n'\"  # AC6.2"
  - "python3 -c \"import mdtoc as m; assert m.extract_headings('') == [] and m.render_toc([]) == ''\"  # AC8.1, AC8.2"
  # Process-level smoke checks:
  - "`python3 mdtoc.py <path to an existing .md file with headings>` exits 0 and prints the TOC to stdout (AC1.1); the input file's bytes are unchanged and no file is created (AC1.3)"
  - "`python3 mdtoc.py` with no argument exits 2 with argparse usage on stderr (AC1.2)"
  - "`python3 mdtoc.py does-not-exist.md` exits 1 with one 'mdtoc.py: error: ...' line on stderr and no Traceback (AC7.1)"
  - "Module imports cleanly; only stdlib imports (AC10.2 sense); no PEP 604 annotations anywhere (AC10.3, plan ADR-8); exactly this one non-test .py file under apps/mdtoc/ (AC10.1)"

depends_on: []

