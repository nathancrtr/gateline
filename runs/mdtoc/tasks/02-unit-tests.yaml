# Contract: produced by Architect; consumed by exactly one Implementer.

id: 02-unit-tests
title: Unit tests for the pure core (heading detection, fences, slugs, dedup, nesting, empty)
requirements: [R2, R3, R4, R5, R6, R8, R9]

scope: |
  Create apps/mdtoc/test_core.py: pytest unit tests that `import mdtoc` (task
  01 is merged) and exercise the pure functions directly — no subprocess, no
  file I/O (build inputs as inline Python strings; use chr(96) or escaped
  quoting for backtick fixtures). Per plan.md "Test-layout contract": run
  pytest from apps/mdtoc/; do not add __init__.py; do not modify mdtoc.py. Do
  not duplicate task 03's process-level tests (exit codes, stderr, real
  files).

  Test-name contract (plan.md, for AC9.2): individually named tests whose
  names include these substrings — 'heading' (R2), 'fence' (R3), 'slug' (R4),
  'duplicate' (R5), 'empty' (R8).

  Required coverage (one or more tests per bullet):
  - AC2.1 — extract_headings on '# Title' / '## Section A' / '### Sub A1'
    yields levels 1,2,3 with the right texts, in document order.
  - AC2.2 — '#1234' is not a heading.
  - AC2.3 — '####### Seven' (7 hashes) is not a heading.
  - AC3.1 — backtick-fenced '# not a heading' is excluded; a following
    '## Real Heading' is the only heading found.
  - AC3.2 — identical fixture with ~~~ fences gives the identical result.
  - AC4.1 — slugify('Hello World') == 'hello-world'.
  - AC4.2 — slugify("Don't Repeat Yourself") == 'dont-repeat-yourself'.
  - AC4.3 — slugify('1. What v1 changes — and what it must not') ==
    '1-what-v1-changes--and-what-it-must-not' (em dash removed, double space
    collapses to double hyphen).
  - AC4.4 — slugify of 'Code `example`' (backticks in the text) ==
    'code-example'.
  - AC5.1 — render_toc over three 'Overview' headings links them to
    #overview, #overview-1, #overview-2 in document order.
  - AC6.1 — render_toc([(1,'Title'),(2,'Section A'),(3,'Sub A1'),
    (2,'Section B')]) equals the exact four-line string from the spec,
    trailing newline included.
  - AC6.2 — render_toc([(3,'Deep Start')]) is indented exactly 4 spaces
    (absolute level, not renumbered).
  - AC8.1/AC8.2 — extract_headings('') == [] and on headingless body text
    == []; render_toc([]) == '' (zero characters, no newline).

  Constraints: stdlib + pytest only; 3.9-safe per plan ADR-8 (no PEP 604
  annotations).

file_contact_surface:
  - apps/mdtoc/test_core.py

acceptance_tests:
  - "`pytest test_core.py` run from apps/mdtoc/ exits 0 (feeds AC9.1)"
  - "`pytest --collect-only` lists distinct tests whose names include the substrings heading, fence, slug, duplicate, empty (AC9.2)"
  - "Every AC bullet in scope (AC2.1-2.3, AC3.1-3.2, AC4.1-4.4, AC5.1, AC6.1-6.2, AC8.1-8.2) has a passing test"

depends_on: [01-mdtoc-cli]

status: pending

