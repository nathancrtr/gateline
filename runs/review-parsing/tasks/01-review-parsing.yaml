id: 01-review-parsing
title: Browser-safe typed parser for review reports (findings, verdicts, rounds)
requirements: []          # patch profile — no spec.md; the intent brief is the baseline

scope: |
  Add a browser-safe, zero-import parser for review-report artifacts under
  `frontend/packages/core/src/view-model/`, following the `lexicon.ts` leaf-module
  pattern exactly: a pure function from artifact text to a typed value, no Node
  imports, no filesystem, no network. Export it from the view-model barrel and the
  package root, and expose it from the server beside the existing lexicon route.

  Per round, extract:
    - the `**Verdict:** approve | request-changes | escalate` line;
    - the `**Round:** <n> of <m>` line;
    - the `**Diff reviewed:** <ref>` line;
    - each `### F<n> — <severity> — <title>` finding with its `Where`,
      `Failure scenario`, and `Requirement` fields;
    - later-round resolution lines, so a finding carries a resolved-in-round-N state.

  READ THIS BEFORE DESIGNING THE PARSER. The committed artifacts under `runs/`
  are the ground truth, and they vary far more than `contracts/review-report.md`
  suggests. A parser written to the contract alone will be wrong on real data.
  Survey them first (`runs/*/review-*.md`, 29 files) and design for what is
  actually there:

  1. ROUND HEADERS ARE NOT UNIFORM. Round 1 is implicit — it has no header at
     all. Later rounds appear as `# Round 2`, `# Round 2 (of 3)`, `## Round 2`,
     `## Round 2 — 2026-07-21`, and `## Round 2 (verify)`. Both `#` and `##`
     levels occur, with optional trailing dates and parentheticals. Anchor on the
     `Round <n>` token, not on a fixed heading level or exact string.

  2. SECTION NAMES DRIFT BETWEEN ROUNDS. Round 1 uses `## Findings`, `## Coverage`,
     `## Boundary check`. Later rounds use `## Finding resolutions`,
     `## Delta coverage`, `## Boundary check (round 2)`. Do not hard-code the
     round-1 names.

  3. THE RESOLUTION VOCABULARY IS FREE-FORM AND CONTAINS A NEGATION TRAP. Real
     lines include: `resolved.`, `genuinely resolved.`, `resolved, mutant-verified.`,
     `resolved in code, unverified by test.`, `resolved by documentation`,
     `resolved-by-disposition`, `stands as written`, `unresolved.`, `open,`,
     `intentionally deferred`, `n/a, correctly left alone.`, and — critically —
     `**F1 — NOT genuinely resolved.**`.

     A substring test for "resolved" classifies that last one as RESOLVED. That
     would fold a still-standing finding out of the approver's default view, which
     is the exact failure this whole reading-experience effort exists to prevent.

     Required behavior: classify a finding as resolved ONLY on a confident,
     negation-aware match. Anything you cannot classify with confidence is
     `unclassified`, NOT resolved — it carries its verbatim resolution text and
     renders unfolded. Biasing toward "still open" is correct; a false "resolved"
     is a correctness bug, a false "open" is only mild noise. Add a test asserting
     the `NOT genuinely resolved` line does not classify as resolved.

  Severity is `blocking | major | minor`, and findings must be orderable
  blocking-first. Note that severity fields in the wild carry qualifiers such as
  `minor (PLAUSIBLE)` — extract the severity token without losing the qualifier
  text from the finding's verbatim title.

  Malformed or unrecognized input degrades to "no typed view" (return null / an
  empty result) so the caller falls back to today's prose rendering. The parser
  must never throw and never drop artifact text on the floor.

file_contact_surface:
  - frontend/packages/core/src/view-model/review-report.ts
  - frontend/packages/core/src/view-model/index.ts
  - frontend/packages/core/test/review-report.test.ts
  - frontend/packages/server/src/app.ts

acceptance_tests:
  - "Parsing runs/dupefind/review-01.md yields 4 findings across 2 rounds: F1 resolved in round 2; F2, F3, F4 still standing."
  - "For that file, verdicts parse in order as request-changes (round 1) then approve (round 2)."
  - "F1's severity parses as blocking and sorts ahead of the three minor findings."
  - "A line of the form '- **F1 — NOT genuinely resolved.**' does NOT classify the finding as resolved."
  - "Every one of the 29 runs/*/review-*.md artifacts parses without throwing; none produces a finding whose verbatim text is absent from the source file."
  - "The parser module imports nothing (no node: builtins, no fs, no network) — packages/core/test/layering.test.ts still passes."
  - "The server exposes the parsed payload on a route alongside /api/runs/:src/:slug/lexicon."
  - "npm test and npm run typecheck pass in frontend/."

depends_on: []

status: pending

notes: |
  Implementer round 1. Surveyed all runs/*/review-*.md before designing (47
  files exist today, not 29 — the run count has grown since the task was
  written; acceptance test's "every one of the 29" is honored as "every one
  of the corpus, at least the surveyed 29" in the vitest test, so it stays
  correct as the corpus keeps growing).

  Design: round segments are anchored on each round's own `**Round:**`
  bold field (uniform across 46/47 files), with a `Round <n>` heading-token
  fallback merged in within a small window — this satisfies "anchor on the
  token, not a fixed heading level" while staying robust. One artifact
  (runs/creation-seam/review-06.md) has no round-1 `**Round:**` field at
  all and reuses the literal heading "## Round 2" for what is actually its
  third chronological block; the parser degrades gracefully there (two
  segments both labeled round 2, no finding lost, no throw) rather than
  guessing a "corrected" number — verbatim-derivation-only per the intent
  brief.

  Findings-vs-resolutions grammar: a fresh finding heading always has the
  severity word directly after the first em dash
  (`### F<n> — blocking — ...`); a later round's resolution restated as a
  heading always has a parenthetical directly against the id instead
  (`### F<n> (blocking) — RESOLVED`) — that's the disambiguator. Severity
  qualifiers can carry their own internal em dash inside parens (survey
  example: `blocking (repo integrity / process — NOT a defect …)`), so the
  severity/title split is dash-depth-aware (splitTopLevelDash), not a plain
  regex split on the first em dash.

  Resolution classification is negation-aware and biased toward "still
  open" per the brief: only an unnegated whole-word "resolved" match
  counts (`\bresolved\b` naturally excludes "unresolved" — no boundary
  before the embedded "resolved"). "NOT genuinely resolved" and "NOT
  RESOLVED" are both confirmed false by test, including against the real
  runner-agent/review-04.md artifact the survey found it in (not just a
  synthetic fixture).

  file_contact_surface note: `packages/core/src/index.ts` already does
  `export * from './view-model/index.ts'`, so exporting from the view-model
  barrel was sufficient for the "export from the package root" requirement
  — no edit needed there, so it was left untouched.

  `npm install` regenerated frontend/package-lock.json (npm-version lockfile
  churn, unrelated to this change); reverted before finishing so the diff
  stays inside the declared surface.

  Verification: `npm test` — 583 passed, 2 skipped (pre-existing,
  live-smoke), 0 failed. `npm run typecheck` — clean. Ran the 47-artifact
  sweep directly (ad hoc script, not committed) before writing the vitest
  version: 0 throws, 0 nulls, 0 verbatim mismatches.
