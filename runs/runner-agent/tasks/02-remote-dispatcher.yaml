id: 02-remote-dispatcher
title: RemoteDispatcher implementation with callback map
requirements: [R1, R5, R7]

scope: |
  Create `RemoteDispatcher` in a new file `frontend/packages/orchestrator/src/runner-dispatcher.ts`.
  It implements `Dispatcher`. Its `dispatch()` method:
  1. Validates that `req.slug` and `req.branch` are set (throws if not)
  2. Creates a Promise and stores `{resolve, reject}` in an internal `Map<string, {resolve, reject}>` keyed by `slug|role|task|round`
  3. Returns the Promise — it resolves when the server calls `resolveOutcome(key, outcome)` or rejects on timeout

  Also exports a `RunnerCallback` interface (see plan Interface contracts) and a `pendingIntents()`
  method that, given the engine's set of open ledger entries, returns `PendingIntent[]` for the
  workstation to poll. The dispatcher does NOT read the ledger itself — the server provides the list.

  Include unit tests (AC1.2) with a stubbed remote agent (no real network): test success,
  failure, and timeout paths. The existing `seam.test.ts` must continue to pass unmodified.

file_contact_surface:
  - frontend/packages/orchestrator/src/runner-dispatcher.ts
  - frontend/packages/orchestrator/test/runner-dispatcher.test.ts
  # Widened per ADR-7 (escalation #3, 2026-07-23) — the same files task 01 owned:
  - frontend/packages/orchestrator/src/seam.ts
  - frontend/packages/orchestrator/src/engine.ts
  - frontend/packages/orchestrator/test/seam.test.ts

acceptance_tests:
  - AC1.1
  - AC1.2
  - "npm test in frontend/ includes passing unit tests for the new dispatcher's dispatch() success, failure, and timeout paths"
  - "Existing seam.test.ts passes unmodified (HeadlessDispatcher unchanged)"

depends_on: [01-seam-extend]

status: pending

notes: |
  Round 1 (implementer): implemented `RemoteDispatcher` in
  `frontend/packages/orchestrator/src/runner-dispatcher.ts`, plus its unit tests in
  `frontend/packages/orchestrator/test/runner-dispatcher.test.ts`. Neither `seam.ts`
  nor `engine.ts` was touched (both out of this task's file-contact surface).

  What it does:
  - `dispatch(req)` throws synchronously when `req.slug` or `req.branch` is unset,
    otherwise returns a `Promise<DispatchOutcome>` that only ever settles via
    `resolveOutcome(key, outcome)` (resolve — used for both the ok:true and ok:false
    "failure" paths, since a reported failure is still a normal outcome) or via an
    internal `setTimeout(req.timeoutMs)` that **rejects** (per this task's scope: "…
    or rejects on timeout"). `dispatch()` never reads `req.cwd` (AC2.1's no-shared-
    filesystem assumption holds by construction, not just by omission — the test
    "never reads req.cwd…" asserts it doesn't leak into a PendingIntent either).
  - `RunnerCallback` (exported) = `{ pendingIntents(openEntries), resolveOutcome(key,
    outcome) }`. `RemoteDispatcher` implements both `Dispatcher` and `RunnerCallback`
    on one object, since the pending-promise map is their shared state.
  - `pendingIntents(openEntries: OpenLedgerEntry[])` is pure/idempotent: it takes the
    caller-supplied open ledger entries (the dispatcher never reads the ledger
    itself, as scoped) and returns the `PendingIntent[]` this dispatcher is actually
    holding a promise for. Repeated polls before `resolveOutcome` return the same
    intents with the same `key`.

  Deviation (documented, not silent) — the internal map's key:
  The scope says the pending map is "keyed by slug|role|task|round". `DispatchRequest`
  (seam.ts), however, only carries `slug` and `branch` — task 01 threaded exactly the
  two fields R2 named, and extending `DispatchRequest` further would touch seam.ts/
  engine.ts, outside this task's file-contact surface. So at the moment `dispatch()`
  is called there is no `task`/`round` to key on (and `branch` is always the *run*
  branch per engine.ts's `launch()`, even for isolated implementer task dispatches,
  so it adds no disambiguating power either). Implemented instead: a pending call is
  provisionally grouped by `slug|role` (a FIFO queue per group), and is only assigned
  its full `slug|role|task|round` key — the one `resolveOutcome` is called with,
  mirroring engine.ts's private `jobKey` format — once `pendingIntents` links it to a
  specific open ledger entry, taking the oldest not-yet-linked call in that group.
  This is exact for the common case (at most one open dispatch per role per run) and,
  for parallel same-role dispatches (parallel implementers on distinct tasks), is
  correct as long as intents are drained in the order they were dispatched (tested:
  "correlates parallel same-role dispatches … in issue order"). Flagging for the
  reviewer / a possible future task: extending `DispatchRequest` with optional
  `task`/`round` (the same shape of change task 01 made for `slug`/`branch`) would
  let `dispatch()` key directly and retire this FIFO-linking layer; I did not do
  that here since it's outside this task's declared surface and no acceptance test
  for this task depends on it.

  `PendingIntent` deliberately omits a base-OID/commit field (the plan's transport
  section mentions one) — resolving that pin is a git-repo concern this dispatcher
  has no access to (it never touches `req.cwd` or the filesystem); left to whichever
  of tasks 03/04/05 assembles the intent for the wire.

  `adapter` is a constructor parameter (default `'runner'`), since `RemoteDispatcher`
  is not manifest-bound the way `HeadlessDispatcher` is (R8: it executes whatever
  adapter the workstation's manifest declares) — wiring (task 05) can pass whatever
  string the ledger should record.

  Verified:
  - `npx vitest run packages/orchestrator/test/runner-dispatcher.test.ts
    packages/orchestrator/test/seam.test.ts` — 26/26 pass (14 new + 12 existing,
    seam.test.ts unmodified).
  - `npx vitest run packages/orchestrator` (full package) — 148 passed, 1 skipped
    (the opt-in `live-smoke.test.ts`), 0 failed.
  - `npm run typecheck` — clean.

  Round 3 (implementer, responding to review-02.md F1-F4 under ADR-7's widened
  surface — seam.ts, engine.ts, test/seam.test.ts now in-scope):

  - F1 (blocking) — fixed. `DispatchRequest` (seam.ts) gained optional `task?:
    string | null` and `round?: number | null`, doc-commented the same way as
    `slug`/`branch`. `engine.ts`'s `launch()` threads `intent.task`/`intent.round`
    into the `dispatch()` call, exactly alongside `slug`/`branch` — no other
    change to `launch()`. `RemoteDispatcher` now keys its pending map directly
    by `slug|role|task|round` computed from the request *at dispatch time*
    (`fullKey(req.slug, req.role, req.task ?? null, req.round ?? null)`), and
    `pendingIntents` looks each ledger entry's key straight up in that one map.
    The FIFO `slug|role` grouping/linking layer (`queues`, `linked`, `groupKey`,
    `PendingCall.linkedKey`, `retire()`) is gone; `calls` is now the only index.
    Correctness no longer depends on dispatch-call order vs. ledger-projection
    order — there is no order-dependent step left to depend on it.
  - F2 — fixed. `Dispatcher` (seam.ts) gained `readonly managesOwnWorkspace?:
    boolean`, doc-commented per the plan's Interface contracts section.
    `RemoteDispatcher` declares `readonly managesOwnWorkspace = true`. This task
    only declares the marker (a peer to `adapter`); the engine's actual branch
    on it (skip local checkout, fold a harvest branch) is unimplemented seam-side
    plumbing for a later task (ADR-3/ADR-4territory) — out of this task's scope,
    which is `RemoteDispatcher` plus the two named seam threads.
  - F3 — fixed (as scoped: carry the field, not populate it). `PendingIntent`
    gained `baseOid?: string`, doc-commented that `RemoteDispatcher` never reads
    the repo and so leaves it undefined; the server (task 03, which now records
    the augmentation obligation per ADR-7) is expected to fill it in before the
    intent reaches the wire. Test added asserting `RemoteDispatcher` itself never
    sets it.
  - F4 — fixed. New `formatDuration()` helper renders sub-second timeouts as
    `<ms>ms`, sub-minute as `<n.n>s`, and only falls back to `<n>min` at or above
    60_000ms — so a 20ms test timeout reports "timed out after 20ms", not
    "0min". Scoped to `runner-dispatcher.ts`'s own timeout message only; the
    same pattern in `seam.ts`'s `HeadlessDispatcher` (`Math.round(timeoutMs /
    60000)`) is untouched — no finding named it and touching it isn't needed for
    F1/F2/F3.

  Tests: `runner-dispatcher.test.ts` rewrote the parallel-same-role case to
  dispatch with distinct `task` values and pin correlation under out-of-order
  dispatch *and* out-of-order polling (the exact reordering scenario review-02.md
  F1's failure scenario named) — the case the old FIFO layer could not be
  pinned against because no in-surface fix existed for it then. Added: a
  distinct-round correlation test (same task, two rounds), a
  `managesOwnWorkspace` test, a `PendingIntent.baseOid` test, and a precise
  sub-minute timeout-message test. `seam.test.ts` gained one new test
  (`launch() also threads the dispatch intent's task and round`) driving a toy
  run through analyst → architect → first implementer dispatch and asserting
  `task`/`round` land correctly (null for non-task-scoped roles, `'01-core'`/`1`
  for the implementer) — ticked step-by-step rather than via the fixed-point
  `reconcile()` helper, since this toy script never scripts a reviewer and a
  full-rest loop would spin re-dispatching it. All prior seam.test.ts tests
  pass unmodified in substance (only the import list grew).

  Verified:
  - `npx vitest run packages/orchestrator/test/runner-dispatcher.test.ts
    packages/orchestrator/test/seam.test.ts` — 32/32 pass (19 + 13, including
    the new coverage above).
  - `npx vitest run packages/orchestrator` (full package) — in progress at
    write time; `npm run typecheck` — clean.

  Stayed inside the ADR-7-widened file_contact_surface: `seam.ts`, `engine.ts`,
  `runner-dispatcher.ts`, `test/seam.test.ts`, `test/runner-dispatcher.test.ts`,
  plus this notes append. No other file touched.