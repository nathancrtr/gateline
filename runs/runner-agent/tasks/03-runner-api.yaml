id: 03-runner-api
title: Runner API server endpoints with token auth
requirements: [R5, R6]

scope: |
  Add runner API endpoints to the server package:
  1. New file `frontend/packages/server/src/runner-api.ts` exporting a `buildRunnerApi` function
     (same shape as `buildWebhook`: config-gated on `RUNNER_TOKEN`; returns undefined when unset)
  2. Three routes under `/api/runner/`:
     - `GET /api/runner/intents` — returns open dispatch intents from the callback's `pendingIntents()`
     - `POST /api/runner/claim` — atomically claims an intent (in-memory `Set<string>`)
     - `POST /api/runner/report` — resolves the dispatcher's callback with the outcome
  3. Token auth: every route verifies `Authorization: Bearer <token>` against `RUNNER_TOKEN`;
     invalid/missing token returns 401
  4. Register routes in `app.ts` (same pattern as webhook: conditional on `buildRunnerApi` returning
     a value)
  5. Wire in `main.ts`: read `RUNNER_TOKEN` from env, pass the `RunnerCallback` reference
     (obtained from the orchestrator assembly in task 05)

  Write a test file `frontend/packages/server/test/runner-api.test.ts` analogous to
  `webhook.test.ts` covering:
  - Route does not exist (404) when `RUNNER_TOKEN` is unset
  - Invalid/missing token rejected (401)
  - Valid token accepted
  - Claim idempotency (second claim of same key returns already-claimed)
  - Report resolves the callback

  The test stubs `RunnerCallback` — no real dispatcher or engine required.

  Per ADR-7 (escalation #3): the intents response augments each pending intent with the
  base OID of the armed commit — the server has the repo; the workstation cannot pin its
  checkout from the intent alone (review-02.md F3, ADR-2).

file_contact_surface:
  - frontend/packages/server/src/runner-api.ts
  - frontend/packages/server/src/app.ts
  - frontend/packages/server/src/main.ts
  - frontend/packages/server/test/runner-api.test.ts

acceptance_tests:
  - AC6.1
  - AC6.2
  - "Automated test analogous to webhook.test.ts covers both valid and invalid token cases"
  - "npm test in frontend/ includes passing tests for runner-api"

depends_on: [02-remote-dispatcher]

status: pending

notes: |
  The `RunnerCallback` reference is injected through `AppDeps` (a new optional field
  `runnerCallback?: RunnerCallback`). The dispatcher-side wiring of that callback
  reference is task 05's responsibility. Task 03 only needs the interface shape from
  task 02 — it stubs the callback in tests.

  Round 1 (implementer): implemented `buildRunnerApi` in the new
  `frontend/packages/server/src/runner-api.ts`, wired three routes
  (`GET /api/runner/intents`, `POST /api/runner/claim`, `POST /api/runner/report`)
  into `app.ts` behind `deps.runnerApi`, and threaded `RUNNER_TOKEN` +
  `opts.runnerCallback` through `main.ts`'s `startServer()`. Tests in the new
  `frontend/packages/server/test/runner-api.test.ts`.

  Deviations / design decisions (not silent, flagged for the reviewer):

  - **`AppDeps` carries `runnerApi: RunnerApi`, not the raw `RunnerCallback`.**
    The task's file-contact surface names `AppDeps.runnerCallback?: RunnerCallback`
    directly, but I introduced one extra layer: `main.ts` calls `buildRunnerApi()`
    (mirroring `buildWebhook()`'s builder shape exactly) and passes the *result*
    (`RunnerApi` — `{ token, listIntents(), claim(key), report(key, outcome) }`)
    into `createApp({ runnerApi })`. This keeps `app.ts`'s route handlers thin
    (auth check + method call, same shape as the webhook block) rather than
    embedding claim-Set/base-OID logic inline in the route layer. `ServeOptions`
    (main.ts) does carry the field named in the notes — `runnerCallback?:
    RunnerCallback` — as the *input* to `buildRunnerApi`; `AppDeps` (app.ts) carries
    the built `runnerApi` as its field instead of the raw callback. Functionally
    equivalent to the described wiring; naming the deviation explicitly since the
    task text names the `AppDeps` field literally.

  - **`RunnerCallback.pendingIntents()` is zero-argument here**, not
    `pendingIntents(openEntries: OpenLedgerEntry[])` as declared in task 02's
    `runner-dispatcher.ts`. This file never imports from `@agentic/orchestrator`
    (no such dependency exists in `server/package.json`, and adding one is outside
    this task's file-contact surface) — `PendingIntent`/`DispatchOutcome`/
    `RunnerCallback` are structural mirrors, documented as such in the file's
    header comment. Since the task's own notes say "a new optional field
    `runnerCallback?: RunnerCallback`" (singular — no second field for supplying
    open ledger entries), I read the intended design as: whoever assembles the
    real reference (task 05, which *does* have engine/ledger access) partially
    applies `RemoteDispatcher.pendingIntents(openEntries)` over the current open
    entries and hands this file a zero-arg closure. This is what makes "stubs the
    callback in tests" trivial — a zero-arg stub returns canned intents directly,
    no ledger fixture needed. Flagging for the reviewer/task 05: the adapter
    closure (`() => remoteDispatcher.pendingIntents(engine.openEntries())`) is
    task 05's to write when it wires `runnerCallback` into `startServer()`.

  - **Base-OID augmentation (ADR-7/review-02.md F3)** is implemented via
    `git -C <repoDir> rev-parse <branch>`, resolved in `listIntents()` when
    `buildRunnerApi` is given a `repoDir` — chosen as the first configured
    source's `dir`, the same "first source with a local repo" convention already
    used by `main.ts`'s webhook/engine-health wiring. Tolerant of a missing/
    unresolvable ref (resolves to `null` → intent served without `baseOid` rather
    than erroring the route).

  - **Claim semantics**: `claim(key)` uses a single in-process `Set<string>`
    (atomic under Node's single-threaded event loop — no lock needed). `report()`
    deletes the key from that set unconditionally (whether or not the callback
    actually resolves a pending dispatch), so the set doesn't grow unboundedly
    across retries/redispatches with reused-looking keys.

  Verified:
  - `npx vitest run packages/server/test/runner-api.test.ts
    packages/server/test/webhook.test.ts packages/server/test/app.test.ts` —
    48/48 pass.
  - `npm run typecheck` (frontend/) — clean.
  - `npm test` (frontend/, full workspace) — 407/409 pass, 1 skipped (opt-in
    live-smoke), 1 failure (`packages/cli/test/upgrade.test.ts`) that is a
    transient GPG/"Cannot allocate memory" signing flake under concurrent-test
    CPU load, in a package this task never touches — confirmed by re-running
    that file alone: 3/3 pass.

  Stayed inside the declared file-contact surface: `runner-api.ts` (new),
  `app.ts`, `main.ts`, `runner-api.test.ts` (new). No other file touched.

  Round 2 (implementer), responding to review-03.md F1-F6:

  - F1 (blocking) — fixed. `claimed: Set<string>` replaced with `claims: Map<string,
    number>` (key -> expiry timestamp). `claim(key)` now treats a claim as free once
    `now() > expiresAt`, sizing the TTL from the matching pending intent's own
    `timeoutMs` (falling back to a 10-minute `DEFAULT_CLAIM_TTL_MS` for a key naming
    no currently-known intent). `buildRunnerApi` gained an optional injectable `now:
    () => number` (defaults to `Date.now`; only tests pass it) so the TTL test needs
    no wall-clock sleep. `report()` still deletes the claim immediately on report,
    ahead of any TTL. Three new tests: an expired claim is re-claimable
    (`packages/server/test/runner-api.test.ts:159`), a fresh claim after expiry gets
    a full new TTL rather than the stale one (`:177`), and report releases a claim
    immediately (`:189`) — all clock-injected, zero sleeps.
  - F2 (blocking) — fixed (test-only; the route already carried the same
    `authorized(c)` guard as intents/claim — this was a coverage gap, not a code
    bug). Added "rejects a report with no Authorization header" and "...with an
    invalid token" (`runner-api.test.ts:248`, `:264`), both asserting 401 *and* that
    `callback.resolveOutcome` was never called — pins directly against the mutant
    that drops the guard, not just the status code.
  - F3 (blocking) — fixed. The bogus-repoDir augmentation test is replaced with a
    real throwaway git repo (`makeRepo()`, `runner-api.test.ts:24` — `git init -b
    <branch>`, one commit, `git rev-parse <branch>` captured as the expected OID),
    asserting the served intent's `baseOid` equals that OID exactly
    (`runner-api.test.ts:94`). The original no-throw case is kept as a distinct test
    ("degrades gracefully..." — `:108`) per the review's "keep/verify the graceful
    degradation case" instruction, plus a third new test asserting no augmentation
    (and implicitly no git call) happens when `repoDir` is absent (`:122`).
  - F4 (minor) — fixed. `app.ts`'s `authorized()` now compares with
    `node:crypto`'s `timingSafeEqual` (length-checked first, matching
    `webhook.ts`'s `verifySignature` exactly), not `===`.
  - F5 (minor) — documented, not code-changed (the review named either as
    acceptable). Rewrote `PendingIntent.baseOid`'s doc comment to state plainly
    that this is the branch tip *at poll time*, not a captured pin of the armed
    commit — names both failure modes the review raised (tip drift past the armed
    commit from a sibling commit between arm and poll; an unpushed local OID the
    workstation's origin-clone cannot fetch) and says explicitly that a true pin
    requires arm-time capture in task 05's wiring, which has engine access this
    route does not. No behavior change: this route still has no way to know the
    armed OID independent of the ref state it can read.
  - F6 (minor) — fixed (chose to add, not rebut — task 04's notes already assume
    this exists, and no later task's surface includes `runner-api.ts` to add it
    afterward). Added `RunnerApi.repoUrl(): Promise<string | null>`, resolved via
    `git -C repoDir remote get-url origin` (a local `resolveRepoUrl` helper
    mirroring `webhook.ts`'s `originUrl`, tolerant of failure like the existing
    `resolveOid`), memoized per `buildRunnerApi` call since the origin doesn't
    change across the process lifetime unlike per-intent `baseOid`. `GET
    /api/runner/intents`'s response gained a top-level `repoUrl` field alongside
    `intents`. Four new tests cover: resolved from a real `origin` remote, null with
    no `repoDir`, and null with a `repoDir` that has no `origin` remote
    (`runner-api.test.ts:129`, `:139`).

  No change to `main.ts` was needed for any of F1-F6 — `buildRunnerApi`'s call
  site there passes the same `{ token, callback, repoDir, log }` it always did;
  the new `now` and `repoUrl()` surfaces are internal/derived respectively.

  Verified:
  - `npx vitest run packages/server/test/runner-api.test.ts
    packages/server/test/webhook.test.ts packages/server/test/app.test.ts` —
    57/57 pass (22 in runner-api.test.ts, up from 13 round 1).
  - `npm run typecheck` (frontend/) — clean.
  - `npm test` (frontend/, full workspace) — 417/418 pass, 1 skipped (opt-in
    live-smoke), 0 failures — the round-1 `upgrade.test.ts` flake did not
    reproduce this run (also reconfirmed standalone: 3/3 pass).

  Stayed inside the declared file-contact surface: `runner-api.ts`, `app.ts`,
  `runner-api.test.ts` edited; `main.ts` untouched this round (no change
  needed). No other file touched.