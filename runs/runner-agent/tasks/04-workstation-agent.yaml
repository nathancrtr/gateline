  - F8: confirmed `getHead(ws)` (workspace.ts:39-41) is called in
    `executeIntent` (agent.ts:304) immediately after `createWorkspace` and
    before `loadManifest`/`run` — i.e. before the harness executes.
    `harvestAndPush` (workspace.ts:89-144) takes that `base` as a required
