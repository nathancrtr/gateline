id: 03-generic-read-path
title: Thread the resolved state contract through LocalGitSource and the view-model
requirements: [R3, R4, R5]

scope: |
  Wire task 02's parse boundary into the read path, per plan "Interface
  contracts" and ADR-4:

  1. sources/local-source.ts: memoize `resolveStateContract(this.templates)`
     once per source (same stance as frameworkRoots) and pass the resolved
     contract to parseRunState in both readState and stateHistory. No
     RunSource interface change (the optional `generic` field rides the
     existing StateParseResult).

  2. view-model/readiness.ts: in deriveReadiness, when state is null but the
     read's `generic` is non-null, return `{ items: [], validations }` — a
     well-formed generic run is not malformed and produces no decision cards
     (spec out-of-scope: no decision UI for non-SDLC gates). Every other path
     byte-identical.

  3. view-model/portfolio.ts: widen RunSummary.gates to
     `GateLedgerMap = Record<GateId, GateLedgerCell> & Record<string, GateLedgerCell | undefined>`
     (GateId access stays statically defined so cli/web typecheck unchanged —
     plan ADR-3/ADR-4). SDLC branch: populate exactly G0..G3 as today (AC5.1,
     AC5.2). New generic branch (state null, generic non-null): phase =
     generic.phase ?? '—'; pausedReason = generic.paused_reason; malformed =
     null; profile = 'full' (typed filler, comment it per ADR-6 consequence);
     gates = one cell per generic.gateOrder entry under its declared name and
     NOTHING ELSE (no synthesized G0–G3 — AC4.2); tasks zeros; escalationsOpen
     from generic.escalations; budget nulls. emptyLedger()/malformed path
     unchanged.

  4. New test file frontend/packages/core/test/generic-host.test.ts building a
     temp fixture repo (git init; commit contracts/state.yaml = the plan's
     core-instance fixture with gates {intake, publish}; a run directory
     runs/demo/ with a state.yaml using phase: intake, those two gates, an
     empty escalations list, no branch key — committed on the default branch
     or a run branch, either is fine as long as listRuns discovers it).
     Assert:
     - readState: error null, state null, generic non-null (AC4.1);
     - summarizeRun: phase 'intake', malformed null,
       Object.keys(summary.gates) deep-equals ['intake', 'publish'] (AC4.2);
     - deriveReadiness: zero items;
     - validateArtifact('state.yaml', ...) with the fixture source's templates:
       ok true (AC4.3);
     - regression guard: for this repository itself, summarizeRun(wordfreq)
       still reports phase 'done' and gate keys exactly G0..G3 (AC5.2's
       fixture-equivalent; real-repo.test.ts stays the authoritative check and
       must pass unedited).

  Run the full `npm test` and `npm run typecheck` in frontend/ — all packages
  (cli, web, server, orchestrator) must pass with zero edits outside
  frontend/packages/core (AC5.1, AC6.1). Do not edit existing test files.

file_contact_surface:
  - frontend/packages/core/src/sources/local-source.ts
  - frontend/packages/core/src/view-model/readiness.ts
  - frontend/packages/core/src/view-model/portfolio.ts
  - frontend/packages/core/test/generic-host.test.ts

acceptance_tests:
  - AC4.1
  - AC4.2
  - AC5.1
  - AC5.2
  - AC3.1
  - "npm test and npm run typecheck in frontend/ pass across all workspace packages with no diff outside frontend/packages/core"

depends_on: [02-state-contract-resolution]

status: in-review

notes: |
  Round 1 (implementer): built as scoped.
  - local-source.ts: `stateContract` memoizes `resolveStateContract(this.templates)`
    once per source (same closure-cache stance as `frameworkRoots`), threaded
    into `parseRunState` in both `readState` and `stateHistory`. Gave `readState`
    an explicit `Promise<StateParseResult & { raw: string | null }>` return
    annotation (previously inferred) so its two branches unify to one type —
    needed for the new test file, which holds a `LocalGitSource` directly
    rather than the `RunSource` interface (view-model call sites were already
    fine since they type through the interface).
  - readiness.ts: `deriveReadiness` now destructures `generic` off the read
    and returns `{ items: [], validations }` before building the malformed
    item, when `state` is null but `generic` is non-null. Every other path
    byte-identical (confirmed by readiness.test.ts passing unedited).
  - portfolio.ts: added `GateLedgerMap = Record<GateId, GateLedgerCell> &
    Record<string, GateLedgerCell | undefined>`, widened `RunSummary.gates`
    to it. `summarizeRun` gained a `!state && generic` branch ahead of the
    existing `!state` (malformed) branch: phase `generic.phase ?? '—'`,
    pausedReason from `generic.paused_reason`, malformed null, profile `'full'`
    (commented as ADR-6 typed filler), gates built from `generic.gateOrder`
    only (a declared gate absent from the file gets an explicit undecided
    cell via a small `UNDECIDED_CELL` helper — `undecidedGate()` in schema.ts
    is private, so this is a local equivalent), tasks zeros, escalationsOpen
    from unresolved `generic.escalations`, budget nulls. Cast to `GateLedgerMap`
    at that one construction site (plan's "typed filler" allowance) since a
    plain `Record<string, GateLedgerCell>` doesn't structurally satisfy the
    `Record<GateId, GateLedgerCell>` half without one. `emptyLedger()` and the
    plain-malformed branch are untouched.
  - New test/generic-host.test.ts: builds a throwaway git repo (raw
    `execFileSync('git', …)`, same idiom as code-tree.test.ts, not
    `@agentic/fixtures`' `generateFixtureRepo` — that generator produces an
    SDLC-shaped repo, not a core-only one) with contracts/state.yaml as the
    plan's core-instance fixture (gates {intake, publish}, no
    branch/budget/tasks) and runs/demo/state.yaml on the default branch using
    those two gates. Asserts AC4.1 (readState: error null, generic non-null),
    AC4.2 (summarizeRun: phase 'intake', malformed null, gate keys exactly
    ['intake','publish']), deriveReadiness zero items, and AC4.3
    (validateArtifact ok true against the fixture source's own templates).
    Also carries the AC5.2 regression guard against this repository's own
    wordfreq run (phase 'done', gate keys exactly G0..G3) as an extra
    belt-and-suspenders check alongside the untouched real-repo.test.ts.
  - Verification: `npm run typecheck` in frontend/ passes clean across both
    tsconfig projects (root + web) with zero errors. `npm test` in frontend/:
    45 passed | 1 skipped test files, 419 passed | 1 skipped tests, 0
    failures — includes readiness.test.ts, profiles.test.ts,
    real-repo.test.ts, state-contract.test.ts and the new
    generic-host.test.ts all green. `npm install` was needed first (fresh
    checkout, no node_modules) and touched frontend/package-lock.json with
    only platform-metadata (libc tags, a `peer` flag) noise; reverted that
    file with `git checkout --` since it carries no real dependency change
    and sits outside this task's file_contact_surface — `git status`
    confirms the working tree now diffs only the four declared files.
  - No deviations from the plan's interface contracts; no escalations.

  Round 2 (implementer): addressed review-04's three findings, all in the
  file_contact_surface (test/generic-host.test.ts and
  src/view-model/portfolio.ts).
  - F1 (blocking, fixed): added a kill-fixture describe block to
    generic-host.test.ts, per the reviewer's suggested case. The fixture
    contract (contracts/state.yaml) declares three gates in order
    intake/review/publish; the run file (runs/demo/state.yaml) lists only
    two of them, out of that order (publish before intake), omitting
    `review` entirely. Assertions: `Object.keys(summary.gates)` deep-equals
    `['intake', 'review', 'publish']` (contract order, not file order — kills
    the `Object.keys(generic.gates)` mutant, which would yield `['publish',
    'intake']` and drop `review`), `summary.gates.review` deep-equals the
    undecided shape `{ approved: false, decided: false, by: null, at: null
    }` (kills the unguarded `cell(generic.gates[id]!)` mutant, which throws
    reading `.approved` of `undefined` for the absent gate), and
    `summary.gates.publish`/`summary.gates.intake` assert the present-gate
    values are unaffected. I proved both kills by hand: patched
    `portfolio.ts` to each mutant in turn, reran the new test, watched it
    fail with the predicted error (`AssertionError: expected [ 'publish',
    'intake' ] to deeply equal [ 'intake', 'review', 'publish' ]` for (a),
    `TypeError: Cannot read properties of undefined (reading 'approved')` at
    `cell` for (b)), then restored the correct source before moving on —
    confirmed the fix is back to identical-to-round-1 via `diff` against a
    pre-edit backup.
  - F2 (minor, fixed): extended the same kill fixture rather than adding a
    second one, per the reviewer's suggestion. The run file has no `phase`
    key (asserts `summary.phase === '—'`, killing the `?? 'unknown'`
    mutant — proved: patching to `'unknown'` fails with `expected 'unknown'
    to be '—'`), a non-null `paused_reason: "waiting on legal"` (asserts
    `summary.pausedReason === 'waiting on legal'`, killing the `pausedReason:
    null` mutant — proved: patching to `null` fails with `expected null to
    be 'waiting on legal'`), and two escalations, one resolved and one not
    (asserts `summary.escalationsOpen === 1`, killing the no-filter
    `generic.escalations.length` mutant — proved: patching to drop the
    filter fails with `expected 2 to be 1`). All three fields are asserted
    in the one test case the reviewer asked for.
  - F3 (minor, fixed): changed the absent-gate fallback from the shared
    `UNDECIDED_CELL` constant to `{ ...UNDECIDED_CELL }` — a fresh object
    literal per cell, matching the file's own `emptyLedger()` idiom exactly
    (which clones a local `const c` per key rather than reusing one
    instance). Added a second kill-fixture test,
    "the absent-gate cell is a fresh object per summary, not one shared
    mutable instance", asserting `first.gates.review` and
    `second.gates.review` from two independent `summarizeRun` calls are
    `not.toBe` each other (reference inequality) — this also happens to
    re-kill the same unguarded-`cell()` mutant from F1 (accessing `.review`
    on `undefined` throws before the `not.toBe` assertion runs), so F1 and
    F3 are cross-checked by the same new test.
  - Verification: `npm install` was needed again (fresh checkout state
    inherited from round 1's dispatch, no node_modules) — reverted the
    resulting `frontend/package-lock.json` churn with `git checkout --`
    exactly as round 1 did; `git status` now diffs only
    `src/view-model/portfolio.ts` and `test/generic-host.test.ts`. `npm test`
    in frontend/: 45 passed | 1 skipped test files, 421 passed | 1 skipped
    tests, 0 failures (two more tests than round 1's 419, from the new kill
    fixture's two cases). `npm run typecheck` in frontend/: clean, both
    tsconfig projects (root + web), zero errors.
  - No further deviations; no escalations. All three findings addressed by
    fix (none rebutted — F3's PLAUSIBLE-only rationale was reasonable but
    the one-token fix is cheaper than a rebuttal).
