id: 04-docs-landed
title: Update INTEGRATION.md and DESIGN.md to describe the split as landed
requirements: [R7]

scope: |
  Update the two framework docs so the split reads as landed, not pending.
  The contract layout being documented (plan ADR-1): contracts/state-core.yaml
  is the generic core (run identity, host-named gates, escalations, pause);
  contracts/state.yaml is the SDLC extension and remains a complete template;
  the frontend resolves state shape from the target repo's own contract.

  docs/INTEGRATION.md (AC7.1) — every current mention treats the split as a
  future/"active run"; update each:
  - §3 (~line 152-158, "Vendored trees are not the only channel"): the
    compiled-in run-state schema boundary is fixed — state now validates
    against the host's own contracts/state.yaml (core, or SDLC extension),
    landed in run state-contract-split-2.
  - §4 (~line 238-249, fork-and-record worst case): the upstream fix has
    landed (name the two files); non-SDLC hosts instantiate the core instead
    of forking. Keep the historical narrative of integration #2's fork intact
    (it is a record of what happened).
  - §5 (~line 363-372, frontend read check): remove the "Precondition: the
    state-contract split" sentence or rewrite it to point at this run as done;
    note the residual limitation from plan ADR-6 honestly (core read paths and
    the API generalize; the cli/web gate-glyph cells still assume SDLC ids
    pending a follow-up).
  - §9 risk table (~line 455): the mitigation is no longer "active run" —
    mark landed.
  - §11 sequencing note (~line 488) and §3 (~line 134-137): the split no
    longer blocks tagging; note the one release-prep item this run deferred:
    adding contracts/state-core.yaml to scripts/copy-manifest.json (ADR-6).
  Verify: `grep -n "state-contract split" docs/INTEGRATION.md` shows no
  future-tense/pending description.

  docs/DESIGN.md (AC7.2) — §5 artifact-contract table (~line 201): update the
  state.yaml row to reflect the core/extension split, or add an explicit note
  that the row's scope is the SDLC extension (state-core.yaml carries the
  generic core). Keep the table's one-line format.

  Touch only these two files (AC6.1). No non-SDLC vocabulary or examples
  (R6). Write in the docs' existing voice; keep edits minimal and local.

file_contact_surface:
  - docs/INTEGRATION.md
  - docs/DESIGN.md

acceptance_tests:
  - AC7.1
  - AC7.2
  - "grep -n 'state-contract split' docs/INTEGRATION.md shows no pending/future-tense description"
  - "git diff touches only docs/INTEGRATION.md and docs/DESIGN.md"

depends_on: []

status: pending

notes: |
  Round 2 — response to review-02.md findings:

  F1 (major, docs/INTEGRATION.md:497-498) — FIXED. Verified against
  scripts/integrate.py directly: the file contains zero occurrences of the
  string "state" in its ~482 lines, so it performs no state-file checks of
  any kind, not even presence-only ones. The §11 sequencing note's claim
  that "`validate`'s state checks ... already read the split schema" was
  false. Rewrote the sentence to attribute split-schema reading to the
  frontend read check only, and added an explicit sentence stating that
  `validate` does not parse state-file contents at all and that a
  state-shape check there remains future tooling this run did not build.

  F2 (major, frontend-behavior landed-voice claims depend on tasks 02/03) —
  NO PROSE CHANGE. Checked branch state directly: `git log` and both task
  files' `status:` fields show 02-state-contract-resolution and
  03-generic-read-path still have zero landed commits (status: pending,
  scope work not started). So the frontend-behavior prose this task wrote
  (state validates against the host's own contract; core-only hosts parse
  cleanly; the §9 mitigation marked landed) is not yet true against the
  actual frontend code — `parseRunState` is still compiled-SDLC-only and
  `validate.ts`'s state branch is still presence-only until 02/03 land.
  The review itself frames this correctly as a task-graph/merge-ordering
  matter, not a prose defect: this task's scope (dispatched round 1) was to
  document the split as landed per the plan's contract-layout description,
  it declares depends_on: [], and the prose is exactly what would be true
  once 02/03 merge alongside it. Rewriting the prose to hedge on 02/03's
  landing would fight the task's own scope and produce a doc that's wrong
  in the other direction the moment 02/03 do land. The real fix is a
  dependency edge (04 depends_on [02, 03]) or an atomic-merge guarantee,
  which is a task-graph/G2 decision outside this task's file_contact_surface
  (docs/INTEGRATION.md, docs/DESIGN.md only) and outside what an
  implementer round can unilaterally decide. Flagging this explicitly so
  the overclaim window is a named, accepted risk for the orchestrator/G2 to
  resolve via sequencing, not a silent one.

  F3 (minor, docs/INTEGRATION.md:373-374) — FIXED. Added the qualifier the
  reviewer requested: the sentence now says hosts "whose contract declares
  only the generic core shape" parse cleanly, and adds a parenthetical
  naming the unfixed case per ADR-2's stated consequence — an SDLC-derived
  host that merely renames a gate still gets the compiled G0-G3 schema and
  still bounces.

  Re-ran acceptance checks: the grep for "state-contract split" in
  docs/INTEGRATION.md still shows no pending/future-tense description, and
  `git diff --name-only` touches only docs/INTEGRATION.md and this task file.
  docs/DESIGN.md needed no round-2 change — its AC7.2 row from round 1 was
  reviewed clean and none of the three findings touch it. Both files remain
  inside the declared file_contact_surface.
