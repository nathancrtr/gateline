id: 05-web-staged-state-arm
title: "Staged rendering + Arm control: chips, DecidePanel branch, inbox routing"
requirements: [R5, R6, R7]

scope: |
  Fix the click-to-error defect and render the staged rest state distinctly, per
  plan ADR-4/ADR-7 and the "Web rendering seams" contract. Visual details follow
  the candidate named in runs/web-staging/state.yaml gates.G1.notes (mockup
  04-staged-rest/03-staged-rest-state and the arm mockup in
  runs/web-staging/design/<candidate>/); both candidates specify hollow/outline
  form differences using existing tokens only. If the note names no candidate,
  stop and escalate.

  1. frontend/packages/web/src/components/chips.tsx:
     - PhaseChip: when phase === 'paused' && pausedReason === 'staged', render the
       staged treatment — hollow ring marker (bordered, transparent center, no glow
       shadow), accent tone, label 'staged' (not 'paused · staged'). All other
       phases, including other paused reasons, unchanged. Tokens from the existing
       set only; distinctness by form, not color alone (AC6.2).
     - KindChip: kind === 'staged' → outline pill labeled STAGED
       (border-accent, text-accent, transparent fill, hollow marker), distinct from
       the solid PAUSE pill.
  2. frontend/packages/web/src/components/decide.tsx:
     - Add a 'staged' item branch and an 'arm' mode to the Mode union: idle shows
       exactly one affordance, primary "Arm run…" (data-decide="arm"); it never
       renders Resume and never submits action 'resume' (AC6.1). Confirm step
       states the consequence (dispatch starts, budget begins metering — copy per
       the selected candidate) with a confirm button (data-decide="arm-confirm")
       submitting { action: 'arm' } through the existing api.decide mutation
       (AC5.1) — pending label 'Committing…'. Errors ride the existing
       ApiError→Flash paths: 400 DecisionError text shown verbatim in the error
       tone, 409 keeps the conflict re-present posture (AC5.2, ux REC11).
     - The paused branch stays exactly as-is for mid-flight pauses.
  3. frontend/packages/web/src/pages/inbox.tsx: itemHref — kind 'staged' →
     params.set('decide', 'staged').
  4. frontend/packages/web/src/pages/run.tsx: only if the selected candidate is
     genesis-preview, add its display-only genesis line in the run header
     (rendered from data already in the run detail payload — intake fields are in
     detail.state, the genesis commit is in detail.history; no new server data).
     Under two-voices, run.tsx needs no change (header distinctness comes from
     PhaseChip) — leave it untouched.
  The staged run's portfolio row, run header, and inbox card must acquire their
  staged treatment purely through these shared components (AC7.2) — do not add
  bespoke rendering paths in the pages.
  Wording guard: run the spec's grep targets (AC2.3, AC3.2) over
  frontend/packages/web/src before handoff; introduce no new matches.

file_contact_surface:
  - frontend/packages/web/src/components/chips.tsx
  - frontend/packages/web/src/components/decide.tsx
  - frontend/packages/web/src/pages/inbox.tsx
  - frontend/packages/web/src/pages/run.tsx

acceptance_tests:
  - "AC5.1 (control half): Arm issues POST /api/decisions {action:'arm'} and nothing else"
  - "AC5.2 (surface half): DecisionError/409 rendered as error/conflict, never a silent no-op"
  - "AC6.1: staged card's only affordance is Arm; no code path issues 'resume' for a staged item"
  - AC6.2
  - AC7.2
  - "cd frontend && npm run typecheck && npm run build pass"

depends_on: [02-core-staged-readiness]

status: pending

notes: |
  Round 1 (implementer): candidate = genesis-preview, per state.yaml gates.G1.notes
  ("I select the `genesis-preview` design."). Implemented all four scope items:
  (1) chips.tsx: PhaseChip early-returns the staged treatment (hollow ring, no
  glow, accent tone, label 'staged') only for phase==='paused' &&
  pausedReason==='staged'; all other phases/paused-reasons fall through
  unchanged. KindChip early-returns an outline STAGED pill (border-accent,
  text-accent, transparent fill, hollow ring marker) for kind==='staged',
  distinct from the solid PAUSE pill. (2) decide.tsx: added 'arm' to the Mode
  union; idle renders exactly one affordance for kind==='staged'
  (data-decide="arm", label "Arm run…"); confirm mode states the consequence
  (dispatch begins, budget starts metering) and a data-decide="arm-confirm"
  button submitting {action:'arm'} via the existing api.decide mutation,
  pending label "Committing…"; the paused branch (submitResume/'resume') is
  untouched and unreachable for staged items since it's a separate kind
  (ADR-4) — no code path this component owns can submit 'resume' for a staged
  item. Errors/409 ride the existing generic onError handler (unchanged) —
  no new Flash tone was needed since decide.tsx's scope here is only the
  staged/arm branch, not the staging-form's replay outcome (that's task 04's
  surface). (3) inbox.tsx: itemHref adds kind==='staged' -> ?decide=staged.
  (4) run.tsx: genesis-preview selected, so added the display-only genesis
  line to the run header, value-importing `readIntake` from
  `@agentic/core/record` (ADR-6 rider, already precedented in
  pages/new-run.tsx from task 04) — computed from detail.state's passthrough
  `intake:` block and the oldest entry in detail.history (the genesis
  commit); no new server data. Renders whenever a run carries an intake block
  (any run staged through the creation seam, staged or already armed), not
  gated only on the staged phase, matching mockup 05's armed-aftermath state
  which still shows the genesis line.

  Deviation: the STAGED kind-chip's fill is rendered fully transparent
  (bg-transparent), per this task's own scope text and plan.md's "Web
  rendering seams" section (both say "transparent fill" verbatim). The
  genesis-preview mockup's CSS (`04-staged-rest.html`/`05-arm.html`, class
  `.kchip`/`.k-staged`) instead uses a soft accent tint
  (`background:var(--accent-soft)`) with the same border/hollow-marker/label.
  I followed the task/plan text as authoritative since it is the more
  specific implementation instruction; the visual delta (no tint vs. a faint
  tint) is minor and the pill remains distinct in form (outline + hollow
  marker + label) per AC6.2's own test. Flagging for reviewer judgment in
  case the mockup's literal swatch was intended to govern instead.

  Verification: `cd frontend && npm run typecheck && npm run build` — both
  pass (typecheck: clean; build: vite build succeeds, 442 modules
  transformed). Full workspace `npm test`: 40 test files passed, 1 skipped,
  356 tests passed (0 failed) — unaffected by this diff (web has no unit-test
  harness per plan.md, consistent with tasks 01-04's verification pattern).
  Wording guard: `grep -rniE "openai|anthropic|complet(e|ion)|generate.*brief"
  frontend/packages/web/src` → no matches at all (exit 1/empty). `grep -rniE
  "octokit|jira|linear|tracker.*api" frontend/packages/web/src` → 2
  pre-existing matches in styles.css (`linear-gradient`, `animation: ... linear
  ...`), both outside this diff's four files and predating this task —
  confirmed via `git diff --stat` (only chips.tsx/decide.tsx/inbox.tsx/run.tsx
  touched) and a grep of the diff itself for the same patterns (no hits).
