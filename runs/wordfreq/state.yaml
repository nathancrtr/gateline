# Contract: maintained by Orchestrator (human in v0); read by everyone.
# Lives at runs/<slug>/state.yaml — the single source of truth for a run.

run: wordfreq
branch: run/wordfreq
phase: plan               # spec | plan | implement | integrate | release | done | paused
paused_reason: null       # set when phase=paused: budget-exhausted | round-cap | escalation | gate-declined

budget:
  cost_limit_usd: 5      # exhaustion pauses the run; it never silently degrades
  cost_spent_usd: 0

gates:                    # a gate entry is written ONLY by the named human
  G0: {approved: true, by: nthncrtr, at: 2026-07-07, notes: all 8 assumptions accepted as resolved}
  G1: {approved: false, by: null, at: null, notes: null}
  G2: {approved: false, by: null, at: null, notes: null}
  G3: {approved: false, by: null, at: null, notes: null}

tasks: []                 # mirrors tasks/*.yaml status for one-glance state; filled at G1

escalations: []           # append-only: {at, from_role, reason, resolved}
